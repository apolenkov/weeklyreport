# Production Docker Compose configuration.
# Usage: docker compose --env-file .env.production -f docker-compose.prod.yml up --build -d
#
# Tracing is OFF unless the operator supplies an external managed collector
# explicitly. A baked-in endpoint would report "started" while exporting into
# a nonexistent host, losing every trace silently.
# With the endpoint absent the api boots without traces and says so at warn.
#
# Differences from docker-compose.yml:
# - No mutable application or backup-script bind mounts
# - Restart policies on all services
# - Health checks on all services including web
# - Resource limits per service
# - Internal-only networking for postgres/redis (no host ports)
# - JSON-file logging with rotation

# One immutable internal origin is shared by the Next build (rewrites) and the
# standalone server (server-side fetches). It is intentionally not an
# operator-provided variable: changing one phase without the other creates a
# production split-brain route.
x-production-api-url: &production-api-url http://api:3001

services:
  # Compose cannot validate a password's use as a URL component. Fail before
  # any database-dependent service starts instead of silently truncating or
  # misparsing a password containing reserved URL characters.
  config-guard:
    image: postgres:15.19-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    command:
      - sh
      - -ec
      - |
        case "$$DB_PASSWORD" in
          *[!A-Za-z0-9._~-]*)
            echo "DB_PASSWORD must contain only URL-safe unreserved characters" >&2
            exit 1
            ;;
        esac
        case "$$POSTGRES_DB" in
          ""|*[!A-Za-z0-9_]*)
            echo "POSTGRES_DB must contain only letters, digits, and underscores" >&2
            exit 1
            ;;
        esac
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    environment:
      POSTGRES_USER: customreport
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U customreport -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      config-guard:
        condition: service_completed_successfully

  # PgBouncer in transaction mode fronts Postgres for the api's runtime traffic;
  # migrate bypasses it with a DATABASE_URL aimed straight at postgres:5432,
  # since DDL needs session-mode. Pool: ~20 backend conns serving ~100 clients.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340
    environment:
      DB_USER: customreport
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:?set pgbouncer max client connections (e.g. 100)}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:?set pgbouncer pool size (e.g. 20)}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:?set pgbouncer reserve pool size (e.g. 5)}
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: DISCARD ALL
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$$DB_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$$DB_USER" -d "$$DB_NAME" -w -tAc ''SELECT 1'' >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # A replicated volume is not a backup: it faithfully replicates a DROP TABLE
  # and an encrypted-by-ransomware datadir too. This service is the RECOVERY
  # MECHANISM (periodic pg_dump + retention + a staleness healthcheck); the
  # RECOVERY POLICY is whatever the operator sets the two required intervals
  # to, and where they replicate the pgbackups volume off this host. Nothing
  # here ships backups off-box — an unreplicated local dump survives a bad
  # migration, not a dead disk.
  backup:
    # The image is built from the same digest-pinned postgres base and contains
    # every backup/restore entrypoint. No host script bind mounts are allowed:
    # the running artifact must be the one that was built and reviewed.
    build:
      context: ./deploy/postgres
      dockerfile: Dockerfile.backup
      args:
        BUILD_VERSION: ${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    image: customreport-backup:${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    command: ["/usr/local/bin/backup-loop.sh"]
    environment:
      # Direct to postgres, not pgbouncer: pg_dump needs one session for the
      # whole dump, which transaction-mode pooling cannot hold.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: customreport
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB must be set}
      RESTORE_ENVIRONMENT: production
      BACKUP_DIR: /backups
      # Required with no default: cadence sets the intended local recovery-point
      # interval, while retention sets the local history window. Neither value
      # proves production RPO/RTO until a scheduled restore drill measures them.
      # 3600 = hourly, 14 = keep two weeks.
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:?set the intended local backup cadence in seconds (e.g. 3600)}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?set how many days of dumps to keep (e.g. 14) — older ones are deleted}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness proves nothing here: a loop whose every pg_dump fails looks
      # identical to a working one until someone needs a restore. Health is
      # "a recent dump exists".
      test: ["CMD", "/usr/local/bin/backup-health.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      # Allow one full cadence before the first verdict.
      start_period: ${BACKUP_INTERVAL_SECONDS:?set the intended local backup cadence in seconds (e.g. 3600)}s
    restart: unless-stopped
    volumes:
      - pgbackups:/backups
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--maxmemory",
        "200mb",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrator
      args:
        BUILD_VERSION: ${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    image: customreport-migrate:${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      # Migrations connect directly to PostgreSQL because DDL needs a session.
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

  # Internal Gotenberg PDF renderer — reached only by the api over the compose
  # network: no published port and no ingress route. There is deliberately no
  # api depends_on edge: the renderer is a runtime-optional capability whose
  # outage surfaces on /health/pdf-renderer and in retryable export failures,
  # never in boot ordering. Serialized conversions plus the clear-* flags keep
  # the one shared browser from leaking credentials or page state between
  # jobs. CHROMIUM_ALLOW_LIST is operator-set and must match the production
  # PDF_BASE_URL origin — the only outbound destination conversions may reach.
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium@sha256:0d28ae9a96441588ef739623726bd500ad0720b77266c6f1351a13e333fbd61c
    environment:
      API_TIMEOUT: 150s
      CHROMIUM_MAX_CONCURRENCY: 1
      CHROMIUM_CLEAR_COOKIES: "true"
      CHROMIUM_CLEAR_STORAGE: "true"
      CHROMIUM_CLEAR_CACHE: "true"
      CHROMIUM_ALLOW_LIST: ${CHROMIUM_ALLOW_LIST:?CHROMIUM_ALLOW_LIST must be set (anchored regex matching the PDF_BASE_URL origin)}
      CHROMIUM_DENY_PRIVATE_IPS: "true"
      CHROMIUM_DENY_PUBLIC_IPS: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        BUILD_VERSION: ${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    image: customreport-api:${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@pgbouncer:5432/${POSTGRES_DB:?POSTGRES_DB must be set}?pgbouncer=true&connection_limit=1
      DB_POOL_MAX: ${DB_POOL_MAX:?DB_POOL_MAX must be set}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:?DB_POOL_IDLE_TIMEOUT_MS must be set}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:?DB_POOL_CONNECTION_TIMEOUT_MS must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:?REDIS_DB is required}
      # Must match the redis `--maxmemory 200mb` above; the DLQ monitor derives
      # its 80%-of-cap memory alert from this value. Kept a literal (not an
      # overridable interpolation) so the two cannot drift.
      REDIS_MAXMEMORY_BYTES: 209715200
      AI_PROVIDER_CONFIG_ENCRYPTION_KEY: ${AI_PROVIDER_CONFIG_ENCRYPTION_KEY:?AI_PROVIDER_CONFIG_ENCRYPTION_KEY must be set}
      AI_PROVIDER_CONFIG_KEY_VERSION: ${AI_PROVIDER_CONFIG_KEY_VERSION:?AI_PROVIDER_CONFIG_KEY_VERSION must be set}
      AI_PROVIDER_ALLOWED_ORIGINS: ${AI_PROVIDER_ALLOWED_ORIGINS:?AI_PROVIDER_ALLOWED_ORIGINS must be set}
      REPORT_ASSISTANT_OUTBOUND_DATA_APPROVED: ${REPORT_ASSISTANT_OUTBOUND_DATA_APPROVED:?REPORT_ASSISTANT_OUTBOUND_DATA_APPROVED must be set}
      REPORT_ASSISTANT_INPUT_VERSION: ${REPORT_ASSISTANT_INPUT_VERSION:?REPORT_ASSISTANT_INPUT_VERSION must be set}
      REPORT_ASSISTANT_SIMILARITY_THRESHOLD: ${REPORT_ASSISTANT_SIMILARITY_THRESHOLD:?REPORT_ASSISTANT_SIMILARITY_THRESHOLD must be set}
      REPORT_ASSISTANT_CANDIDATE_LIMIT: ${REPORT_ASSISTANT_CANDIDATE_LIMIT:?REPORT_ASSISTANT_CANDIDATE_LIMIT must be set}
      REPORT_ASSISTANT_READ_THROUGH_LIMIT: ${REPORT_ASSISTANT_READ_THROUGH_LIMIT:?REPORT_ASSISTANT_READ_THROUGH_LIMIT must be set}
      REPORT_ASSISTANT_EXHAUSTIVE_LIMIT: ${REPORT_ASSISTANT_EXHAUSTIVE_LIMIT:?REPORT_ASSISTANT_EXHAUSTIVE_LIMIT must be set}
      REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET: ${REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET:?REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET must be set}
      REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS: ${REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS:?REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS must be set}
      REPORT_ASSISTANT_PLANNER_MAX_TOKENS: ${REPORT_ASSISTANT_PLANNER_MAX_TOKENS:?REPORT_ASSISTANT_PLANNER_MAX_TOKENS must be set}
      REPORT_ASSISTANT_ANSWER_MAX_TOKENS: ${REPORT_ASSISTANT_ANSWER_MAX_TOKENS:?REPORT_ASSISTANT_ANSWER_MAX_TOKENS must be set}
      REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE: ${REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE:?REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE must be set}
      REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET: ${REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET:?REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET must be set}
      PORT: 3001
      API_HOST: 0.0.0.0
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      # APP_BASE_URL backs reminder email links; required (no localhost fallback).
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      # Optional CSV of additional CORS origins.
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      AUTH_DEV_MODE: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set (min 32 chars)}
      # env.schema requires PDF_EXPORT_JWT_SECRET (min 32) with no default, so it
      # MUST be set explicitly here — never the throwaway dev value.
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:?PDF_EXPORT_JWT_SECRET must be set (min 32 chars, NOT the dev value)}
      PDF_BASE_URL: ${PDF_BASE_URL:?PDF_BASE_URL must be set}
      GOTENBERG_URL: ${GOTENBERG_URL:?GOTENBERG_URL must be set}
      PDF_OUTPUT_DIR: /app/data/pdfs
      LOG_LEVEL: ${LOG_LEVEL:?set the API log level (e.g. info)}
      LOG_DIR: /app/logs
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:?set telemetry posture (true disables the SDK, false enables it when an endpoint is set)}
      # NO default endpoint on purpose (repo rule: no silent defaults for
      # product config): tracing is ON only when the operator supplies a
      # managed collector explicitly through OTEL_EXPORTER_OTLP_ENDPOINT.
      # Absent -> the api boots with tracing OFF and says so at warn level;
      # a baked-in default would report "started" while exporting into a
      # nonexistent host, losing every trace silently.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Release identity is required for every production deployment so a later
      # telemetry enablement cannot inherit the development fallback.
      OTEL_SERVICE_NAME: customreport-api
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:?set the trace sample rate (e.g. 0.1)}
      # /health/ready heap threshold (bytes) — required, no schema default.
      # Set to ~75% of the api container memory limit.
      HEAP_HEALTH_THRESHOLD_BYTES: ${HEAP_HEALTH_THRESHOLD_BYTES:?set to ~75% of api container memory}
      # SMTP — real provider required in prod.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set in production}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set in production}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set in production}
      # SAML / Keycloak — env.schema.ts requires these whenever AUTH_DEV_MODE=false.
      KEYCLOAK_SAML_CALLBACK_URL: ${KEYCLOAK_SAML_CALLBACK_URL:?KEYCLOAK_SAML_CALLBACK_URL must be set}
      KEYCLOAK_SAML_ENTRY_POINT: ${KEYCLOAK_SAML_ENTRY_POINT:?KEYCLOAK_SAML_ENTRY_POINT must be set}
      KEYCLOAK_SAML_ISSUER: ${KEYCLOAK_SAML_ISSUER:?KEYCLOAK_SAML_ISSUER must be set}
      KEYCLOAK_SAML_CERT: ${KEYCLOAK_SAML_CERT:?KEYCLOAK_SAML_CERT must be set}
      # Optional production overrides use null-valued entries so Compose passes
      # them through only when the operator sets them; unset values stay absent
      # and retain the typed consumer defaults.
      SENTRY_DSN: ${SENTRY_DSN:-}
      CLIENT_LOG_FORWARDING: ${CLIENT_LOG_FORWARDING:?CLIENT_LOG_FORWARDING must be set (true or false)}
      PRODUCT_FEEDBACK_ENABLED: ${PRODUCT_FEEDBACK_ENABLED:?PRODUCT_FEEDBACK_ENABLED must be set (true or false)}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The override tunes the intervals (a faster 15s loop, 5s
      # timeout) for the compose network, not because the endpoint differs.
      # /health/ready checks DB + Redis + both BullMQ workers/queues + memory,
      # so the container marks healthy only when actually serving; start_period
      # 60s spans migration, worker connections, and tRPC bootstrap.
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3001/health/ready || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # API shutdown has a documented 12.5s worst-case application budget. The
    # 20s grace period leaves margin for signal delivery and runtime teardown;
    # BullMQ workers/queues force-close their Redis handles inside that budget.
    stop_grace_period: 20s
    # API is not host-published — all external traffic flows through the
    # Caddy edge over the compose network, mirroring the expose-only posture
    # applied to web. Closing the host port also removes the direct-to-host API
    # path that could bypass edge controls / forge X-Forwarded-For once trust
    # proxy is enabled. Use a 127.0.0.1-bound publish only if a documented ops
    # need requires host access.
    expose:
      - "3001"
    volumes:
      - pdfdata:/app/data/pdfs
      - apilogs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD time and
      # cannot be overridden at runtime. API_URL here is the fixed internal origin
      # baked into the next.config.ts rewrites — a literal, NOT an operator
      # value, so a stray shell API_URL cannot bake a broken rewrite. The
      # Dockerfile requires the server-side API origin and explicit telemetry
      # toggles; these values are baked into the client bundle at build time.
      args:
        NEXT_PUBLIC_AUTH_STUB: "false"
        NEXT_PUBLIC_DEV_ROLE_SWITCHER: "false"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_APP_VERSION: ${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
        API_URL: *production-api-url
        NEXT_PUBLIC_CLIENT_LOG_FORWARDING: ${NEXT_PUBLIC_CLIENT_LOG_FORWARDING:?NEXT_PUBLIC_CLIENT_LOG_FORWARDING must be set (true or false)}
        NEXT_PUBLIC_WEB_VITALS: ${NEXT_PUBLIC_WEB_VITALS:?NEXT_PUBLIC_WEB_VITALS must be set (true or false)}
        NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED: ${NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED:?NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED must be set (true or false)}
        NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES: ${NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES:?NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES must be set (for example admin or admin,head)}
    image: customreport-web:${OTEL_SERVICE_VERSION:?set the deployed release version (for example the Git SHA)}
    environment:
      # Only server-side vars (read at runtime) belong here: NEXT_PUBLIC_* is
      # inlined at BUILD time via build.args above, so a runtime line for it
      # would be a no-op. Keep this identical to the build-time rewrite origin.
      API_URL: *production-api-url
      # Cache-revalidation CSRF checks compare browser Origin to this public
      # origin instead of the container's internal listener address.
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      # Feeds sentry.server.config.ts, so Server-Component failures (root
      # generateMetadata, getOrgPublic) and instrumentation.ts onRequestError
      # reach the configured Sentry-compatible endpoint. Optional like the api's: unset means log-only, and every
      # such failure still writes to this service's stderr.
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Web is not published to the host directly — Caddy fronts it.
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Caddy edge — TLS termination + reverse-proxy + security headers.
  # Routes /trpc, /auth, /health, /admin/queues, /api/web-vitals,
  # /api/client-logs and /pdfs -> api; /metrics remains internal-only on the
  # compose network; everything else -> web.
  # Auto-HTTPS uses Let's Encrypt when CADDY_SITE_ADDRESS resolves publicly.
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS must be set (e.g. customreport.example.com or http://localhost)}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL must be set (ACME account email)}
      # Collector URL the enforcing CSP header POSTs each violation report to
      # (a Sentry-compatible security endpoint or a same-origin sink). Required, no
      # default: an enforcing CSP with an unset report target would drop every
      # violation silently.
      CADDY_CSP_REPORT_URI: ${CADDY_CSP_REPORT_URI:?CADDY_CSP_REPORT_URI must be set (CSP violation-report collector URL)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Probe Caddy's local admin API so liveness covers the running proxy.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:?set the host HTTP port (e.g. 80)}:80"
      - "${HTTPS_PORT:?set the host HTTPS port (e.g. 443)}:443"
      - "${HTTPS_PORT_QUIC:?set the host HTTPS/QUIC UDP port (e.g. 443)}:443/udp"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  # Replicate this volume off-host — a dump that dies with the disk it was
  # taken from only protects against bad writes, not lost hardware.
  pgbackups:
  redisdata:
  pdfdata:
  apilogs:
  caddy_data:
  caddy_config:
