# Production Docker Compose configuration.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Tracing is OFF unless the operator supplies a collector explicitly (no
# baked-in default — a default endpoint would report "started" while
# exporting into a nonexistent host, losing every trace silently). To ship
# traces, compose the observability overlay, which sets the endpoint:
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
# or export OTEL_EXPORTER_OTLP_ENDPOINT for an external managed collector.
# With the endpoint absent the api boots without traces and says so at warn.
#
# Differences from docker-compose.yml:
# - No bind mounts (images are self-contained)
# - Restart policies on all services
# - Health checks on all services including web
# - Resource limits per service
# - Internal-only networking for postgres/redis (no host ports)
# - JSON-file logging with rotation

services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_USER: customreport
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: customreport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customreport"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PgBouncer in transaction mode fronts Postgres for the api's runtime traffic;
  # migrate bypasses it with a DATABASE_URL aimed straight at postgres:5432,
  # since DDL needs session-mode. Pool: ~20 backend conns serving ~100 clients.
  pgbouncer:
    # 1.22.1-p0 is the NEWEST 1.22.1 packaging revision published on Docker
    # Hub (registry-verified: the -p2 tag this file used to name was never
    # published — it could not be pulled, so this pin is a correction, not a
    # downgrade). Digest-pinned per the supply-chain floor.
    image: edoburu/pgbouncer:1.22.1-p0@sha256:7f39cf2f872c8d9a0bb0e6a5440c3bf5814036eccf284102870ab08e2603a2c7
    environment:
      DB_USER: customreport
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: customreport
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      AUTH_TYPE: scram-sha-256
      # Prisma (and most ORMs) disable prepared statements when
      # ?pgbouncer=true is set in the URL; keep this aligned.
      SERVER_RESET_QUERY: DISCARD ALL
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      postgres:
        condition: service_healthy
    # Query-path probe: run a real SELECT through pgbouncer's own listener
    # (127.0.0.1:5432, the path client traffic takes) so the check fails when
    # pgbouncer cannot actually reach and query Postgres — not merely when its
    # TCP listener accepts connections. pg_isready alone would report healthy
    # while every pooled query timed out. $$ passes the literal $ to the
    # container shell so DB_* resolve from the service environment, not at
    # compose-parse time.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$$DB_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$$DB_USER" -d "$$DB_NAME" -w -tAc ''SELECT 1'' >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # A replicated volume is not a backup: it faithfully replicates a DROP TABLE
  # and an encrypted-by-ransomware datadir too. This service is the RECOVERY
  # MECHANISM (periodic pg_dump + retention + a staleness healthcheck); the
  # RECOVERY POLICY is whatever the operator sets the two required intervals
  # to, and where they replicate the pgbackups volume off this host. Nothing
  # here ships backups off-box — an unreplicated local dump survives a bad
  # migration, not a dead disk.
  backup:
    # Same digest-pinned image as postgres: pg_dump must match the server
    # major version, and reusing it adds no new supply-chain surface.
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    command: ["/usr/local/bin/backup-loop.sh"]
    environment:
      # Direct to postgres, NOT pgbouncer — pg_dump needs one session for the
      # whole dump, which transaction-mode pooling cannot hold.
      PGHOST: postgres
      PGUSER: customreport
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATABASE: customreport
      BACKUP_DIR: /backups
      # Required with no default, both of them: together they ARE the
      # recovery-point objective. A default would invent an RPO nobody agreed
      # to and silently delete history on that schedule. 3600 = hourly,
      # 14 = keep two weeks.
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:?set the backup cadence in seconds (e.g. 3600) — this is your RPO}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:?set how many days of dumps to keep (e.g. 14) — older ones are deleted}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Liveness proves nothing here: a loop whose every pg_dump fails looks
      # identical to a working one until someone needs a restore. Health is
      # "a recent dump exists".
      test: ["CMD", "/usr/local/bin/backup-health.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      # One full cadence before the first verdict, so a fresh stack is not
      # reported unhealthy merely for having taken no backup yet.
      start_period: ${BACKUP_INTERVAL_SECONDS:?set the backup cadence in seconds (e.g. 3600) — this is your RPO}s
    restart: unless-stopped
    volumes:
      - pgbackups:/backups
      - ./deploy/postgres/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - ./deploy/postgres/backup-health.sh:/usr/local/bin/backup-health.sh:ro
      - ./deploy/postgres/restore.sh:/usr/local/bin/restore.sh:ro
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--maxmemory",
        "200mb",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrator
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      # migrate connects DIRECTLY to postgres (bypassing pgbouncer) because DDL
      # needs session-mode — that is what DATABASE_URL below encodes. Prisma
      # reads only DATABASE_URL; DIRECT_URL is the direct-connection escape hatch.
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/customreport
      DIRECT_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/customreport
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # 39-01: api connects through pgbouncer (transaction-mode) instead of
      # postgres directly. The PrismaPg pg-pool adapter (prisma.service.ts)
      # opens its own per-process pool against pgbouncer; pgbouncer multiplies
      # those connections into a smaller pool against postgres. The query-string
      # flags below are no-ops at the Prisma 7 client layer but are kept as
      # explicit documentation of intent — they also prevent any future tool
      # that DOES honour them from over-pooling.
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@pgbouncer:5432/customreport?pgbouncer=true&connection_limit=1
      # DIRECT_URL is reserved as an escape hatch for tooling that needs to
      # bypass pgbouncer (introspection, manual DDL, etc.). Not used at the
      # Prisma client layer in v7.
      DIRECT_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/customreport
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Must match the redis `--maxmemory 200mb` above; the DLQ monitor derives
      # its 80%-of-cap memory alert from this value. Kept a literal (not an
      # overridable interpolation) so the two cannot drift.
      REDIS_MAXMEMORY_BYTES: 209715200
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      # APP_BASE_URL backs reminder email links; required (no localhost fallback).
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set}
      # 36-04: optional CSV of additional CORS origins.
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      AUTH_DEV_MODE: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set (min 32 chars)}
      # env.schema requires PDF_EXPORT_JWT_SECRET (min 32) with no default, so it
      # MUST be set explicitly here — never the throwaway dev value.
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:?PDF_EXPORT_JWT_SECRET must be set (min 32 chars, NOT the dev value)}
      PDF_BASE_URL: ${PDF_BASE_URL:?PDF_BASE_URL must be set}
      PDF_OUTPUT_DIR: /app/data/pdfs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      # NO default endpoint on purpose (repo rule: no silent defaults for
      # product config): tracing is ON only when the operator supplies the
      # collector explicitly — compose the observability overlay (which sets
      # it) or export OTEL_EXPORTER_OTLP_ENDPOINT for a managed collector.
      # Absent -> the api boots with tracing OFF and says so at warn level;
      # a baked-in default would report "started" while exporting into a
      # nonexistent host, losing every trace silently.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Trace/log resource identity, read via requireEnv once the SDK starts:
      # an endpoint-enabled deploy that leaves the release version unset fails
      # at boot instead of publishing traces under a stale build label.
      OTEL_SERVICE_NAME: customreport-api
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # /health/ready heap threshold (bytes) — required, no schema default.
      # Set to ~75% of the api container memory limit.
      HEAP_HEALTH_THRESHOLD_BYTES: ${HEAP_HEALTH_THRESHOLD_BYTES:?set to ~75% of api container memory}
      # 38-01 SMTP — real provider required in prod.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set in production}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set in production}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set in production}
      # SAML / Keycloak — env.schema.ts requires these whenever AUTH_DEV_MODE=false.
      KEYCLOAK_SAML_CALLBACK_URL: ${KEYCLOAK_SAML_CALLBACK_URL:?KEYCLOAK_SAML_CALLBACK_URL must be set}
      KEYCLOAK_SAML_ENTRY_POINT: ${KEYCLOAK_SAML_ENTRY_POINT:?KEYCLOAK_SAML_ENTRY_POINT must be set}
      KEYCLOAK_SAML_ISSUER: ${KEYCLOAK_SAML_ISSUER:?KEYCLOAK_SAML_ISSUER must be set}
      KEYCLOAK_SAML_CERT: ${KEYCLOAK_SAML_CERT:?KEYCLOAK_SAML_CERT must be set}
      # Optional coverage vars (all .optional() in envSchema). In prod, forward
      # SENTRY_DSN for error capture and CLIENT_LOG_FORWARDING=true to accept the
      # browser log forwarder; the rest (TG_BOT_TOKEN, AUTH_DEV_MODE_ALLOW_TEST,
      # CUSTOMREPORT_REPO_ROOT, DLQ_ALERT_THRESHOLD, AUTH_JWT_COOKIE_NAME) stay
      # at their consumer defaults unless a deploy needs the override.
      SENTRY_DSN: ${SENTRY_DSN:-}
      CLIENT_LOG_FORWARDING: ${CLIENT_LOG_FORWARDING:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Same /health/ready endpoint the image now bakes in by default; this
      # override exists only to tune the intervals (a faster 15s loop, 5s
      # timeout) for the compose network, not because the endpoint differs.
      # /health/ready checks DB + Redis + BullMQ + memory, so the container
      # marks healthy only when actually serving; start_period 60s spans the
      # first migration + tRPC bootstrap so they don't flap the loop.
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3001/health/ready || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # api is no longer host-published — all external traffic flows through the
    # Caddy edge over the compose network, mirroring the expose-only posture
    # applied to web. Closing the host port also removes the direct-to-host API
    # path that could bypass edge controls / forge X-Forwarded-For once trust
    # proxy is enabled. Use a 127.0.0.1-bound publish only if a documented ops
    # need requires host access.
    expose:
      - "3001"
    volumes:
      - pdfdata:/app/data/pdfs
      - apilogs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      # NEXT_PUBLIC_* values are inlined into the client bundle at BUILD time and
      # cannot be overridden at runtime. API_URL here is the fixed internal origin
      # baked into the next.config.ts rewrites — a literal, NOT the runtime
      # ${API_URL}, so a stray shell API_URL can't bake a broken rewrite. The base
      # Dockerfile.web ARGs default to dev values; production overrides them here.
      args:
        NEXT_PUBLIC_AUTH_STUB: "false"
        NEXT_PUBLIC_DEV_ROLE_SWITCHER: "false"
        API_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
    environment:
      # Only the server-side API_URL (read at runtime) belongs here: NEXT_PUBLIC_*
      # is inlined at BUILD time via build.args above, so a runtime line for it
      # would be a no-op. Required — a default would mask a misrouted origin.
      API_URL: ${API_URL:?API_URL must be set (server-side origin, e.g. http://api:3001)}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # 38-02: web is no longer published to the host directly — caddy fronts it.
    # Uncomment WEB_PORT mapping below if you bypass caddy in a dev-prod run.
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 38-02: Caddy edge — TLS termination + reverse-proxy + security headers.
  # Routes /trpc, /auth, /health, /metrics, /admin/queues -> api; everything
  # else -> web. WebSocket upgrade is automatic. Auto-HTTPS via Let's Encrypt
  # when CADDY_SITE_ADDRESS resolves publicly; swap deploy/caddy/Caddyfile
  # for Caddyfile.staging if you need caddy's internal CA instead.
  caddy:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS must be set (e.g. customreport.example.com or http://localhost)}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      # Collector URL the enforcing CSP header POSTs each violation report to
      # (a Sentry/Bugsink security endpoint or a same-origin sink). Required, no
      # default: an enforcing CSP with an unset report target would drop every
      # violation silently.
      CADDY_CSP_REPORT_URI: ${CADDY_CSP_REPORT_URI:?CADDY_CSP_REPORT_URI must be set (CSP violation-report collector URL)}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # caddy doesn't ship curl/wget in the alpine image, but the admin API on
      # :2019 always responds — use it for liveness.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT_QUIC:-443}:443/udp"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  # Replicate this volume off-host — a dump that dies with the disk it was
  # taken from only protects against bad writes, not lost hardware.
  pgbackups:
  redisdata:
  pdfdata:
  apilogs:
  caddy_data:
  caddy_config:
