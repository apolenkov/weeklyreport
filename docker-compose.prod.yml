# Production Docker Compose configuration.
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Differences from docker-compose.yml:
# - No bind mounts (images are self-contained)
# - Restart policies on all services
# - Health checks on all services including web
# - Resource limits per service
# - Internal-only networking for postgres/redis (no host ports)
# - JSON-file logging with rotation

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: customreport
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: customreport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customreport"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    # 38-01: routed through apps/api/scripts/migrate.sh so the same
    # entrypoint serves docker-compose AND a future K8s init-container.
    command: ["sh", "apps/api/scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/customreport
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/customreport
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      # 36-04: optional CSV of additional CORS origins.
      FRONTEND_URLS: ${FRONTEND_URLS:-}
      AUTH_DEV_MODE: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set (min 32 chars)}
      # 36-03: PDF_EXPORT_JWT_SECRET fence — schema rejects the dev fallback
      # in production, so this MUST be set.
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:?PDF_EXPORT_JWT_SECRET must be set (min 16 chars, NOT the dev fallback)}
      PDF_BASE_URL: ${PDF_BASE_URL:-http://web:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      # 38-01 SMTP — real provider required in prod.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set in production}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set in production}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set in production}
      # SAML / Keycloak — env.schema.ts requires these whenever AUTH_DEV_MODE=false.
      KEYCLOAK_SAML_CALLBACK_URL: ${KEYCLOAK_SAML_CALLBACK_URL:?KEYCLOAK_SAML_CALLBACK_URL must be set}
      KEYCLOAK_SAML_ENTRY_POINT: ${KEYCLOAK_SAML_ENTRY_POINT:?KEYCLOAK_SAML_ENTRY_POINT must be set}
      KEYCLOAK_SAML_ISSUER: ${KEYCLOAK_SAML_ISSUER:?KEYCLOAK_SAML_ISSUER must be set}
      KEYCLOAK_SAML_CERT: ${KEYCLOAK_SAML_CERT:?KEYCLOAK_SAML_CERT must be set}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # 38-01: ready (DB+Redis+BullMQ+memory) instead of live (memory only)
      # so the api container marks healthy only when actually serving.
      # start_period bumped 30→60s so first migration + tRPC bootstrap
      # doesn't flap the loop.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - pdfdata:/app/data/pdfs
      - apilogs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # 38-02: web is no longer published to the host directly — caddy fronts it.
    # Uncomment WEB_PORT mapping below if you bypass caddy in a dev-prod run.
    # ports:
    #   - "${WEB_PORT:-3000}:3000"
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # 38-02: Caddy edge — TLS termination + reverse-proxy + security headers.
  # Routes /trpc, /auth, /health, /metrics, /admin/queues -> api; everything
  # else -> web. WebSocket upgrade is automatic. Auto-HTTPS via Let's Encrypt
  # when CADDY_SITE_ADDRESS resolves publicly; swap deploy/caddy/Caddyfile
  # for Caddyfile.staging if you need caddy's internal CA instead.
  caddy:
    image: caddy:2.8-alpine
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?CADDY_SITE_ADDRESS must be set (e.g. customreport.example.com or http://localhost)}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # caddy doesn't ship curl/wget in the alpine image, but the admin API on
      # :2019 always responds — use it for liveness.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT_QUIC:-443}:443/udp"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  pdfdata:
  apilogs:
  caddy_data:
  caddy_config:
