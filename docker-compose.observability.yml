# Optional observability stack for local or production-like Compose runs.
#
# Brings up grafana/otel-lgtm (Grafana + Loki + Tempo + Prometheus + OTel Collector)
# alongside Postgres exporter, Redis exporter, and CustomReport dashboards.
# Bugsink (Sentry-compatible error tracking) is in docker-compose.errors.yml.
# Not part of the prod-default compose — the org typically has a managed stack already.
#
# Usage:
#   pnpm observability:up   # extends the current local Compose project
#   pnpm observability:down # removes only observability-owned services
#   docker compose --project-name customreport-production-observability \
#     --env-file .env.production -f docker-compose.prod.yml \
#     -f docker-compose.observability.yml up --build -d
#
# Grafana login: admin / the configured GRAFANA_ADMIN_PASSWORD  →  http://localhost:3003

services:
  # Composing this overlay is what turns api tracing ON: it supplies the
  # collector endpoint the base prod compose deliberately leaves unset.
  api:
    environment:
      OTEL_SDK_DISABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  otel-lgtm:
    image: grafana/otel-lgtm:0.34.0@sha256:b966ea107831d526d9eb8fe4d2d86c9e5731392fad9dce8296bcf2072031f07c
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:9090:9090"
    volumes:
      - lgtmdata:/data
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/customreport-dashboard.json:/var/lib/grafana/dashboards/customreport/operations/customreport-dashboard.json:ro
      - ./deploy/grafana/trpc-latency-dashboard.json:/var/lib/grafana/dashboards/customreport/operations/trpc-latency-dashboard.json:ro
      - ./deploy/grafana/product-telemetry-dashboard.json:/var/lib/grafana/dashboards/customreport/product/product-telemetry-dashboard.json:ro
      - ./deploy/prometheus-otel-lgtm.yml:/otel-lgtm/prometheus.yaml:ro
      - ./deploy/alert-rules.yml:/otel-lgtm/alert-rules.yml:ro
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    environment:
      # POSTGRES_DB is a Compose interpolation input, so it must come from the
      # root env file or shell. Dev uses the fixed local password from the base
      # stack; production already requires DB_PASSWORD and rejects URL-reserved
      # characters before postgres starts.
      DATA_SOURCE_NAME: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lgtmdata:
