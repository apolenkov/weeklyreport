# Optional observability stack for local or production-like Compose runs.
#
# Brings up grafana/otel-lgtm (Grafana + Loki + Tempo + Prometheus + OTel Collector)
# alongside Postgres exporter, Redis exporter, and CustomReport dashboards.
# Bugsink (Sentry-compatible error tracking) is in docker-compose.errors.yml.
# Not part of the prod-default compose — the org typically has a managed stack already.
#
# Usage:
#   pnpm observability:up   # dev layering incl. docker-compose.observability.dev.yml (last)
#   docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Grafana login: admin / the configured GRAFANA_ADMIN_PASSWORD  →  http://localhost:3003

services:
  # Composing this overlay is what turns api tracing ON: it supplies the
  # collector endpoint the base prod compose deliberately leaves unset.
  api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  otel-lgtm:
    image: grafana/otel-lgtm:latest@sha256:6e14b923e0130b8b294ca5bcc7c94d54e899d150817e6c3ed82d9b665afe5499
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9090:9090"
    volumes:
      - lgtmdata:/data
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/customreport-dashboard.json:/var/lib/grafana/dashboards/customreport/customreport-dashboard.json:ro
      # 47-03 (DX-03): tRPC latency dashboard
      - ./deploy/grafana/trpc-latency-dashboard.json:/var/lib/grafana/dashboards/customreport/trpc-latency-dashboard.json:ro
      # Phase 52 (UFB-054): product-KPI dashboard
      - ./deploy/grafana/product-telemetry-dashboard.json:/var/lib/grafana/dashboards/customreport/product-telemetry-dashboard.json:ro
      - ./deploy/prometheus-otel-lgtm.yml:/otel-lgtm/prometheus.yaml:ro
      - ./deploy/alert-rules.yml:/otel-lgtm/alert-rules.yml:ro
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    environment:
      # POSTGRES_DB is a compose INTERPOLATION input, so it must come from the
      # root .env or the shell — the copy in docker-compose.yml is service env,
      # which ${POSTGRES_DB} never sees. Prod exports it at deploy time.
      DATA_SOURCE_NAME: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lgtmdata:
