# Scenario Catalog — lead
# Durable behavioral catalog (role x route x intent + Given/When/Then prose).
# NO file:line, NOT exhaustive. Generated by generate-catalog.workflow.mjs,
# human-reviewed. Format contract: e2e/catalog/README.md
role: lead
generated: true
routes:
  - route: /
    access: [lead, head, admin, viewer]
    intents:
      - id: lead-auto-redirect-to-report
        intent: "Lead user auto-redirects from landing to their report form"
        given: "Lead user has an active session and is not in dev-mode auth-stub"
        when: "the landing page loads after authentication"
        then: "window.location.replace sends the user to /lead/report"
        note: "No console errors; visible in destination URL and route-specific page content"
      - id: lead-sso-sign-in
        intent: "Unauthenticated user initiates SSO sign-in (production mode)"
        given: "User has no active session and AUTH_STUB=false"
        when: "the user clicks the 'Sign in with SSO' button"
        then: "browser navigates to /auth/saml/login (or /auth/saml/login?next=... if a safe redirect is pending)"
        note: "Visible in button href; link text reads 'Sign in with SSO'; production environment only"
      - id: lead-dev-quick-login-last-role
        intent: "Dev user one-click resumes as last session's role"
        given: "AUTH_STUB=true and localStorage holds a saved LastRoleRecord including a lead role and email"
        when: "the landing page loads and the last-role hint appears, the user clicks the primary 'Enter Application' button"
        then: "browser navigates to /auth/dev-login?role=lead&email=<saved-email>&redirect=%2Flead%2Freport"
        note: "Visible in the Last session card showing 'lead1@customreport.local · Lead'; button aria-label reflects the saved name and role"
      - id: lead-dev-change-role
        intent: "Dev user switches to lead role from a different role before entering app"
        given: "AUTH_STUB=true and the user previously logged in as a different role (stored in localStorage)"
        when: "the user clicks 'Change role' to open the role switcher grid, then clicks the Lead tile"
        then: "browser navigates to /auth/dev-login?role=lead&email=lead1@customreport.local&redirect=%2Flead%2Freport"
        note: "Visible in the role-switcher grid showing four role tiles (Lead, Head, Admin, Viewer); clicking Lead tile applies the default lead email and dev-login path"
  - route: /lead/report
    access: [lead, head, admin]
    intents:
      - id: lead-report-bare-redirect
        intent: "Legacy bare report route redirects to canonical addressed form"
        given: "Lead visits /lead/report without a reportId path segment"
        when: "the form resolves the active reportId from the session"
        then: "the page performs a client-side redirect (router.replace) to /lead/report/<reportId> so the URL reflects the specific week being edited"
        note: "Redirect is suppressed when ?period= query parameter is present (legacy read-only bookmarks)"
      - id: lead-report-bare-period-readonly
        intent: "Legacy ?period= query parameter opens form in read-only mode without redirect"
        given: "Lead visits /lead/report?period=<week>"
        when: "the form loads the report data for that period"
        then: "the form renders in read-only mode and does NOT redirect to the canonical /lead/report/<reportId> URL, preserving back-compat for old email links and bookmarks"
        note: "The read-only banner displays 'Viewing past period' text with the period name"
  - route: /lead/report/[reportId]
    access: [lead, head, admin]
    intents:
      - id: lead-report-edit-items
        intent: "Edit current-week and next-week items"
        given: "The lead is on the report form in edit mode and the report is not submitted"
        when: "the lead clicks '+ Add Item' in a week section, opens an item card to edit, or deletes an item"
        then: "the item is added, modified, or removed from that week's list; the form shows the updated item count in the section badge, and the changes are captured in the autosave draft"
        note: "Items are grouped by product and SDLC stage; reordering and inline field editing happen within ItemEditDialog"
      - id: lead-report-edit-risks
        intent: "Edit risks and blockers"
        given: "The lead is on the report form in edit mode and the report is not submitted"
        when: "the lead clicks '+ Add Risk', opens a risk card to edit, or deletes a risk"
        then: "the risk is added, modified, or removed from the risks list; the form shows the updated risk count in the section badge, and the changes are captured in the autosave draft"
        note: "Risks include impact, mitigation, and affected stages; they are edited via RiskEditDialog"
      - id: lead-report-edit-decisions
        intent: "Edit decisions"
        given: "The lead is on the report form in edit mode and the report is not submitted"
        when: "the lead clicks '+ Add Decision', opens a decision card to edit, or deletes a decision"
        then: "the decision is added, modified, or removed from the decisions list; the form shows the updated decision count in the section badge, and the changes are captured in the autosave draft"
        note: "Decisions include owner, impact, deadline, and affected stages; they are edited via DecisionEditDialog"
      - id: lead-report-edit-product-status
        intent: "Set project or stage traffic-light status"
        given: "The lead is on the report form in edit mode and the report is not submitted"
        when: "the lead interacts with status controls (green/yellow/red traffic lights) for a project or stage"
        then: "the status is updated; the form marks it as dirty and queues it for autosave"
        note: "Status is tied to project and stage identifiers; undefined statuses are coerced to green before submit"
      - id: lead-report-autosave
        intent: "Automatically save draft changes"
        given: "The lead is in edit mode, has unsaved changes, and the report is not submitted"
        when: "the lead pauses editing or makes a change and no new edit arrives within the autosave debounce window"
        then: "the form sends the draft payload to the server, shows a brief 'Saving...' indicator, and displays 'Version N · HH:MM' once complete; a version snapshot is created on every successful autosave"
        note: "Autosave is silent on success and disabled when the report is submitted or read-only; failures show a toast error"
      - id: lead-report-save-now
        intent: "Manually trigger an immediate draft save"
        given: "The lead is in edit mode and has unsaved changes"
        when: "the lead clicks the 'Save Now' button"
        then: "the draft is sent to the server immediately, bypassing the debounce; the autosave indicator updates to show the save is complete"
        note: "This is a manual override of the automatic debounce; it still creates a version snapshot on success"
      - id: lead-report-navigate-periods
        intent: "Switch between reporting periods"
        given: "The lead is viewing the report form"
        when: "the lead clicks previous/next arrows in the period navigator or selects a period from the dropdown"
        then: "the form navigates to the selected period's report (the URL changes to /lead/report/{reportId}), loads that period's data, and switches to edit or view mode based on whether that period is the active reporting period"
        note: "The form enforces read-only mode for non-active periods; archived periods can be shown or hidden via the archive toggle"
      - id: lead-report-view-version-history
        intent: "Browse and restore historical snapshots"
        given: "The lead is viewing the report form and version history is available"
        when: "the lead clicks on a version number in the version history navigator or clicks 'Restore' on a historical snapshot"
        then: "the form shows a read-only overlay of that version's content; the 'Restore' button in the dialog replaces the current draft with that version's state"
        note: "Version snapshots are created automatically on every successful autosave; restoring a version asks for confirmation if there are unsaved changes"
      - id: lead-report-restore-version
        intent: "Reset current draft to a historical snapshot"
        given: "The lead is viewing a historical version and has unsaved changes"
        when: "the lead confirms the restore action in the version history dialog"
        then: "the current draft is replaced with the historical version's data; the form returns to editing the restored state and creates a new autosave"
        note: "A confirmation dialog appears if there are unsaved changes before restoring"
      - id: lead-report-fill-from-period
        intent: "Populate current draft with values from a prior reporting period"
        given: "The lead is in edit mode on a draft report"
        when: "the lead clicks 'Fill From' and selects a previous period"
        then: "the current draft is replaced with the selected period's values; the form shows a confirmation toast and asks for confirmation if there are unsaved changes"
        note: "This is a bulk copy of items, risks, and decisions from a prior period; it helps leads reuse baseline data across weeks"
      - id: lead-report-toggle-view-mode
        intent: "Switch between edit and slides presentation view"
        given: "The lead is on the report form"
        when: "the lead clicks the view-mode toggle button to switch from edit to slides (or vice versa)"
        then: "the page navigates to the same report with the query parameter ?mode=slides (or without it for edit mode); the form displays the content in presentation slides format instead of the editable form"
        note: "The URL changes to reflect the mode; slides mode is read-only but the lead can still navigate between periods and versions"
      - id: lead-report-toggle-archive-periods
        intent: "Show or hide archived (old) reporting periods"
        given: "The lead is on the report form"
        when: "the lead clicks the archive toggle in the period toolbar"
        then: "the period navigator shows or hides old archived periods based on the toggle state"
        note: "This is a view preference that persists within the session; archived periods are older reporting cycles"
      - id: lead-report-submit
        intent: "Submit the completed report to the head for review"
        given: "The lead is in edit mode on a draft report with required data filled in"
        when: "the lead clicks 'Submit Report' in the toolbar and confirms the submission in the dialog"
        then: "the report is sent to the server with a confirmed flag; the form shows 'Report submitted' toast, becomes read-only, and the Submit button is replaced with 'Request Reopen'"
        note: "Submission enforces that every project status has a value (undefined is coerced to green); the form invalidates queries and updates the dashboard on success"
      - id: lead-report-request-reopen
        intent: "Request that the head unlock a submitted section for further edits"
        given: "The lead has submitted the report and wants to make changes"
        when: "the lead clicks 'Request Reopen' and submits the dialog with an optional reason"
        then: "a reopen request is sent to the head with the reason; a 'Reopen request sent to Head' toast is shown; the request is pending until the head approves or denies it"
        note: "This is a polite path for leads to ask permission to re-edit; the head can accept the request and unlock the section or leave it locked"
      - id: lead-report-revoke
        intent: "Revoke a submitted report and return it to draft state (head/admin only)"
        given: "A head or admin is viewing a submitted report"
        when: "the head clicks 'Revoke' and confirms the action"
        then: "the report is returned to draft status, the lead is notified, and the form becomes editable again; the Revoke button is replaced with Submit Report"
        note: "This is a head/admin capability; it invalidates the dashboard and history queries"
      - id: lead-report-view-cross-author-items
        intent: "View items from co-leads who own overlapping product stages"
        given: "The lead is viewing the report form"
        when: "the form loads cross-author data for the current period"
        then: "items, risks, and decisions from other leads who own the same project stages are displayed in a read-only merged view alongside the current lead's items"
        note: "Cross-author items are fetched via leadForm.crossAuthors and leadForm.crossAuthorSections queries; they appear in the same sections but are not editable"
      - id: lead-report-view-read-only
        intent: "View past or submitted reports without editing capability"
        given: "The lead is viewing a non-active reporting period or a submitted report"
        when: "the form loads a historical period or a report in submitted state"
        then: "all edit controls (Add Item, Add Risk, etc.) are hidden or disabled; submit buttons are disabled; the form is presented in read-only mode with no autosave"
        note: "Read-only mode is enforced when period is set, when the report is submitted, or when byPeriodQ.data.readOnly is true"
  - route: /lead/report/[reportId]/preview
    access: [lead]
    intents:
      - id: lead-view-section-preview
        intent: "Lead reviews their own report section as it appears in the head's consolidated report"
        given: "Lead is authenticated and the period is active with report data"
        when: "Lead navigates to their preview route or the page loads"
        then: "The page displays their section (products they authored) in read-only form, showing portfolio overview cards and expandable product detail sections with all submitted content (current week, next week, risks, decisions, priorities)"
        note: "This is a read-only preview surface. The lead sees exactly what the head sees in the assembled report when viewing this specific lead's section."
      - id: lead-expand-product-detail
        intent: "Lead expands a product accordion to view detailed section content"
        given: "The preview is displaying and a product section has content"
        when: "Lead clicks the product name or status badge to toggle the accordion"
        then: "The product section expands to show detailed content (current week items, next week items, risks, decisions, priorities), or collapses if already open"
        note: "Empty products (no content) remain collapsed and disabled. The expansion state is client-side only."
      - id: lead-navigate-product-via-overview
        intent: "Lead uses the portfolio overview card to jump to a specific product detail"
        given: "The portfolio overview table is visible and a product card has content"
        when: "Lead clicks a product overview card"
        then: "The page scrolls to the matching product accordion and automatically expands it to show details"
        note: "Empty product cards (no updates) are disabled and do not navigate. This is a quick jump mechanism within the same page."
      - id: lead-export-preview-pdf
        intent: "Lead exports the report preview as a PDF file"
        given: "The export button is visible and the report has data"
        when: "Lead clicks the Export PDF button"
        then: "A PDF file is generated and downloaded containing the section as displayed in the preview"
        note: "The export includes all visible content from the preview surface."
      - id: lead-navigate-back-to-form
        intent: "Lead returns to the editable report form"
        given: "Lead is on the preview page"
        when: "Lead clicks the '← Back to form' button in the page header"
        then: "The page navigates back to /lead/report/[reportId] (the editable form)"
        note: "This is the explicit navigation back to the form surface."
  - route: /lead/history
    access: [lead, head, admin]
    intents:
      - id: lead-history-redirect
        intent: "legacy /lead/history redirects to /reports?tab=drafts"
        given: "lead user navigates to /lead/history"
        when: "the page loads"
        then: "a 307 temporary redirect to /reports?tab=drafts occurs; the lead lands on the merged reports page with the My Drafts tab pre-selected"
        note: "UX-17 (Phase 35-08): legacy /lead/history and /reports/history collapsed into single /reports page with role-default tabs. No standalone UI, no actions on this route."
  - route: /reports
    access: [lead, head, admin, viewer]
    intents:
      - id: lead-toggle-archived-reports
        intent: "Show or hide archived reports"
        given: "the lead is on the /reports page viewing their report history"
        when: "the lead clicks the Archive toggle"
        then: "the page updates to show archived reports alongside current ones, and the URL param ?tab changes to \"published\" (or \"drafts\" when unchecked); the archive badge shows the count of archived reports"
        note: "Archive checkbox in the sidebar; toggleArchive() updates includeArchive state and URL params. Observable via URL change and report list update."
      - id: lead-search-own-reports
        intent: "Find reports by searching their content or metadata"
        given: "the lead is on the /reports page"
        when: "the lead types a search query (2+ chars) into the search input"
        then: "a dropdown appears below the input with matching reports/items/risks/decisions ranked by relevance; results highlight the matched tokens; pressing Enter or clicking a result navigates to the report detail page"
        note: "SearchInput with scope='mine' runs trpc.search.query on debounced input. Observable via dropdown appearance, snippet highlights, and navigation."
      - id: lead-expand-report-pagination
        intent: "View all submitted reports at once instead of paginated view"
        given: "the lead is on /reports and more than 10 reports exist in the current view"
        when: "the lead clicks the \"Show all (N)\" button"
        then: "the page expands to display all reports in the list; the button disappears; the new entries appear with no full-page reload"
        note: "HistoryPanel shows pagination control when hasMore=true and showAll=false. Observable via button disappearance and complete list visibility."
      - id: lead-navigate-to-report-detail
        intent: "Open a specific submitted report to view or edit"
        given: "the lead is viewing their report history on /reports"
        when: "the lead clicks a report card"
        then: "the page navigates to /lead/report/[reportId], where the lead sees the full report with editable sections"
        note: "Each LeadHistoryList card is a link to /lead/report/[periodId]. Observable via URL navigation and report detail page load."
  - route: /reports/[reportId]
    access: [lead, head, admin, viewer]
    intents:
      - id: lead-view-report-content
        intent: "Read the assembled weekly status report"
        given: "The lead is on the published report page"
        when: "The page loads and displays the weekly report data"
        then: "The report shows the period label, portfolio overview table with all products, their status indicators, and product accordion sections grouped by product (default) or by lead"
        note: "Fetches the report via tRPC weeklyReport.get query. Displays portfolio overview (blocked/at-risk/on-track products sorted by severity), period navigation, department label, and submission count. Handles no-period and no-submission empty states gracefully."
      - id: lead-expand-product-accordion
        intent: "Expand a product section to view its details"
        given: "The report page displays product accordions, each with a collapsible header"
        when: "The lead clicks on a product accordion with content"
        then: "The accordion expands to reveal the product's sections (Needs Attention, Current Week, Next Week, Risks & Blockers, Decisions, Top Priorities) with full text and status badges"
        note: "ProductAccordion component uses local React state to toggle expanded state. Empty products (no content) are disabled and cannot expand. A smooth grid animation reveals the content over 300ms."
      - id: lead-export-pdf
        intent: "Download a PDF copy of the weekly report"
        given: "The report page displays an Export PDF button"
        when: "The lead clicks the Export PDF button after the report is published"
        then: "A PDF export job starts (via tRPC pdfExport.request), the button shows a generating state, polling occurs every 2 seconds, and once completed the PDF opens in a new tab for download with a success toast"
        note: "Button is disabled for unpublished periods. The mutation shows 'Generating…' during the job queue/processing phase. Export is available for both 'published' and 'reopened' period statuses."
      - id: lead-view-presentation
        intent: "Open the presentation view of the weekly report"
        given: "The report page header displays a Presentation button"
        when: "The lead clicks the Presentation link"
        then: "Navigation occurs to the presentation-mode route (/reports/[reportId]/present) in the same tab"
        note: "Simple navigation link, no mutation or state change. Client-side routing via Next.js Link component."
      - id: lead-back-to-archive
        intent: "Return to the published reports list"
        given: "The report page header displays a Back to Archive button"
        when: "The lead clicks the Back to Archive button"
        then: "Navigation occurs to the reports archive tab (/reports?tab=published) in the same tab"
        note: "Simple navigation link, no mutation or state change. Allows the lead to exit the report view and return to the archive list."
  - route: /reports/[reportId]/present
    access: [lead, head, admin, viewer]
    intents:
      - id: lead-view-published-report
        intent: "Lead views a published report in presentation mode"
        given: "A published report exists and is accessible to the lead"
        when: "The lead navigates to the /reports/[reportId]/present route"
        then: "The report displays in presentation view with a navigation header, section counter, and keyboard/button controls visible; the page title shows 'Status Presentation'"
        note: "Read-only view; no mutations. Rendered via HeadPresentClient wrapper around WeeklyReportPage."
      - id: lead-navigate-sections
        intent: "Lead advances through report sections during presentation"
        given: "The presentation is open with multiple report sections (products)"
        when: "The lead presses arrow keys (← or →), J/K keys, or clicks the Previous/Next buttons"
        then: "The section advances (or goes back), the section counter updates to reflect the new position, and the view smoothly scrolls to the new section; buttons are disabled at the first and last sections"
        note: "Keyboard events are ignored if focus is on input/textarea/select; no navigation occurs beyond section boundaries."
      - id: lead-fullscreen-present
        intent: "Lead enters fullscreen presentation mode for larger display"
        given: "The presentation view is open"
        when: "The lead presses F or clicks the 'Fullscreen' button"
        then: "The wrapper element enters browser fullscreen, the button text changes to 'Exit fullscreen', and the report background becomes white with padding for display clarity"
        note: "Browser fullscreen request may be denied (silently caught); Escape key exits fullscreen natively."
      - id: lead-exit-presentation
        intent: "Lead returns to the report view"
        given: "The presentation view is open"
        when: "The lead clicks the 'Back to report' link in the header"
        then: "Navigation returns to /reports/[reportId] (the standard report view), exiting the presentation mode"
        note: "No state mutation; purely a navigation action."
  - route: /reports/history
    access: [lead, head, admin, viewer]
    intents:
      - id: lead-reports-history-redirect
        intent: "Legacy reports-history URL lands on the merged reports published tab"
        given: "A lead user navigates to /reports/history"
        when: "The page loads"
        then: "A 307 redirect to /reports?tab=published executes; the browser navigates to the merged reports page with the Published tab active"
        note: "Redirect-only stub (UX-17 / Phase 35-08). No standalone UI or user interactions. Stable intent — behavior unchanged."
  - route: /reports/trends
    access: [lead, head, admin, viewer]
    intents:
      - id: lead-view-analytics-trends
        intent: "View read-only analytics dashboards for trends and period-over-period comparison"
        given: "the lead has access to the trends page"
        when: "the page loads"
        then: "three charts render: traffic-light history (project statuses over Jan–Dec 2026), lead velocity (stacked submission counts per lead), and period comparison (delta table for Apr 21 vs Apr 28 2026); empty-state messages appear if no data exists for any chart"
        note: "No user-initiated writes, filtering, or drilling. All data is fetched from hardcoded date ranges and displayed immediately. Charts are Recharts visualizations with built-in tooltips and legends."
