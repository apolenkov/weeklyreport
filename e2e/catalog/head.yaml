# Scenario Catalog — head
# Durable behavioral catalog (role x route x intent + Given/When/Then prose).
# NO file:line, NOT exhaustive. Generated by generate-catalog.workflow.mjs,
# human-reviewed. Format contract: e2e/catalog/README.md
role: head
generated: true
routes:
  - route: /
    access: [head]
    intents:
      - id: head-authenticate-and-redirect
        intent: "Authenticate as a head user and land on the head dashboard"
        given: "The user is unauthenticated on the public login page"
        when: "the user completes SSO sign-in with head credentials"
        then: "the browser redirects to /head/dashboard and the head's authenticated session begins"
        note: "This is the primary and only user-initiated action on the / route for the head role. The page itself performs no mutations or complex UI state changes. Dev-mode role switching is not a durable intent (auth-stub only, not production). Once authenticated, the auto-redirect is automatic and the route is exited."
  - route: /head/dashboard
    access: [head]
    intents:
      - id: head-dashboard-revoke-all-submissions
        intent: "Revoke all lead submissions at once to return all forms to Draft status"
        given: "The current period is not yet published and there is at least one submitted lead form"
        when: "the head clicks the Revoke All button and confirms the dialog"
        then: "The submission state is reverted to Draft for all listed leads, a success toast appears showing the count of revoked submissions, and the Period Summary table updates to reflect Draft status"
        note: "Calls leadForm.revokeAllSubmitted; available only when period is open/reopened and submittedCount > 0. Count shown on button label."
      - id: head-dashboard-view-status-report
        intent: "Navigate to the active period's unified status report for review and publication"
        given: "An active reporting period exists with a reportId"
        when: "the head clicks the View Status Report button in the header"
        then: "The page navigates to /head/report/{reportId} showing the published or draft report with all lead sections"
        note: "Always available; unblocked link in header. No mutation required."
      - id: head-dashboard-send-reminder-all-pending
        intent: "Send a reminder email to all leads who have not yet submitted their forms"
        given: "The period is not published, there are leads with pending status, and an active reminder rule is configured"
        when: "the head clicks Send Reminder in the Alert Bar"
        then: "A success toast shows how many reminders were dispatched (and how many were already sent or skipped in the current cycle); if no rule is configured, a toast directs the head to Admin → Reminders"
        note: "Calls reminders.dispatchPending without leadId filter; applies to all pending leads. Disabled when canSendReminder=false (no active rule)."
      - id: head-dashboard-send-reminder-single-lead
        intent: "Send a reminder email to a single lead who is still in Draft status"
        given: "A lead has status Draft (form started but not submitted) and the period is open"
        when: "the head clicks Remind next to that lead in the Period Summary table"
        then: "A success toast shows 'Sent' (or 'Already sent' if this cycle already reminded the lead); the button label changes and becomes disabled briefly, then resets"
        note: "Calls reminders.dispatchPending with leadId filter. Appears only for Draft-status rows in the Period Summary table."
      - id: head-dashboard-revoke-single-submission
        intent: "Revoke a single lead's submitted form to return it to Draft status"
        given: "A lead has Submitted status and the period is not published"
        when: "the head clicks Revoke next to that lead in the Period Summary table and confirms the dialog"
        then: "The lead's status changes to Draft, a success toast appears confirming revocation, and the Period Summary table updates to show Draft status for that row"
        note: "Calls leadForm.revoke; appears only for Submitted-status rows in the Period Summary table."
      - id: head-dashboard-view-lead-detailed-report
        intent: "Navigate to a specific lead's completed report section for review"
        given: "A lead has submitted their form or has draft content (itemCount + riskCount + decisionCount + priorityCount > 0)"
        when: "the head clicks a submitted lead row in the Submission Activity panel"
        then: "The page navigates to /head/report/{reportId}?authorId={leadId} and displays that lead's report section in focused view"
        note: "Only clickable for submitted sections with content; draft rows and empty rows are not clickable."
  - route: /head/history
    access: [head]
    intents:
      - id: head-history-redirect
        intent: "Redirect from legacy history page to merged reports page"
        given: "head user accesses /head/history route"
        when: "the page loads"
        then: "browser navigates to /reports with ?tab=published query parameter, displaying the compiled group report history"
        note: "UX-17 (Phase 35-08): pure 307 redirect stub. No user-initiated action required. Unifies /head/history and /reports/history into single /reports surface with role-aware default tabs."
  - route: /head/slides
    access: [head]
    intents:
      - id: head-slides-history-alias
        intent: "View compiled group report history via legacy slides alias"
        given: "the head user accesses /head/slides"
        when: "the head opens the /head/slides route"
        then: "redirected to /reports?tab=published showing the History page with subtitle \"Compiled group report history.\"; archived report periods are included by default; no console error occurs"
        note: "HEAD-CONSOLIDATE-01: /head/slides is a legacy alias that chains through /head/history?mode=slides (discarding mode param) and lands on the shared /reports surface. The canonical path is /reports?tab=published. This route exists only to preserve old bookmarks."
  - route: /head/report
    access: [head]
    intents:
      - id: head-report-redirect-canonical
        intent: "Navigate to the addressed report URL"
        given: "the head lands on the bare /head/report route"
        when: "the active reportId is resolved from the server"
        then: "the browser URL changes to /head/report/[reportId] (with optional ?authorId preserved)"
        note: "Legacy bare route preserved for back-compat; auto-redirects to canonical form via router.replace (gated by redirectToCanonical). Mutation intents (publish, reopen, archive, export-pdf) are redundant with /head/report/[reportId]. A stale ?period= is ignored — the legacy suppression branch was retired (see this change's tasks.md §3.5), so the bare route produces no behavior distinct from the addressed route."
  - route: /head/report/[reportId]
    access: [head]
    intents:
      - id: head-addressed-report-publish-lock
        intent: "Publish and lock the period on the addressed head report"
        given: "a report with at least one submitted lead section"
        when: "the head confirms the Publish & Lock dialog"
        then: "the period transitions from open/reopened to published state, all lead sections are locked from further edits, a success toast shows 'Period published & locked'"
        note: "If some leads have not submitted, a warning shows their count but the action still proceeds. Calls trpc.period.publish; visible only when canMutatePeriod=true (role=head|admin) and periodStatus is 'open'|'reopened'."
      - id: head-addressed-report-reopen
        intent: "Reopen a published period on the addressed head report for further editing"
        given: "a report with periodStatus === published"
        when: "the head confirms the Reopen dialog"
        then: "the period reverts to reopened state, all lead sections are unlocked, a success toast shows 'Period reopened'"
        note: "Reopening is destructive, guarded by a confirm dialog. Calls trpc.period.reopen; visible only when canMutatePeriod=true and periodStatus==='published'."
      - id: head-addressed-report-archive
        intent: "Archive a published report on the addressed head report page"
        given: "a report with periodStatus === published"
        when: "the head clicks the Archive button"
        then: "the report is moved to the archive (archived=true), no longer appears in the active period navigator, a success toast shows 'Report archived', and the Archive button disappears"
        note: "Calls trpc.archive.archiveReport; button only visible when canMutatePeriod=true and periodStatus==='published'. After archiving, the button is hidden because this page only routes to active periods."
      - id: head-addressed-report-toggle-view-mode
        intent: "Switch between form and slides view modes on the addressed report"
        given: "a report page in either form or slides mode"
        when: "the head clicks the Slides or Edit toggle button"
        then: "the view mode switches (form ↔ slides), the URL updates (?mode=slides or removes the param), the same report data is re-rendered in the new layout"
        note: "Navigation action using Link with ?mode=slides query param. The current scope and authorId query params are preserved. Form is the default."
      - id: head-addressed-report-toggle-slide-density
        intent: "Review a dense head deck as a document or bounded presentation pages"
        given: "the addressed report is in slides mode with lead- or product-grouped content"
        when: "the head switches between Document and Presentation density"
        then: "Document retains the complete auto-height report; Presentation pages each product deterministically, labels continuations, and preserves every record, author, status, and selected scope exactly once"
        note: "Density is local reversible view state and does not refetch weekly-report data."
      - id: head-addressed-report-toggle-scope
        intent: "Switch between product and lead grouping in the addressed report view"
        given: "a report in form or slides mode"
        when: "the head clicks the scope toggle (Product or Leads)"
        then: "the report sections are re-grouped: product scope shows products in accordion order; lead scope groups products under each authoring lead, with empty leads dropped"
        note: "Local client state toggle (useState). Scope toggle only allows ['product', 'lead'] for the head role. No URL param, no mutation."
      - id: head-addressed-report-toggle-archive-filter
        intent: "Show or hide archived reports in the period navigator on the addressed report"
        given: "the period navigator is displayed"
        when: "the head clicks the archive toggle (Show archived)"
        then: "the period list is refetched with includeArchive=true/false via trpc.reports.compiledHistory query, archived reports are shown or hidden in the navigator"
        note: "Local state toggle via useState(includeArchive). No confirmation dialog. Calls trpc.reports.compiledHistory.queryOptions({ includeArchive })."
      - id: head-addressed-report-navigate-periods
        intent: "Switch to a different report period via the period navigator"
        given: "multiple compiled report entries in the history"
        when: "the head clicks a period entry in the period navigator"
        then: "navigation occurs to the new period's addressed URL (/head/report/<reportId>), view mode and authorId params are preserved, the new report content loads"
        note: "Navigation action via PeriodNavigator. urlBuilder preserves ?mode=slides or ?authorId query params across period navigation."
  - route: /head/report/[reportId]/present
    access: [head]
    intents:
      - id: head-present-redirects-to-slides
        intent: "Legacy head presentation deep link resolves to inline slides mode"
        given: "the head opens a legacy /head/report/[reportId]/present deep link"
        when: "the route is requested"
        then: "the response is a 308 permanent redirect to /head/report/[reportId]?mode=slides; the standalone slide-deck surface no longer exists — presentation lives inline on the report page via the Edit/Slides view-mode toggle"
        note: "fix-report-surface-integrity W2: the standalone slide deck (section next/prev, fullscreen, Back-to-report link) is gone. The route is kept so existing deep links keep resolving; the sweep runner follows the redirect to ?mode=slides."
  - route: /lead/history
    access: [head]
    intents:
      - id: head-redirect-to-drafts
        intent: "Redirect from legacy history page to merged reports page"
        given: "head user accesses /lead/history route"
        when: "the page loads"
        then: "browser navigates to /reports with ?tab=drafts query parameter, displaying the My Drafts tab"
        note: "UX-17 (Phase 35-08): pure 307 redirect stub. No user-initiated action required. Unifies /lead/history and /reports/history into single /reports surface with role-aware default tabs."
  - route: /lead/report
    access: [lead, head, admin]
    intents:
      - id: head-routed-away-from-lead-form
        intent: "HEAD user accesses bare lead report form"
        given: "A head or admin user navigates to /lead/report"
        when: "The page loads and the LeadForm component mounts"
        then: "The page redirects to either /head/dashboard (if bare route) or /head/report/{reportId} (if accessing a specific lead's report). No form actions are available to the head user on this route."
        note: "This route is exclusively for LEAD users. HEAD and ADMIN roles are routed away immediately via client-side redirect. No user-facing actions or intents exist for HEAD on this route — the redirect is the only behavior."
  - route: /lead/report/[reportId]
    access: [head]
    intents:
      - id: head-lead-report-redirect-to-head-view
        intent: "Head user routed to their own report view when accessing a lead's addressed report"
        given: "A head or admin user is logged in"
        when: "the head navigates to `/lead/report/[reportId]`"
        then: "the browser URL changes to `/head/report/[reportId]` and the head's report view is displayed; no lead-form content is rendered"
        note: "The layout guard permits head access, but the LeadForm component enforces a client-side redirect. Head access is gated before form data loads."
  - route: /reports
    access: [head]
    intents:
      - id: head-view-compiled-history
        intent: "View compiled group report history with metrics"
        given: "Head user on /reports route"
        when: "The page loads"
        then: "Displays a list of submitted/published/archived/draft reports from all team members, each showing week, status badge, traffic-light counts (green/yellow/red), and submission timeline (created/last edit/submitted/published dates); sidebar shows aggregated stats (total submissions, on-time rate, avg items per week, total risks) and traffic-light summary"
        note: "Head sees compiledHistory (not personal myHistory); lead sidebar text becomes third-person (e.g. 'Most recent week is still a draft' without 'Submit to extend your streak')"
      - id: head-toggle-archive
        intent: "Include or exclude archived/published periods in history view"
        given: "Head viewing compiled history"
        when: "The head checks or unchecks the Archive toggle"
        then: "History list refreshes to show only non-archived periods (when unchecked) or all periods including archived (when checked); the Archive toggle badge displays the count of archived reports; URL query param updates to ?tab=published (checked) or ?tab=drafts (unchecked)"
        note: "Legacy ?tab=published URL is treated as 'include archive' to preserve old links; count badge only shows when archiveCount > 0"
      - id: head-expand-history-list
        intent: "Expand full report history list beyond initial 10"
        given: "Head viewing history with more than 10 reports"
        when: "The head clicks the 'Show all' button"
        then: "All reports in the current filter (archived or non-archived) are displayed; the 'Show all' button disappears and the list shows the full count in parentheses"
        note: "Expansion state resets when archive toggle changes"
      - id: head-search-all-reports
        intent: "Search across all team reports and products"
        given: "Head on /reports with search enabled (scope=all)"
        when: "The head types 2+ characters in the search input"
        then: "A dropdown results list appears showing matching items, risks, decisions, and products with type badges, creation date, title, and highlighted snippet of the matched text; keyboard navigation (arrow up/down to select, Enter to activate, Esc to clear and close); clicking a result navigates to the item/risk/decision inside the source report or to /admin?tab=products filtered by the product"
        note: "Search debounces by 300ms; results dropdown closes on outside click; scope='all' is head/admin-exclusive (server rejects 'all' for leads with FORBIDDEN)"
      - id: head-click-report-card
        intent: "Navigate to detailed report view"
        given: "Head viewing compiled history"
        when: "The head clicks a report card in the history list"
        then: "Navigates to /lead/report/{reportId} to view the full compiled report with all sections and content"
        note: "Card click target is stable and bookmarkable so the browser tab can be shared; href falls back to /lead/report/{periodId} if no explicit href is present"
  - route: /reports/[reportId]
    access: [head]
    intents:
      - id: head-published-report-view
        intent: "View a published report's portfolio overview and product details"
        given: "The head is viewing a published report page"
        when: "The page loads with a reportId URL param"
        then: "The portfolio overview table and per-product accordions are displayed; the page title shows the week number and date range; no console errors appear"
        note: "This is the primary read-only intent on the viewer route. The head can expand/collapse product accordions and scroll through content. No mutations occur on this route; publish/reopen/archive actions belong to /head/report/[reportId]."
      - id: head-published-report-export-pdf
        intent: "Export the published report to PDF (async job)"
        given: "The head is viewing a published report page"
        when: "The head clicks the Export PDF button and waits for generation"
        then: "A PDF export job starts (via tRPC pdfExport.request), polling occurs, and the completed PDF opens in a new tab with a success toast"
        note: "fix-report-surface-integrity W2: the standalone browser-Print link to /print/[reportId] is removed (the print route now 308-redirects humans away — it is the PDF worker's render template only). The single labeled Export PDF is the async pdfExport.request job, rendered by WeeklyReportPage's toolbar trailing group."
      - id: head-published-report-back-to-archive
        intent: "Return to the published reports archive list"
        given: "The head is viewing a published report page"
        when: "The head clicks the Back to Archive button"
        then: "The browser navigates to /reports?tab=published"
        note: "This is a simple link navigation. The archive list displays all published (and archived) reports the head has access to."
  - route: /reports/[reportId]/present
    access: [head]
    intents:
      - id: head-published-present-redirects-to-slides
        intent: "Legacy published presentation deep link resolves to inline slides mode"
        given: "the head opens a legacy /reports/[reportId]/present deep link"
        when: "the route is requested"
        then: "the response is a 308 permanent redirect to /reports/[reportId]?mode=slides; the standalone slide-deck surface no longer exists — presentation lives inline via the Edit/Slides view-mode toggle"
        note: "fix-report-surface-integrity W2: the standalone slide deck (section nav, fullscreen) is gone. The route is kept so existing deep links keep resolving; the sweep runner follows the redirect to ?mode=slides."
  - route: /reports/history
    access: [head]
    intents:
      - id: head-reports-history-redirect
        intent: "View published reports archive via legacy route"
        given: "the head user navigates to /reports/history"
        when: "the page loads"
        then: "the browser is 307-redirected to /reports?tab=published, displaying the Published tab of the merged reports page"
        note: "UX-17 Phase 35-08: legacy archive route consolidated into merged /reports. No user actions; redirect is the sole behavior."
  - route: /reports/trends
    access: [head]
    intents:
      - id: head-view-trends-dashboard
        intent: "View analytics trends across traffic-light status history, lead submission velocity, and period-to-period project comparison"
        given: "The head is logged in and navigates to the trends analytics page"
        when: "The page loads"
        then: "Three read-only charts render: (1) traffic-light history shows project status (green/yellow/red) as a line chart over the specified date range, with gaps visible for unreported periods; (2) lead-velocity shows a stacked bar chart of submitted section counts per lead per period; (3) period-comparison displays a table with project names, status A/B, risk counts A/B, and the risk delta between two specific periods, with null statuses rendered as em-dashes and deltas color-coded (red for increase, green for decrease)"
        note: "This is a read-only analytics surface with no user-initiated state changes, mutations, or interactive controls. Data is fetched via three tRPC queries on page mount. If any chart has no data for its range, a fallback message ('No published periods in range', 'No velocity data in range', 'No comparison data') appears instead of the chart."
