# Scenario Catalog — admin
# Durable behavioral catalog (role x route x intent + Given/When/Then prose).
# NO file:line, NOT exhaustive. Generated by generate-catalog.workflow.mjs,
# human-reviewed. Format contract: e2e/catalog/README.md
role: admin
generated: true
routes:
  - route: /
    access: [admin]
    intents:
      - id: user-auto-redirect-by-role
        intent: "Auto-redirect authenticated user to role-appropriate home"
        given: "User has an active session with a valid role"
        when: "Page loads and auth.me resolves with a role"
        then: "Page redirects (via window.location.replace) to the role's default route: lead → /lead/report, head → /head/dashboard, admin → /admin, viewer → /reports/latest. Redirect is skipped if AUTH_STUB=true or stay=1 query param is set"
        note: "Redirect is automatic and non-interactive; happens only in production mode (not in AUTH_STUB dev mode)"
      - id: user-sign-in-with-sso
        intent: "Initiate corporate SSO sign-in"
        given: "User is not authenticated and app is in production mode (AUTH_STUB=false)"
        when: "User clicks 'Sign in with SSO' button"
        then: "Page navigates to /auth/saml/login with optional next param to restore post-login redirect intent. User is redirected by the SAML flow to identity provider, then back to the app at the target route"
        note: "Button text and aria-label indicate corporate SSO; this is the production authentication path"
      - id: user-enter-via-dev-role-card
        intent: "Select a role and enter app in dev mode"
        given: "App is in AUTH_STUB mode (development). No prior session stored or user clicked 'Change role'"
        when: "User clicks a role card (Lead, Head, Admin, or Viewer) in the dev-mode role grid"
        then: "Page navigates to /auth/dev-login with role, email, and redirect params. Dev-login route sets a session cookie and redirects to the role's default home (admin → /admin)"
        note: "Dev-only feature. Default admin card has fallback email admin@customreport.local"
      - id: user-resume-last-session
        intent: "Resume previous session with one click"
        given: "App is in AUTH_STUB mode AND user has a stored last-session hint (role + email + name)"
        when: "Page loads and last-role is hydrated from localStorage. User sees the resume card with primary CTA pointing to last role's dev-login"
        then: "Clicking the primary button (or 'Change role' → selecting the same role) logs user back in as the stored role with the stored email and redirects to the role's home"
        note: "Dev-only. Card shows last role name and label; may be dismissed by switching to a different role. Uses localStorage; session is not persisted between browser closes by default"
  - route: /admin
    access: [admin]
    intents:
      - id: admin-users-manage
        intent: "Manage users: create, edit, deactivate, activate, and delete team members with role assignments."
        given: "The admin is on the Users tab."
        when: "the admin adds a new user, edits an existing user's name/email/role/group assignment, deactivates or activates a user, or deletes a user"
        then: "A toast appears with 'User saved', 'User deleted', 'User deactivated', or 'User activated'; the user list table updates to reflect the change."
        note: "The tab displays all users with role/group/status filters and search. Edit and Activate/Deactivate remain inline with 40px targets; Delete is available only from the labeled row overflow menu and opens the existing confirmation dialog. Cancel restores focus to the overflow trigger."
      - id: admin-users-delete-overflow
        intent: "Delete a user without presenting destruction as a routine row action."
        given: "The admin is on the Users tab at desktop or narrow width."
        when: "the admin opens a user's labeled More actions menu and chooses Delete user"
        then: "The destructive confirmation opens; cancel returns focus to More actions, while confirm calls the existing authorized delete mutation. Edit and Activate/Deactivate remain visible inline."
        note: "Every row action and the destructive menu item has at least a 40px interactive target and a visible keyboard focus state."
      - id: admin-groups-manage
        intent: "Manage reporting groups: create, edit, archive, and unarchive groups; assign head users and group products."
        given: "The admin is on the Groups tab."
        when: "the admin adds a new group, edits a group's name/description/head assignment/product roster, archives or unarchives a group"
        then: "A toast appears with 'Group saved' or a state-change message; the groups table updates, filtered by archive status (active shown by default)."
        note: "Head candidates are filtered to head/admin roles only. Products are editable via the GroupProductsEditor inside the edit dialog."
      - id: admin-products-manage
        intent: "Manage products: create, edit, and archive products; assign lead owners and stage assignments."
        given: "The admin is on the Products tab."
        when: "the admin adds a new product, edits a product's name or lead owner, archives or restores a product"
        then: "A toast appears with 'Product saved' or 'Product archived'; the product list updates with active and archived sections."
        note: "Excluded deactivated leads from the picker (B9). Stages assigned per product show count via separate query (35-01). Products can be deep-linked via global search filter."
      - id: admin-activities-manage
        intent: "Manage project activities: create, edit, archive, and restore stage-less reporting units; attach and detach the leads who report on them."
        given: "The admin is on the Activities tab."
        when: "the admin adds an activity, edits its name/group/linked products/Jira accounts, archives or restores it, or expands a row to attach or detach a lead"
        then: "A toast appears with 'Activity saved', 'Activity archived', or 'Activity restored'; the list refreshes with active and archived sections and the row's attached-lead count reflects the attachment change."
        note: "An activity carries no SDLC stage (ADR 0012) and attaches to many leads, each reporting their own status (ADR 0014). Attachment is admin-provisioned only — there is no lead-side self-service."
      - id: admin-periods-manage
        intent: "Manage reporting periods: create, edit, publish, reopen, archive, unarchive, and delete periods; view period lifecycle by state."
        given: "The admin is on the Periods tab."
        when: "the admin creates a new period, edits a period's date envelope/label, publishes an open period, reopens a published period (if allowed), archives or unarchives a period, or deletes a period"
        then: "A toast appears with 'Period created', 'Period updated', 'Period published', 'Period reopened', 'Period archived', 'Period unarchived', or 'Period deleted'; the periods table updates (active and archive sections shown by state)."
        note: "Active and archive sections are separate; archive is collapsed by default with opt-in query gating. Edit dialog handles both create/edit modes. Reopen is gated by server window math."
      - id: admin-reminders-manage
        intent: "Manage reminder policies: create, edit, delete reminder policies (deadline, follow-up, escalation); view derived rules per policy."
        given: "The admin is on the Reminders tab."
        when: "the admin creates a new policy, edits an existing policy's kind/timing/audience/timezone/validity window, or deletes a policy"
        then: "A toast appears with 'Policy created', 'Policy updated', or 'Policy removed'; the policies list updates and derived rules (grouped by policyId) refresh."
        note: "Policies are the top-level editable rows; rules are read-only under each policy. Form prefills from org-wide defaults (timezone, audience) on first load."
      - id: admin-reopen-respond
        intent: "Review and respond to lead reopen requests: approve to reopen sections for editing, or reject with a note."
        given: "The admin is on the Reopen Requests tab."
        when: "the admin approves a pending reopen request (section returns to draft state) or rejects it with an optional explanatory note"
        then: "A toast appears with 'Request approved; section reopened.' or 'Request rejected.'; the request moves from Pending to Approved/Rejected; pending count badge updates."
        note: "Requests show lead name, section/week, timestamp, and reason. Filterable by status (Pending/Approved/Rejected/All)."
      - id: admin-jobs-retry
        intent: "Manage failed email-reminder jobs: view the dead-letter queue and retry failed jobs."
        given: "The admin is on the BullMQ Jobs tab."
        when: "the admin retries a failed job from the email-reminder queue"
        then: "A toast appears with 'Job <id> queued for retry.' or 'Job <id> removed from failed jobs.'; the job is removed from the failed list (or moved back to the queue), and the DLQ count updates."
        note: "Surfaces BullMQ's email-reminder queue. Rows show job id, name, failure reason, and timestamps."
      - id: admin-actions-view
        intent: "Audit and search action logs: inspect and copy whitelisted event details without exposing mutation, request, or response bodies."
        given: "The admin is on the Action Log tab."
        when: "the admin searches loaded rows by actor, humanized procedure, status, correlation, or displayed timestamp, expands a row, copies its whitelisted event details, and loads the next cursor page"
        then: "The matching loaded rows remain visible; the expanded region shows the complete safe metadata, Copy announces its result, and Load more appends the remaining events without duplicates."
        note: "Read-only tab. Search covers loaded rows only. Internal manual-action-log-proof entries are filtered before the page budget. Cursor pagination shows 20 rows per page."
      - id: admin-settings-configure
        intent: "Configure organization identity, period defaults, reminder defaults, notification settings, and external integrations."
        given: "The admin is on the Settings tab."
        when: "the admin edits organization short/full name (Identity), period cycle parameters (Periods sub-tab), reminder timezone/audience defaults (Reminders sub-tab), notification from-email (Notifications sub-tab), or views integration status (Integrations sub-tab, seeds-only in v1)"
        then: "A toast appears with 'Organization identity saved', 'Period policy saved', 'Reminders saved', or 'Notifications saved'; the landing page cache is revalidated (A9); form state reflects saved values on next invalidate."
        note: "Tabbed layout (Identity, Periods, Reminders, Notifications, Integrations, Holidays). Holidays is coming-soon and read-only (styled like the other sub-tabs). Period policy knobs and org identity are saved via PATCH semantics."
  - route: /admin/products
    access: [admin]
    landing: "/admin?tab=products"
    intents:
      - id: admin-products-view
        intent: "View products catalog (active and archived)"
        given: "Admin accesses the products tab"
        when: "The page loads"
        then: "Products list displays with name, lead owner, stage assignment count (X/7), and separate archived section. Global product search box visible."
        note: "Redirect alias (307) to /admin?tab=products. Read-only view unless actions below apply."
      - id: admin-product-add
        intent: "Create a new product"
        given: "Admin is on the products tab"
        when: "Admin clicks 'Add Product' button"
        then: "Dialog opens with fields for product name and lead owner selection. After filling and confirming, product appears in active list with success toast 'Product saved'."
        note: "Lead dropdown excludes deactivated users. Dialog closes via confirm, cancel, or Escape key."
      - id: admin-product-edit
        intent: "Update product name or lead owner"
        given: "An active product exists in the list"
        when: "Admin clicks 'Edit' button on the product row"
        then: "Dialog opens with current product name and lead owner pre-filled. After saving, product updates and success toast 'Product saved' appears."
        note: "Only modifies name and lead ownership; stage assignments remain unchanged."
      - id: admin-product-archive
        intent: "Hide a product from active operations"
        given: "An active product exists in the list"
        when: "Admin clicks 'Archive' button on the product row"
        then: "Confirmation dialog shows 'Archive product?' with preview of product name. After confirming, product moves to archived section and success toast 'Product archived' appears."
        note: "Reversible action; archived section shows 'Archived (N)' count. Lead assignments and stage data preserved."
      - id: admin-product-restore
        intent: "Reactivate an archived product"
        given: "An archived product exists in the archived section"
        when: "Admin clicks 'Restore' button on the archived product row"
        then: "Product moves back to active list with success toast 'Product saved'."
        note: "Restores to active state without requiring re-entry of lead or stage assignments."
      - id: admin-product-expand-stages
        intent: "View stage coverage for a product"
        given: "An active product row is visible"
        when: "Admin clicks the expand/collapse chevron on the product row"
        then: "Expandable section reveals 7-stage assignment grid showing current assignee per stage or 'unassigned' state. Collapsing hides the grid."
        note: "Stage coverage count (X/7) visible in collapsed row; full details only on expand."
      - id: admin-stage-assign
        intent: "Assign a lead to a specific SDLC stage"
        given: "Product stage expansion is open, showing the 7-stage grid"
        when: "Admin selects a lead name from a stage dropdown"
        then: "Stage assignment saves (or replaces existing assignee) and success toast 'Stage assignment saved' appears. Dropdown reflects selected lead."
        note: "Lead dropdown filtered to active leads in the product's reporting group. Only one assignee per stage per product."
      - id: admin-stage-unassign
        intent: "Remove a lead assignment from a stage"
        given: "A stage has a current assignee in the expanded grid"
        when: "Admin selects '-- unassigned --' from the stage dropdown"
        then: "Stage assignment is deleted and success toast 'Stage assignment removed' appears. Dropdown reverts to empty/unassigned state."
        note: "Only valid if an assignment already exists; selecting unassigned on an already-empty stage is a no-op."
  - route: /admin/activities
    access: [admin]
    landing: "/admin?tab=activities"
    intents:
      - id: admin-activities-view
        intent: "View the project activity catalog (active and archived)"
        given: "Admin accesses the activities tab"
        when: "The page loads"
        then: "Activities list displays each activity's name, owning reporting group, linked product names (or 'No linked products'), Jira accounts, and attached-lead count, with a separate archived section. A local name filter is visible."
        note: "Redirect alias (307) to /admin?tab=activities. An activity is stage-less: it carries no SDLC stage grid, unlike a product."
      - id: admin-activity-add
        intent: "Create a project activity"
        given: "Admin is on the activities tab"
        when: "Admin clicks 'Add Activity', fills the name, picks a reporting group, ticks any linked products, types comma-separated Jira accounts, and confirms"
        then: "The activity appears in the active list and success toast 'Activity saved' appears. Save stays disabled until a name and a group are both present."
        note: "The group picker offers active groups only and prefills the first one. Linked products are label-only and never feed product health. Dialog closes via confirm, Cancel, Escape, or backdrop click."
      - id: admin-activity-edit
        intent: "Update an activity's name, group, linked products, or Jira accounts"
        given: "An active activity exists in the list"
        when: "Admin clicks 'Edit' on the activity row and saves the changed fields"
        then: "The activity updates and success toast 'Activity saved' appears. Linked products reconcile to exactly the ticked set, including clearing them all."
        note: "The reporting-group picker is disabled while any lead is attached, with a note reading 'Detach all leads before moving the activity to another group.' — the server rejects that move."
      - id: admin-activity-archive
        intent: "Hide an activity from active lead forms"
        given: "An active activity exists in the list"
        when: "Admin clicks 'Archive' on the activity row and confirms"
        then: "Confirmation shows 'Archive activity?' with the activity name; after confirming, the activity moves to the archived section and success toast 'Activity archived' appears."
        note: "Reversible. Lead attachments and already-reported statuses are preserved."
      - id: admin-activity-restore
        intent: "Return an archived activity to active use"
        given: "An archived activity exists in the archived section"
        when: "Admin clicks 'Restore' on the archived row"
        then: "The activity moves back to the active list and success toast 'Activity restored' appears."
        note: "Same archive mutation with archived=false; no re-entry of group, product links, or lead attachments is required."
      - id: admin-activity-attach-lead
        intent: "Provision which leads report on an activity"
        given: "An active activity row is visible"
        when: "Admin expands the activity row and ticks a lead in the 'Leads attached' editor"
        then: "The lead is attached, the row's attached-lead count increases, and the lead's report form starts offering that activity. Unticking detaches the lead again."
        note: "Attachment is many-to-many — each attached lead reports their own status. Leads outside the activity's reporting group are listed but locked with a 'Belongs to <group>' hint, since the server rejects a cross-group attachment."
  - route: /admin/settings
    access: [admin]
    landing: "/admin?tab=settings"
    intents:
      - id: admin-save-org-identity
        intent: "Save organization branding identity"
        given: "the admin is on the Identity sub-tab"
        when: "the admin enters short name and full name, then clicks the Save Identity button"
        then: 'a success toast displays "Identity saved" with a green checkmark; the inputs reflect the persisted values'
        note: "Short name max 16 chars, full name max 200 chars. Save button disabled if fields empty or over limits. tRPC mutation: admin.updateOrganization."
      - id: admin-save-period-settings
        intent: "Configure reporting period cycle and automation rules"
        given: "the admin is on the Periods sub-tab"
        when: "the admin modifies period policy (length, working days, auto-create, deadlines, grace window, auto-publish, auto-archive, deadline time, reopen rules) then clicks Save Period Policy"
        then: 'a success toast displays "Period policy saved" with a green checkmark; all draft values persist'
        note: "Reopen window disabled when allow-reopen is off. Auto-publish has NO auto-create dependency (the scheduler reads it independently). admin-settings-surface-cleanup removed firstDayOfWeek/deadlineDayOfWeek/maxOpenPeriods/requireAllSectionsToPublish. tRPC mutation: admin.updateSettings with PATCH semantics (only period fields)."
      - id: admin-save-reminder-defaults
        intent: "Set default timezone and audience for new reminder policies"
        given: "the admin is on the Reminders sub-tab"
        when: "the admin selects default timezone and default reminder audience, then clicks Save Reminder Defaults"
        then: 'a success toast displays "Reminder defaults saved" with a green checkmark; selections persist and seed the New Policy form on Reminders tab'
        note: "Audience options: 'lead-with-draft', 'head-of-late'. Defaults apply only to newly created policies. tRPC mutation: admin.updateSettings with {defaultTimezone, defaultReminderAudience}."
      - id: admin-save-notification-email
        intent: "Set the From: address for outgoing notification emails"
        given: "the admin is on the Notifications sub-tab"
        when: "the admin enters a notification from-email (or leaves blank), then clicks Save Notification Settings"
        then: 'a success toast displays "Notification settings saved" with a green checkmark; the email persists (or clears if blank) for use in reminder + escalation emails'
        note: "Save button disabled if the input is non-empty but not a valid email shape (basic validation: ^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$). Empty field means fall back to per-mailer default. tRPC mutation: admin.updateSettings with {notificationFromEmail: string|null}."
      - id: admin-view-integrations-status
        intent: "View external integration configuration status"
        given: "the admin is on the Integrations sub-tab"
        when: "the integrations status query completes"
        then: "the page displays status cards for Telegram (bot configured yes/no, active bindings count, coming-soon) and AI (provider + RAG corpus, coming-soon); all cards are read-only. No Slack or CI card (removed in admin-settings-surface-cleanup)."
        note: "Read-only tab. Seeds-only: Telegram user binding + bot outbound not yet active. tRPC query: admin.integrationsStatus. Failures show error message."
  - route: /head/dashboard
    access: [admin]
    intents:
      - id: admin-revoke-all-submissions
        intent: "Revoke all submitted forms in one action"
        given: "The admin is on the head dashboard and there are one or more submitted lead forms"
        when: 'the admin clicks the "Revoke All" button and confirms the action in the dialog'
        then: "all submitted lead forms are revoked to Draft status, a toast shows the count of revoked submissions, and the lead summary table refreshes to reflect the new status"
        note: "Only visible when periodStatus is not 'published' and submittedCount > 0. Calls `leadForm.revokeAllSubmitted` mutation."
      - id: admin-send-bulk-reminder
        intent: "Send a reminder email to all pending leads at once"
        given: "The admin is on the head dashboard and there are pending leads who have not submitted"
        when: 'the admin clicks the "Send Reminder" button in the alert bar'
        then: "reminder emails are dispatched to pending leads (unless already sent this cycle or opted out), and a toast confirms the dispatch with counts of sent, already-sent, and opted-out leads"
        note: 'Button is disabled if no active reminder rule is configured (shows tooltip "Active reminder policy required"). Calls `reminders.dispatchPending` mutation. Only shown when periodStatus is not ''published'' and hasActiveReminderRule is true.'
      - id: admin-send-individual-reminder
        intent: "Send a reminder email to a specific lead"
        given: "A lead's form is in Draft status in the Period Summary table"
        when: 'the admin clicks the "Remind" button in the Action column for that lead'
        then: 'a reminder email is dispatched to the lead, the button shows "Sent" or "Already sent" (depending on result), and returns to normal after a brief hold period'
        note: "Calls `reminders.dispatchPending` with leadId filter. Button shows transient state (Sent / Already sent / No sections matched / Retry) for ~2.4 seconds."
      - id: admin-revoke-individual-submission
        intent: "Revoke a single lead's submitted form"
        given: "A lead's form is in Submitted status in the Period Summary table"
        when: 'the admin clicks the "Revoke" button in the Action column for that lead and confirms in the dialog'
        then: "the lead's submission is revoked to Draft status, a toast confirms the action, and the table row refreshes to show the new status"
        note: "Calls `leadForm.revoke` mutation with the reportSectionId. Invalidates the `weeklyReport.get` query on success."
      - id: admin-view-status-report
        intent: "Navigate to the full status report for review and publication"
        given: "The admin is on the head dashboard"
        when: 'the admin clicks the "View Status Report" button'
        then: "the page navigates to the report detail page at `/head/report/{reportId}`"
        note: "Simple navigation link, no mutation."
  - route: /head/history
    access: [admin]
    landing: "/reports"
    intents:
      - id: admin-history-redirect
        intent: "Redirect to shared compiled history view"
        given: "Admin user navigates to /head/history"
        when: "the page loads"
        then: "a 307 redirect is issued to /reports?tab=published, showing the admin the compiled (published and archived) report history alongside other admin users and viewers"
        note: "This is a read-only stub with no interactive actions. The route intentionally collapses admin history into the shared /reports surface (tab=published), matching the pattern where /lead/history redirects to /reports?tab=drafts. No form submissions, mutations, or user-driven state changes occur on this route."
  - route: /head/report
    access: [admin]
    landing: "/head/report/[reportId]"
    intents:
      - id: admin-report-publish-lock
        intent: "Publish and lock the active reporting period to finalize submissions"
        given: "The admin is on the head report view with an open or reopened period"
        when: "the admin confirms the 'Publish & Lock' action after reviewing submission counts"
        then: "the period transitions to published status, lead forms lock, and the toast displays 'Period published & locked'"
        note: "A confirmation dialog warns if any leads have not yet submitted; publish proceeds regardless. Requires at least one product with report content to be enabled."
      - id: admin-report-reopen
        intent: "Unlock a published period to allow further lead edits"
        given: "The admin is on the head report view with a published period"
        when: "the admin confirms the 'Reopen Period' action through the destructive-action confirmation dialog"
        then: "the period transitions to reopened status, lead forms unlock for edits, and the toast displays 'Period reopened'"
        note: "Reopen is destructive (unlocks an already-published period) and requires explicit confirmation. The dialog states the current published version will be replaced when re-published."
      - id: admin-report-archive
        intent: "Move a published report into the archive for historical record-keeping"
        given: "The admin is on the head report view with a published period"
        when: "the admin clicks the 'Archive' button and confirms the action"
        then: "the report is archived (archived=true), it appears in the Archive tab on the reports page, and the toast displays 'Report archived'"
        note: "The Archive button is only visible for published periods. After archiving, the button disappears because this page navigates only to current/active periods."
      - id: admin-report-export-pdf
        intent: "Download a PDF copy of the status report"
        given: "The admin is on the head report view with a published or reopened period"
        when: "the admin clicks 'Export PDF' and the background job completes"
        then: "a new browser tab opens with the generated PDF artifact (/pdfs/{jobId}.pdf) and the toast displays 'PDF ready'"
        note: "Export is unavailable for never-published open periods. The button shows 'Generating…' while the BullMQ worker processes the request (polled every 2 seconds). If the job fails, an error toast appears."
      - id: admin-report-view
        intent: "Review the unified status report for the active period"
        given: "The admin navigates to /head/report or /head/report/[reportId]"
        when: "the page loads with an active reporting period"
        then: "the portfolio overview table and product accordions display all lead submissions grouped by product (or by lead when scope=lead), with submission counts and period metadata visible"
        note: "If no active period exists, an empty state message appears asking an admin to open a new period. Legacy bare /head/report redirects to /head/report/[reportId] once the active reportId is known (unless redirectToCanonical=false; a stale ?period= is ignored)."
  - route: /head/report/[reportId]
    access: [admin]
    intents:
      - id: admin-publish-lock-period
        intent: "Publish and lock the consolidated weekly report"
        given: "The admin is viewing an open or reopened report period with at least one lead submission"
        when: "The admin confirms publication via the Publish & Lock button and confirms the dialog"
        then: "The period transitions to published state, a success toast displays 'Period published & locked', lead sections become read-only, and all related caches invalidate"
        note: "Admin and head roles share identical mutation permissions over this report"
      - id: admin-reopen-published-period
        intent: "Reopen a published period for further lead edits"
        given: "The admin is viewing a published report"
        when: "The admin clicks the Reopen button and confirms the dialog"
        then: "The period transitions from published back to open, a success toast displays 'Period reopened', leads can edit sections again, and all related caches invalidate"
        note: "Reverses the publish state, enabling re-entry into the reporting cycle"
      - id: admin-archive-published-report
        intent: "Move a published report into the archive"
        given: "The admin is viewing a published report"
        when: "The admin clicks the Archive button"
        then: "The report is marked archived, the Archive button disappears from the header, a success toast displays 'Report archived', and the dashboard cache invalidates"
        note: "Only visible and clickable when periodStatus is 'published'; archived reports are accessible via the archive toggle in the period navigator"
      - id: admin-toggle-view-mode
        intent: "Switch between inline form and slide deck views of the report"
        given: "The admin is viewing the head report in either form or slides mode"
        when: "The admin clicks the View Mode toggle button"
        then: "The URL updates to change the ?mode query parameter and the report view re-renders in the selected presentation format"
        note: "Both modes display the same consolidated data; slides mode shows HeadSlidesClient, form mode shows WeeklyReportPage"
      - id: admin-change-grouping-scope
        intent: "Reorganize the report display by lead instead of product"
        given: "The admin is viewing the report in form mode"
        when: "The admin clicks the Scope toggle to switch from 'product' to 'lead' or vice versa"
        then: "Products are regrouped under their authoring leads, empty lead groups are hidden, and the accordion list reorganizes to reflect the new grouping axis"
        note: "Products shared by multiple leads appear under each lead's section; computed only in 'lead' scope for performance"
      - id: admin-export-pdf
        intent: "Export the consolidated report to PDF (async job)"
        given: "The admin is viewing the head report"
        when: "The admin clicks the Export PDF button and waits for generation"
        then: "A PDF export job starts (via tRPC pdfExport.request), polling occurs, and the completed PDF opens in a new tab"
        note: "The standalone Presentation icon link and the browser-Print link to /print/[reportId] are removed. Presentation lives inline via the Edit/Slides view-mode toggle (admin-toggle-view-mode); the single labeled Export PDF is the async pdfExport.request job. The print route 308-redirects humans away because it is the PDF worker's render template only."
      - id: admin-toggle-archive-filter
        intent: "Show or hide archived reports in the period navigator"
        given: "The admin is viewing the head report"
        when: "The admin clicks the Archive toggle in the period toolbar"
        then: "The period navigator list updates to include or exclude archived entries and the compiledHistory query refetches with the updated filter"
        note: "Persisted in local component state; allows browsing historical (archived) weeks without losing the current report view"
  - route: /head/report/[reportId]/present
    access: [admin]
    landing: "/head/report/[reportId]?mode=slides"
    intents:
      - id: admin-present-redirects-to-slides
        intent: "Legacy head presentation deep link resolves to inline slides mode"
        given: "the admin opens a legacy /head/report/[reportId]/present deep link"
        when: "the route is requested"
        then: "the response is a 308 permanent redirect to /head/report/[reportId]?mode=slides; the standalone slide-deck surface no longer exists — presentation lives inline via the Edit/Slides view-mode toggle"
        note: "The standalone slide deck (section nav, fullscreen, Back-to-report link) is gone. The route is kept so existing deep links keep resolving; the sweep runner follows the redirect to ?mode=slides."
  - route: /head/slides
    access: [admin]
    landing: "/reports"
    intents:
      - id: admin-navigate-slides-alias
        intent: "Navigate to the head slides view via the /head/slides alias route"
        given: "The admin user accesses /head/slides"
        when: "The admin visits the /head/slides route"
        then: "The browser redirects (307) to /head/history?mode=slides, which then redirects to /reports?tab=published, showing the published reports list"
        note: "This is a pure redirect alias for backward compatibility. No user actions occur on this route; the admin is redirected to the canonical published reports view."
  - route: /lead/history
    access: [admin]
    landing: "/reports"
    intents:
      - id: admin-history-redirect-to-drafts
        intent: "Redirect to the unified reports page with drafts tab pre-selected"
        given: "Admin accesses the legacy history route"
        when: "Admin navigates to /lead/history"
        then: "Browser redirects to /reports?tab=drafts with HTTP 307, showing the My Drafts tab"
        note: "Legacy route consolidation: /lead/history and /reports/history merged into single /reports page with role-default tabs. Server-side Next 16 redirect."
  - route: /lead/report
    access: [admin]
    landing: "/head/dashboard"
    intents:
      - id: admin-lead-report-redirect
        intent: "Route redirect for admin users"
        given: "An admin user accesses the `/lead/report` page"
        when: "The admin user opens the bare lead report route"
        then: 'The page navigates to `/head/dashboard` and the lead form ("My Report" heading) is never displayed'
        note: "Admin users cannot access the lead form interface on this route. The redirect occurs before form rendering completes. Admin users' report interaction happens exclusively on the head-facing routes (`/head/report/...` and `/head/dashboard`)."
  - route: /lead/report/[reportId]
    access: [admin]
    landing: "/head/report/[reportId]"
    intents:
      - id: admin-report-redirect-to-head-view
        intent: "Admin user is redirected to the head report viewer"
        given: "admin user navigates to /lead/report/[reportId]"
        when: "the page loads"
        then: "the route replaces with /head/report/[reportId] (preserving the report ID in the URL), or /head/dashboard if no report ID was pinned"
        note: "Admin and head roles both trigger the redirect via the isHeadLikeSession check. The lead form is not rendered for admin—only the navigation occurs. This ensures admin views report data through the head-only read interface, not the lead edit interface."
  - route: /reports
    access: [admin]
    intents:
      - id: admin-reports-history-browse
        intent: "Browse compiled report history"
        given: "The admin user navigates to /reports"
        when: "The page loads with the compiled history list"
        then: "A grid of published report cards appears with week label, date range, status badge (Published or Archived), traffic light counts (green/yellow/red), and summary text. The page heading reads 'History' with subtitle 'Compiled report history.' The right sidebar displays 'History Summary' with statistics (Submissions, On-time rate, Avg items/week, Total risks) and 'Submission Status' card. When no history exists, displays 'No current history yet.' An archive filter controlled separately allows toggling between current and archived entries."
        note: "Compiled history shows only published reports (status=published in API query). Admin views aggregate stats across all leads' sections via groupScopeFilter(admin scope). Cards are clickable Links."
      - id: admin-reports-archive-toggle
        intent: "Toggle archive visibility to include archived reports"
        given: "The admin is viewing the compiled report history"
        when: "The admin checks the 'Archive' control labeled with a count badge (e.g., 'Archive 3')"
        then: "The page URL updates to ?tab=published. The list expands to show all published reports (both current and archived). Archived report cards display an 'Archived' badge instead of 'Published'. Toggling unchecked returns to ?tab=drafts and hides archived entries, showing only current published reports with 'Published' status. The archive count badge updates to reflect the number of archived reports available."
        note: "Archive toggle uses checkbox state synced to URL param. The sidebar 'Submission Status' card text updates based on what is visible. legacyUrl ?tab=published is treated as 'include archive' for backward compatibility."
      - id: admin-reports-search
        intent: "Search across all reports and products"
        given: "The admin is on /reports and the search input is visible"
        when: "The admin types into the search field with scope='all' (searching reports, items, risks, decisions, and products across all leads)"
        then: "After 300ms debounce, results appear in a dropdown below the input if the query is ≥2 characters. Each hit displays a type badge (Task, Risk, Decision, or Product), creation date, title, and highlighted snippet with matched tokens wrapped. Keyboard navigation: ↓/↑ to cycle hits, Enter to navigate, Esc to close and clear. Clicking a hit or pressing Enter navigates to the report (Task/Risk/Decision hits go to /lead/report/<reportId>#section-<sectionId>; Product hits go to /admin?tab=products&filter=<projectId>). If no hits match, displays 'No results found.' If query <2 chars, results remain closed. If search fails, 'Search failed' is shown."
        note: "scope='all' is admin-only authorization — the server rejects scope=all for leads with FORBIDDEN. This is a read-only query (no mutations). Placeholder text is 'Search reports and products…' (non-lead variant)."
      - id: admin-reports-open-report
        intent: "Open a published report from the history"
        given: "A report card is visible in the compiled history list"
        when: "The admin clicks on a report card"
        then: "The browser navigates to the published report view at /reports/<reportId>"
        note: "All history cards are clickable Links. This is a navigation intent, distinct from browse/search."
  - route: /reports/[reportId]
    access: [admin]
    intents:
      - id: admin-viewer-report-view
        intent: "View a published report from the archive"
        given: "Admin user navigates to /reports/[reportId] with a valid report ID"
        when: "The page loads with a published report available"
        then: "The published report displays with portfolio overview table, product accordions grouped by product, submission counts (X/Y Submitted), and a period header. The Status Report heading and Report ID subtitle are visible. The header shows 'Back to Archive' (link to /reports?tab=published) and the single labeled 'Export PDF' (the async pdfExport.request job)"
        note: "Read-only viewer interface; all authenticated roles can access this route to view published reports. The standalone Presentation and browser-Print links are removed — presentation is inline via ?mode=slides; the print route 308-redirects humans away."
      - id: admin-viewer-report-publish
        intent: "Publish and lock the reporting period from the published report viewer"
        given: "Admin is viewing a published report with an open or reopened period and at least one lead submission"
        when: "Admin confirms the 'Publish & Lock' action after viewing the confirmation dialog that shows pending lead count"
        then: "A success toast 'Period published & locked' appears, the button changes to 'Reopen Period', and the dashboard, lead form, and lead history caches refresh to reflect the locked state"
        note: "Button is disabled if no submissions exist or no expandable content. Dialog warns if pending leads haven't submitted yet. Calls period.publish mutation."
      - id: admin-viewer-report-reopen
        intent: "Unlock a published period to allow further lead edits from the published report viewer"
        given: "Admin is viewing a published report where the period has been published and locked"
        when: "Admin clicks 'Reopen Period' and confirms the destructive action dialog"
        then: "A success toast 'Period reopened' appears, the button returns to 'Publish & Lock', and the dashboard, lead form, and lead history caches refresh to reflect the reopened state"
        note: "Destructive action; dialog explicitly warns that the current published version will be replaced when published again. Calls period.reopen mutation."
      - id: admin-viewer-report-archive
        intent: "Move a published report into the archive from the published report viewer"
        given: "Admin is viewing a published report where periodStatus === 'published'"
        when: "Admin clicks the 'Archive' button and confirms the action"
        then: "A success toast 'Report archived' appears, the Archive button disappears, and the report is moved to the archive so it no longer appears in the active reports list"
        note: "Button visible only when periodStatus === 'published'. The button is hidden after successful archival because this page only navigates to current/active periods. Calls archive.archiveReport mutation."
      - id: admin-viewer-report-export-pdf
        intent: "Export the published report as a PDF from the published report viewer"
        given: "Admin is viewing a published or reopened report"
        when: "Admin clicks 'Export PDF' in the header and the PDF generation job completes"
        then: "A PDF export job starts (via tRPC pdfExport.request), polling occurs, and once complete the PDF opens in a new tab with a 'PDF ready' toast; on failure a 'PDF export failed. Please try again.' toast appears"
        note: "Handled via ExportPdfButton passing reportId and periodStatus. Shows 'Generating…' during BullMQ job processing (polled every 2 seconds). This is the single labeled Export PDF — there is no standalone browser-Print link to /print/[reportId] because that route 308-redirects humans away."
  - route: /reports/[reportId]/present
    access: [admin]
    landing: "/reports/[reportId]?mode=slides"
    intents:
      - id: admin-report-present-redirects-to-slides
        intent: "Legacy published presentation deep link resolves to inline slides mode"
        given: "the admin opens a legacy /reports/[reportId]/present deep link"
        when: "the route is requested"
        then: "the response is a 308 permanent redirect to /reports/[reportId]?mode=slides; the standalone slide-deck surface no longer exists — presentation lives inline via the Edit/Slides view-mode toggle"
        note: "The standalone slide deck (section nav, fullscreen, Back-to-report link) is gone. The route is kept so existing deep links keep resolving; the sweep runner follows the redirect to ?mode=slides."
  - route: /reports/history
    access: [admin]
    landing: "/reports"
    intents:
      - id: admin-redirect-to-published
        intent: "Redirect to published history tab"
        given: "Admin accesses /reports/history"
        when: "page loads"
        then: "Browser redirects (307) to /reports?tab=published, landing on the main Reports page with archive=true"
        note: "Legacy archive page merged into Reports page. The redirect is immediate (server-side); no interactive surface on /reports/history itself."
      - id: admin-view-compiled-history
        intent: "View compiled report history across all leads"
        given: "Admin is on /reports?tab=published"
        when: "page loads after redirect"
        then: "Page displays 'Compiled report history.' subtitle; compiledHistory query loads and shows all published/compiled report entries in list view with sidebar summary"
        note: "Admin sees compiled (head-level aggregated) history, not personal lead history. Initial load shows first 10 entries."
      - id: admin-toggle-archive
        intent: "Include or exclude archived report periods"
        given: "Admin is viewing compiled history"
        when: "admin clicks the Archive toggle checkbox"
        then: "Archive badge count is visible; checking includes archived periods in the list; unchecking shows only active periods. URL updates to ?tab=published (archive on) or ?tab=drafts (archive off)."
        note: "Redirect lands with archive enabled (?tab=published); admin can toggle to hide archived periods."
      - id: admin-search-all-reports
        intent: "Search across all reports and products"
        given: "Admin is viewing history"
        when: "admin types in the SearchInput field"
        then: "Search placeholder reads 'Search reports and products…' and filters entries by name/product across all reports (searchScope='all')"
        note: "Admin searchScope='all' differs from lead (searchScope='mine') and viewer (searchScope=null, no search)."
      - id: admin-expand-history-list
        intent: "Expand to view all historical entries"
        given: "Admin is viewing history with more than 10 entries"
        when: "admin clicks 'Show all (N)' button"
        then: "Page displays all entries instead of first 10 only; button disappears"
        note: "Pagination control for expanded view; resets when archive toggle changes."
  - route: /reports/trends
    access: [admin]
    intents:
      - id: admin-view-trends-dashboard
        intent: "View analytics trends dashboard with traffic-light history, lead velocity, and period comparison"
        given: "admin user accessing /reports/trends"
        when: "the page loads"
        then: "three charts render: (1) traffic-light history line chart showing project statuses over periods, (2) lead velocity stacked bar chart showing submitted sections per lead per period, (3) period comparison table showing project status and risk delta between two periods"
        note: "Read-only analytics page; all charts load via tRPC queries. No mutations, no user state changes, no interactive controls. All authenticated roles see the same data."
