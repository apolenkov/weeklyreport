# Scenario Catalog — viewer
# Durable behavioral catalog (role x route x intent + Given/When/Then prose).
# NO file:line, NOT exhaustive. Generated by generate-catalog.workflow.mjs,
# human-reviewed. Format contract: e2e/catalog/README.md
role: viewer
generated: true
routes:
  - route: /
    access: [lead, head, admin, viewer]
    intents:
      - id: viewer-login-and-redirect
        intent: "Viewer authenticates and is directed to the published reports list"
        given: "Viewer is on the landing page without an active session"
        when: "the viewer signs in (via SSO in production or dev-login in dev mode)"
        then: "the session is established and the page auto-redirects to /reports?tab=published (the viewer's default landing after login)"
        note: "UX-16 (Phase 35-08): role-aware default landing. In production, the SSO button targets /auth/saml/login. In dev mode (AUTH_STUB=true), the button targets /auth/dev-login with role=viewer and the default email viewer@customreport.local. The redirect is deterministic and role-scoped—no viewer-specific form or choice on this page."
  - route: /reports
    access: [viewer]
    intents:
      - id: viewer-load-compiled-history
        intent: "Viewer loads the compiled report history (published periods + archived if toggled)"
        given: "Viewer is authenticated and has navigated to /reports"
        when: "The page loads for the viewer role"
        then: "The compiled history list displays all published reports, filtered by archive toggle state. A sidebar displays aggregated stats (total periods, on-time rate, avg items/week, total risks, traffic-light totals). No mutations occur."
        note: "Viewer uses compiledHistory query, not myHistory. searchScope is null (no search for viewer). Archive toggle persists to URL param (?tab=published or ?tab=drafts)."
      - id: viewer-toggle-archive-visibility
        intent: "Viewer toggles archived reports visibility via archive checkbox"
        given: "Viewer is viewing the compiled history list with archive toggle visible"
        when: "The viewer checks or unchecks the archive toggle"
        then: "The compiled history refetches with includeArchive={true|false}. The list re-renders showing or hiding archived periods. URL updates to ?tab=published (show archive) or ?tab=drafts (hide archive). No mutations occur."
        note: "Archive count badge is visible. Read-only surface — no form submission or state mutation, only query state change and navigation."
      - id: viewer-click-history-card-to-view
        intent: "Viewer clicks a report card in history to view its details"
        given: "A compiled report history entry is displayed as a clickable card"
        when: "The viewer clicks on a report card"
        then: "Navigation occurs to the report view route (e.g. /lead/report/{periodId} or a compiled-report variant). No mutations occur."
        note: "Card displays period label, status badge (submitted/published/archived/draft), traffic-light counts, item/risk/decision summary, and timeline metadata (created, last edit, submitted/published dates). This is navigation only, not a mutation."
      - id: viewer-view-history-sidebar-stats
        intent: "Viewer reads the history sidebar stats and submission status pattern"
        given: "The history sidebar is rendered alongside the compiled history list"
        when: "Viewer observes the sidebar"
        then: "The sidebar displays aggregated stats (submissions count, on-time rate %, avg items/week, total risks) and a submission status card describing the submission streak pattern. All data is read-only, derived from the compiled history entries."
        note: "Sidebar uses viewerMode=true, which adjusts copy to third-person perspective. Submission Status shows streak when present, or 'Most recent week is still a draft' (third-person variant). No interaction beyond reading."
  - route: /reports/[reportId]
    access: [viewer]
    intents:
      - id: viewer-view-report-detail
        intent: "View a published report's portfolio overview and product details"
        given: "The viewer is on a published report page"
        when: "The page loads with a reportId URL param"
        then: "The portfolio overview table and per-product accordions are displayed; the page title shows the week number and date range"
        note: "This is the primary read-only intent. The viewer can expand/collapse product accordions and scroll through the content. No mutations occur."
      - id: viewer-export-report-pdf
        intent: "Export the published report as a downloadable PDF"
        given: "The viewer is viewing a published or reopened report"
        when: "The viewer clicks the 'Export PDF' button and waits for generation"
        then: "A PDF export job is queued; status is polled; once complete, the PDF file opens in a new browser tab and a 'PDF ready' success toast appears"
        note: "Button is disabled if the report is in 'open' status (not yet published). Generation may take a few seconds; a 'Generating…' state is shown during polling."
      - id: viewer-open-presentation-view
        intent: "Open the report in presentation mode"
        given: "The viewer is viewing a report detail page"
        when: "The viewer clicks the 'Presentation' button"
        then: "Navigation occurs to /reports/[reportId]/present"
        note: "This is a simple link navigation; no mutation or state change occurs on the current page."
      - id: viewer-navigate-back-to-archive
        intent: "Return to the published reports archive list"
        given: "The viewer is viewing a report detail page"
        when: "The viewer clicks the 'Back to Archive' button"
        then: "Navigation occurs to /reports?tab=published"
        note: "This is a simple link navigation. The archive list displays all published (and archived) reports the viewer has access to."
  - route: /reports/[reportId]/present
    access: [viewer]
    intents:
      - id: viewer-navigate-sections
        intent: "Navigate through report sections using keyboard or UI controls"
        given: "a published report is loaded in presentation mode"
        when: "the viewer presses arrow keys (←/→ or K/J) or clicks the Previous/Next buttons"
        then: "the page scrolls to the next or previous section smoothly, and the section counter updates (e.g., '2 / 5')"
        note: "Keyboard navigation: ← or K for previous, → or J for next. UI buttons disable when at first or last section. Only shown when report has multiple sections."
      - id: viewer-fullscreen-presentation
        intent: "Toggle fullscreen mode for focused presentation viewing"
        given: "a published report is displayed in presentation mode"
        when: "the viewer presses F or clicks the Fullscreen button"
        then: "the browser enters/exits fullscreen mode (ESC also exits per browser standard), and the button text toggles between 'Fullscreen' and 'Exit fullscreen'"
        note: "Fullscreen applies white background and padding. Available only when report has multiple sections (UI buttons visible)."
      - id: viewer-read-published-report
        intent: "View the complete published status report in read-only mode"
        given: "the viewer navigates to /reports/[reportId]/present for a published report"
        when: "the page loads with a valid reportId for a published period"
        then: "the page displays the report title ('Status Presentation'), period navigator, portfolio overview table, and product/lead sections; no errors appear in console"
        note: "Viewer role is restricted to published reports only (enforced at service layer). The page is purely read-only—no mutations are exposed. A 'Back to report' link returns to the standard report view (/reports/[reportId])."
  - route: /reports/history
    access: [viewer]
    intents:
      - id: viewer-history-redirect
        intent: "Access legacy /reports/history bookmark and be redirected to current location"
        given: "viewer is authenticated"
        when: "viewer navigates to /reports/history"
        then: "browser is redirected (307) to /reports?tab=published"
        note: "Redirect stub (UX-17, Phase 35-08) — handles legacy bookmarks. No UI is rendered on this route itself; the redirect is the only observable behavior."
  - route: /reports/trends
    access: [viewer]
    intents:
      - id: viewer-trends-page-loads
        intent: "Viewer accesses analytics trends page and sees three analytics charts"
        given: "Viewer is authenticated and navigates to /reports/trends"
        when: "The page loads"
        then: "Three charts render: traffic-light history (line chart of status by period), lead velocity (stacked-bar chart of submitted sections per lead per period), and period comparison (delta table comparing two periods). Each chart either displays data or shows a \"No data\" message."
        note: "Route is read-only — no mutations, forms, or user-initiated actions. Layout gate permits 'lead', 'head', 'admin', 'viewer' roles; service-layer filters data scope by role."
