schema: spec-driven

context: |
  # Project
  WeeklyReport — internal SaaS for the CoreDev department. Six team leads
  fill structured weekly status sections (project traffic lights, current and
  next week items, risks, decisions, top priorities); the head reviews,
  publishes, and exports a unified PDF report.

  Resolve active work from `openspec list`; do not duplicate a release snapshot
  in this long-lived agent context.

  # Stack
  - Monorepo: pnpm 11.17 workspaces + Turborepo 2.5
  - Frontend: Next.js 16 (App Router, React Compiler), React 19, Tailwind 4,
    shadcn/ui via `@customreport/ui`, TanStack Query 5, tRPC 11 client
  - Backend: NestJS 11, Express 5, tRPC 11 server, Prisma 7 with
    `@prisma/adapter-pg`, BullMQ 5, Redis 7, PostgreSQL 15, OpenTelemetry,
    Prometheus prom-client
  - Auth: SAML via `@node-saml/passport-saml` + Keycloak (prod); dev-only
    `/auth/dev-login` gated behind `AUTH_DEV_MODE`
  - Validation: Zod 4 shared schemas in `@customreport/shared`
  - Testing: Vitest 4, Testing Library, MSW 2; Playwright is a production-only
    dependency of the API PDF worker
  - Node: >=26 (Docker pins Node 26 images; API installs Chromium explicitly)

  # Workspace layout
  apps/web         — Next.js frontend (`@customreport/web`)
  apps/api         — NestJS backend (`@customreport/api`)
  packages/shared  — Zod schemas + tRPC router types (`@customreport/shared`)
  packages/ui      — shadcn/ui + composition components (`@customreport/ui`)
  prisma/          — schema, migrations, seeds, destructive
                     guard

  # Roles
  - lead    — fills own report section (items, risks, decisions, priorities,
              traffic lights); submits
  - head    — lead capabilities + review + publish + PDF export
  - viewer  — read-only access to published reports + PDF download
  No runtime director role exists.

  # Domain model anchors
  Report (period) → ReportSection (per lead) → { ProjectStatus[], Item[]
  (current/next), Risk[], Decision[], Priority[] }. Versioning v8.4 adds
  autosave→snapshot wiring, pinned snapshots, time-based retention. Report
  carries both `periodState` and legacy period tuple — six writers must
  update both atomically (no DB constraint enforces this).

  # Conventions (load-bearing)
  - TypeScript strict everywhere; `no-explicit-any` is an error; no floating
    promises; `verbatimModuleSyntax: true` (use `import type`)
  - File names kebab-case with role suffix (`*.service.ts`,
    `*.prisma-repository.ts`, `*.router.ts`, `*.module.ts`); React component
    files kebab-case, exports PascalCase
  - tRPC procedures must use one of 8 canonical middleware-chain builders
    (role-coverage gate; CI compares by reference identity)
  - Repository interface lives in the service file; Prisma implementation in
    `*.prisma-repository.ts`; wired via `useFactory` in the module
  - Domain errors extend `Error`; map to tRPC errors in
    `apps/api/src/infrastructure/trpc/trpc.error-mapper.ts`; never leak
    internal messages to clients
  - Zod parse at every layer boundary (service input, repository output,
    router input); use `safeText()` helper for user-facing text fields
  - Shared schemas/enums live in `@customreport/shared` — update there
    before duplicating in app code
  - Static production UI strings in `apps/web/src/**/*.tsx` stay English
    until a real i18n phase exists; Russian is allowed only as data, seeds,
    comments, or tests
  - Deferred user-facing features use `ComingSoonBadge` from
    `@customreport/ui`; deferred backend paths throw
    `Error('Not implemented — see TODO(<ref>)')`
  - Disposable-database operations use the one exact validator in
    `prisma/guards/_destructive-guard.ts`: loopback only, raw URL path exactly
    `customreport_e2e` or `customreport_e2e_lane_[a-o]_test`, no query/fragment
    or encoded aliases, `NODE_ENV != production`, and exact per-run
    `PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION='давай'`; no
    `ALLOW_PROD_DESTRUCTIVE` bypass exists for these flows
  - Development operations use the same exact target contract; production
    restore remains a separate entrypoint and contract
  - Treat committed Prisma migrations as append-only. A history rewrite needs
    an explicit reviewed task and is allowed only for the exact disposable DB
    targets in `AGENTS.md`; the destructive guard and per-run consent still apply

  # Quality gates (must stay green)
  pnpm typecheck && pnpm lint && pnpm test && pnpm build

  # Sources of truth (read before proposing)
  - `prisma/schema.prisma` — current data model
  - `packages/shared/src/schemas/` — canonical Zod schemas

rules:
  proposal:
    - State the user-visible problem in plain language before the technical
      framing; one short paragraph maximum.
    - Cite the inventories that justify the change (existing files, planning
      memos, related issues) instead of restating background.
    - Include an explicit "Non-goals" list when scope could plausibly creep.
    - Keep proposals under ~400 words; longer rationale belongs in
      `design.md`.
  design:
    - Show before/after data flow when the change touches request paths,
      Prisma writes, or shared schemas.
    - Identify which of the load-bearing invariants the change preserves,
      mutates, or relaxes (period dual-state, role-coverage gate,
      destructive-db guard, deferred-feature pattern).
    - Surface rollout concerns — migration order, feature-flag gating,
      destructive ops, downstream consumers in apps/web and apps/api.
  tasks:
    - Group by repo target — shared/ui first, then api, then web, then
      planning + docs.
    - Each task should be small enough to land in one commit; bigger work
      gets split.
    - Verification step at the end must list the exact gate commands that
      were run.
  specs:
    - Express requirements as testable contracts ("the system MUST",
      "the system MUST NOT"), not as implementation steps.
    - Name the consumer surface explicitly (tRPC procedure, repository
      method, React route, Prisma model) so future changes can grep for it.
