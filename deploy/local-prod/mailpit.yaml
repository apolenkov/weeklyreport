# LOCAL STAND-IN for the corporate SMTP relay. SMTP on mailpit:1025 (no auth,
# no TLS), UI on 8025 via `kubectl port-forward svc/mailpit 8025`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 1025 }
            - { containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /livez, port: 8025 }
          resources:
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
