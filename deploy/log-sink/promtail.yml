# Phase 37-04: Promtail config template for shipping CustomReport logs to
# Loki. Alternative to vector.toml if you're already on the Loki/Promtail
# stack.
#
# Usage:
#   docker run -v ./promtail.yml:/etc/promtail/config.yml:ro \
#              -v apilogs:/app/logs:ro \
#              grafana/promtail:2.9.0 -config.file=/etc/promtail/config.yml
#
# Source: tails the rotated JSON log file written by AppLogger.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  # Adjust to your Loki endpoint.
  - url: ${LOKI_ENDPOINT:-http://loki:3100/loki/api/v1/push}

scrape_configs:
  - job_name: customreport-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: customreport-api
          service: customreport-api
          __path__: /app/logs/app.log

    pipeline_stages:
      # Parse our structured JSON log lines.
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            phase: phase
            correlation_id: correlationId
            user_id: userId
            duration: duration
            status: status

      # Use our own timestamp instead of arrival time.
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Promote useful fields to labels (kept low-cardinality).
      - labels:
          level:
          phase:

      # Output: keep the original JSON line as the message.
      - output:
          source: message
