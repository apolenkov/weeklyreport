# LOCAL STAND-IN for the corporate Keycloak/SAML IdP. Never deploy to production.
# Dev-mode Keycloak with an in-memory (dev-file) database, realm imported at
# start from the Secret `keycloak-realm` created by setup.sh (it holds the
# realm signing key, so it stays outside Git). Browser access: port-forward
# svc/keycloak 8081:8080 and use http://localhost:8081.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          imagePullPolicy: IfNotPresent
          args:
            [
              "start-dev",
              "--import-realm",
              "--hostname=${KC_ORIGIN}",
              "--http-enabled=true",
            ]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                { secretKeyRef: { name: keycloak-realm, key: ADMIN_PASSWORD } }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /realms/weeklyreport, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - {
                name: realm,
                mountPath: /opt/keycloak/data/import,
                readOnly: true,
              }
      volumes:
        - name: realm
          secret:
            secretName: keycloak-realm
            items: [{ key: realm.json, path: realm.json }]
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector: { app: keycloak }
  ports: [{ port: 8080, targetPort: 8080 }]
