apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "wr.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "wr.selector" (dict "component" "redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "wr.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  replicas: 1
  serviceName: redis
  selector:
    matchLabels:
      {{- include "wr.selector" (dict "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wr.labels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      {{- include "wr.podCommon" (dict "root" . "user" .Values.redis.runAsUser "fsGroup" .Values.redis.fsGroup) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.images.thirdParty.redis }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # The same maxmemoryMb feeds REDIS_MAXMEMORY_BYTES on the api.
          args:
            - redis-server
            - --maxmemory-policy
            - noeviction
            - --maxmemory
            - {{ printf "%dmb" (int64 .Values.redis.maxmemoryMb) | quote }}
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- include "wr.containerSecurity" (dict) | nindent 10 }}
          volumeMounts:
            - { name: redisdata, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: redisdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.redisSize }}
