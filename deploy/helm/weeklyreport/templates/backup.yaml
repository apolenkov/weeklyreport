apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgbackups
  labels:
    {{- include "wr.labels" (dict "root" . "component" "backup") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.backupSize }}
---
# Same-cluster storage is a recovery mechanism, not off-cluster protection.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  labels:
    {{- include "wr.labels" (dict "root" . "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "wr.labels" (dict "root" . "component" "backup") | nindent 12 }}
        spec:
          # Dumps are mode 0600 and postgres mounts the volume: same identity.
          {{- include "wr.podCommon" (dict "root" . "user" .Values.postgres.runAsUser "fsGroup" .Values.postgres.runAsUser) | nindent 10 }}
          # pgbackups is ReadWriteOnce and mounted by postgres too: on a
          # multi-node cluster only the postgres node can attach it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "wr.selector" (dict "component" "postgres") | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ include "wr.image" (dict "root" . "name" "backup") }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              command: ["/usr/local/bin/backup-loop.sh"]
              env:
                # Direct to postgres: pg_dump needs one session for the whole dump.
                - { name: PGHOST, value: postgres }
                - { name: PGPORT, value: "5432" }
                - { name: PGUSER, value: weeklyreport }
                - name: PGPASSWORD
                  {{- include "wr.secretRef" (dict "root" . "key" "DB_PASSWORD") | nindent 18 }}
                - { name: PGDATABASE, value: {{ .Values.postgres.db | quote }} }
                - { name: RESTORE_ENVIRONMENT, value: production }
                - { name: BACKUP_DIR, value: /backups }
                - { name: BACKUP_RETENTION_DAYS, value: {{ .Values.backup.retentionDays | quote }} }
                - { name: BACKUP_RUN_ONCE, value: "true" }
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              {{- include "wr.containerSecurity" (dict) | nindent 14 }}
              volumeMounts:
                - { name: pgbackups, mountPath: /backups }
          volumes:
            - name: pgbackups
              persistentVolumeClaim:
                claimName: pgbackups
