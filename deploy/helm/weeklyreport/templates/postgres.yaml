apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "wr.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "wr.selector" (dict "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "wr.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      {{- include "wr.selector" (dict "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wr.labels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      {{- include "wr.podCommon" (dict "root" . "user" .Values.postgres.runAsUser "fsGroup" .Values.postgres.runAsUser) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.images.thirdParty.postgres }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - { name: POSTGRES_USER, value: customreport }
            - name: POSTGRES_PASSWORD
              {{- include "wr.secretRef" (dict "root" . "key" "DB_PASSWORD") | nindent 14 }}
            - { name: POSTGRES_DB, value: {{ .Values.postgres.db | quote }} }
            # A subdirectory: a fresh volume holds lost+found, which makes
            # initdb refuse the mount point.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U customreport -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U customreport -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          {{- include "wr.containerSecurity" (dict) | nindent 10 }}
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.postgresSize }}
