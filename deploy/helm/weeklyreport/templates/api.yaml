apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    {{- include "wr.labels" (dict "root" . "component" "api") | nindent 4 }}
data:
  {{- range $key, $value := .Values.api.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.api.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdfdata
  labels:
    {{- include "wr.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.pdfSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "wr.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "wr.selector" (dict "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "wr.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: 1
  # pdfdata is ReadWriteOnce: a rolling update would start a second pod on it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wr.selector" (dict "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wr.labels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (list .Values.api.env .Values.api.extraEnv) | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "wr.podCommon" (dict "root" . "user" .Values.api.runAsUser "fsGroup" .Values.api.runAsUser) | nindent 6 }}
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: migrate
          image: {{ include "wr.image" (dict "root" . "name" "migrate") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              {{- include "wr.passwordCheck" . | nindent 14 }}
              exec ./node_modules/.bin/prisma migrate deploy
          env:
            - name: DB_PASSWORD
              {{- include "wr.secretRef" (dict "root" . "key" "DB_PASSWORD") | nindent 14 }}
            # Direct to postgres: DDL needs a session, pgbouncer is transaction mode.
            - name: DATABASE_URL
              value: {{ printf "postgresql://customreport:$(DB_PASSWORD)@postgres:5432/%s" .Values.postgres.db | quote }}
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.api.migrateResources | nindent 12 }}
          {{- include "wr.containerSecurity" (dict) | nindent 10 }}
      containers:
        - name: api
          image: {{ include "wr.image" (dict "root" . "name" "api") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              {{- include "wr.secretRef" (dict "root" . "key" "DB_PASSWORD") | nindent 14 }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://customreport:$(DB_PASSWORD)@pgbouncer:5432/%s?pgbouncer=true&connection_limit=1" .Values.postgres.db | quote }}
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - name: REDIS_MAXMEMORY_BYTES
              value: {{ mul (int64 .Values.redis.maxmemoryMb) 1048576 | quote }}
            - { name: PORT, value: "3001" }
            - { name: API_HOST, value: 0.0.0.0 }
            - { name: NODE_ENV, value: production }
            - { name: AUTH_DEV_MODE, value: "false" }
            - { name: PDF_OUTPUT_DIR, value: /app/data/pdfs }
            - name: PDF_BASE_URL
              value: {{ include "wr.printOrigin" . | quote }}
            - { name: GOTENBERG_URL, value: "http://gotenberg:3000" }
            - { name: OTEL_SERVICE_NAME, value: customreport-api }
            - name: OTEL_SERVICE_VERSION
              value: {{ .Values.images.tag | quote }}
            - name: AUTH_JWT_SECRET
              {{- include "wr.secretRef" (dict "root" . "key" "AUTH_JWT_SECRET") | nindent 14 }}
            - name: PDF_EXPORT_JWT_SECRET
              {{- include "wr.secretRef" (dict "root" . "key" "PDF_EXPORT_JWT_SECRET") | nindent 14 }}
            - name: AI_PROVIDER_CONFIG_ENCRYPTION_KEY
              {{- include "wr.secretRef" (dict "root" . "key" "AI_PROVIDER_CONFIG_ENCRYPTION_KEY") | nindent 14 }}
            - name: SMTP_USER
              {{- include "wr.secretRef" (dict "root" . "key" "SMTP_USER" "optional" true) | nindent 14 }}
            - name: SMTP_PASS
              {{- include "wr.secretRef" (dict "root" . "key" "SMTP_PASS" "optional" true) | nindent 14 }}
            - name: SENTRY_DSN
              {{- include "wr.secretRef" (dict "root" . "key" "SENTRY_DSN" "optional" true) | nindent 14 }}
          # Liveness stays process-only: failing it on a database outage would
          # restart every api pod.
          startupProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "wr.containerSecurity" (dict) | nindent 10 }}
          volumeMounts:
            - { name: pdfdata, mountPath: /app/data/pdfs }
      volumes:
        - name: pdfdata
          persistentVolumeClaim:
            claimName: pdfdata
