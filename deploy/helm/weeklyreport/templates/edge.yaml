apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-caddyfile
  labels:
    {{- include "wr.labels" (dict "root" . "component" "edge") | nindent 4 }}
data:
  Caddyfile: |
    {{- .Files.Get "files/Caddyfile" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels:
    {{- include "wr.labels" (dict "root" . "component" "edge") | nindent 4 }}
spec:
  selector:
    {{- include "wr.selector" (dict "component" "edge") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    {{- include "wr.labels" (dict "root" . "component" "edge") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wr.selector" (dict "component" "edge") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wr.labels" (dict "root" . "component" "edge") | nindent 8 }}
      annotations:
        checksum/caddyfile: {{ .Files.Get "files/Caddyfile" | sha256sum }}
    spec:
      {{- include "wr.podCommon" (dict "root" . "user" .Values.edge.runAsUser) | nindent 6 }}
      containers:
        - name: caddy
          image: {{ .Values.images.thirdParty.caddy }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # The Ingress terminates TLS: a plain-HTTP site never runs ACME, but
            # an empty `email` is a Caddyfile parse error, so it gets a fixed literal.
            - { name: CADDY_SITE_ADDRESS, value: "http://:8080" }
            - { name: CADDY_ACME_EMAIL, value: "unused@weeklyreport.invalid" }
            - name: CADDY_CSP_REPORT_URI
              value: {{ .Values.edge.cspReportUri | quote }}
            - name: CADDY_TRUSTED_PROXIES
              value: {{ join " " .Values.edge.trustedProxies | quote }}
          readinessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          # The official image's binary carries a file capability for low ports;
          # exec fails with every capability dropped.
          {{- include "wr.containerSecurity" (dict "add" (list "NET_BIND_SERVICE")) | nindent 10 }}
          volumeMounts:
            - { name: caddyfile, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true }
            - { name: caddy-data, mountPath: /data }
            - { name: caddy-config, mountPath: /config }
      volumes:
        - name: caddyfile
          configMap:
            name: edge-caddyfile
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weeklyreport
  labels:
    {{- include "wr.labels" (dict "root" . "component" "edge") | nindent 4 }}
  {{- with .Values.edge.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.edge.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.edge.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.edge.ingress.host }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.edge.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge
                port:
                  number: 8080
