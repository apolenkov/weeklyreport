{{- include "wr.validateSecrets" . }}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wr.secretName" . }}
  labels:
    {{- include "wr.labels" (dict "root" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
