apiVersion: 1

# Product and business KPI dashboards have a dedicated, non-overlapping path.
providers:
  - name: WeeklyReport-Product-KPIs
    orgId: 1
    folder: Product KPIs
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/weeklyreport/product
