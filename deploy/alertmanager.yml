global:
  resolve_timeout: 5m

route:
  receiver: webhook-stub
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: webhook-stub
    webhook_configs:
      # The /api/alerts endpoint does not exist yet; alerting must not be activated until it does.
      # Replace with Slack/PagerDuty/email config for production use.
      - url: "http://api:3001/api/alerts"
        send_resolved: true
