global:
  resolve_timeout: 5m

route:
  receiver: webhook-stub
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: webhook-stub
    webhook_configs:
      # Template only: /api/alerts does not exist and this file is not loaded by
      # the Compose stack. Replace with an owned external receiver and obtain
      # delivery read-back before treating alerting as production-ready.
      - url: "http://api:3001/api/alerts"
        send_resolved: true
