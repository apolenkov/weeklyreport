# Phase 37-03: Prometheus scrape config for CustomReport prod stack.
#
# Brings up alongside docker-compose.observability.yml. The api service
# exposes /metrics on its container port (3002 by default); Prometheus
# scrapes every 15s. Adjust the targets list if your prod compose maps
# different ports.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: customreport-prod

scrape_configs:
  # CustomReport API — Prometheus default metrics + custom counters
  # (cr_dlq_failed_total, cr_login_attempts_total, cr_rate_limit_hits_total).
  - job_name: customreport-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - api:3002
        labels:
          service: api

  # Postgres exporter (if you bring postgres_exporter up alongside).
  # Comment out if not running an exporter sidecar.
  - job_name: postgres
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres

  # Redis exporter (if you bring redis_exporter up alongside).
  - job_name: redis
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

