# Local development dependencies in the OrbStack Kubernetes namespace wr-dev.
# Disposable synthetic data only; production is the Helm chart. OrbStack
# publishes LoadBalancer services on localhost, so `pnpm dev` reaches them at
# the same ports as before: Postgres 5432, Redis 6379, Mailpit 1025/8025,
# Gotenberg 3010. The pg-init ConfigMap is created by up.sh from
# deploy/postgres/init-pg-stat-statements.sql.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: LoadBalancer
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          # Existing PostgreSQL 15 files need the same major and Bookworm collation.
          # Trixie changes glibc collation 2.36 to 2.41 (TASK-359, 2026-10-09).
          image: pgvector/pgvector:0.8.7-pg15-bookworm@sha256:47af0b65960b14f1c6945aa4ccae37836c632e9a6fe0eea9160936e616e5b2e9
          # pg_stat_statements mines real slow-query stats; statements over
          # 200ms are logged to the pod log.
          args:
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - pg_stat_statements.max=10000
            - -c
            - log_min_duration_statement=200
          env:
            - { name: POSTGRES_USER, value: weeklyreport }
            - { name: POSTGRES_PASSWORD, value: localdev }
            - { name: POSTGRES_DB, value: weeklyreport_e2e }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec:
              command: [pg_isready, -U, weeklyreport, -d, postgres]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-pg-stat-statements.sql
              subPath: init-pg-stat-statements.sql
              readOnly: true
      volumes:
        - name: init
          configMap: { name: pg-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: LoadBalancer
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
          args:
            - redis-server
            - --maxmemory-policy
            - noeviction
            - --maxmemory
            - 200mb
            - --appendonly
            - "yes"
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  type: LoadBalancer
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
          env:
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true" }
            - { name: MP_MAX_MESSAGES, value: "5000" }
          ports:
            - { containerPort: 1025 }
            - { containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /livez, port: 8025 }
---
apiVersion: v1
kind: Service
metadata:
  name: gotenberg
spec:
  type: LoadBalancer
  selector: { app: gotenberg }
  ports:
    - { name: http, port: 3010, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
spec:
  replicas: 1
  selector:
    matchLabels: { app: gotenberg }
  template:
    metadata:
      labels: { app: gotenberg }
    spec:
      containers:
        - name: gotenberg
          image: gotenberg/gotenberg:8.38.1-chromium@sha256:5da4ab7b8fe7326537369e17b661be765d9a2887f77722faacdbe6d55812fb96
          # Conversions are serialized and the clear-* flags keep the shared
          # browser stateless. The renderer must reach the host-run web on
          # the OrbStack host alias, so the allow-list is pinned to that alias
          # and the private-IP deny is lifted; the public-IP deny stays.
          env:
            - { name: API_TIMEOUT, value: 150s }
            - { name: CHROMIUM_MAX_CONCURRENCY, value: "1" }
            - { name: CHROMIUM_CLEAR_COOKIES, value: "true" }
            - { name: CHROMIUM_CLEAR_STORAGE, value: "true" }
            - { name: CHROMIUM_CLEAR_CACHE, value: "true" }
            - name: CHROMIUM_ALLOW_LIST
              value: '^http://host\.internal:[0-9]+/'
            - { name: CHROMIUM_DENY_PRIVATE_IPS, value: "false" }
            - { name: CHROMIUM_DENY_PUBLIC_IPS, value: "true" }
          ports:
            - { containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 10
          resources:
            limits: { memory: 1Gi }
