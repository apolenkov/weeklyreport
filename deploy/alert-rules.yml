groups:
  - name: customreport
    rules:
      # Fire when the authoritative DLQ count stays non-zero for 5 minutes.
      - alert: DLQFailuresActive
        expr: cr_dlq_failed_current > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "BullMQ DLQ has failed jobs"
          description: "{{ $value }} failed jobs in DLQ for >5m. Check /admin/queues."

      # Fire when the API scrape target disappears.
      - alert: ApiDown
        expr: up{job="customreport-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CustomReport API is unreachable"
          description: "Prometheus cannot scrape /metrics — API may be down."

      # Fire when p95 CLS exceeds 0.25 (poor threshold). web_vital_cls is a
      # histogram, so the bare series no longer exists — derive the quantile
      # from its _bucket series instead of comparing a gauge value directly.
      - alert: ClsPoor
        expr: histogram_quantile(0.95, sum by (le) (rate(web_vital_cls_bucket[5m]))) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CLS above poor threshold"
          description: "p95 CLS={{ $value | humanize }} — Cumulative Layout Shift is in the 'poor' range (>0.25)."
