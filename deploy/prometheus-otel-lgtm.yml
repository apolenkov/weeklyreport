---
# Compose-owned Prometheus config for grafana/otel-lgtm (prod targets).
# Mounted to /otel-lgtm/prometheus.yaml inside the container.
# Extends the otel-lgtm defaults with scrape configs for our exporters.
# Dev overrides this mount with prometheus-otel-lgtm.dev.yml
# (docker-compose.dev.yml), whose api target is the dev host port — a static
# file cannot switch targets per environment, and a permanently-down target
# would keep the ApiDown alert firing.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_native_histograms: true
  external_labels:
    cluster: customreport-local

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - host.name

rule_files:
  - /otel-lgtm/alert-rules.yml

scrape_configs:
  - job_name: customreport-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      # Prod scrapes compose-network service DNS on the api's internal port.
      - targets: ["api:3001"]
        labels:
          service: api

  - job_name: postgres
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

storage:
  tsdb:
    out_of_order_time_window: 10m
