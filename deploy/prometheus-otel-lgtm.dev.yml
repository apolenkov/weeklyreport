---
# Compose-owned Prometheus config for grafana/otel-lgtm (development override).
# Mounted to /otel-lgtm/prometheus.yaml inside the container.
# Extends the otel-lgtm defaults with scrape configs for our exporters.
# Mounted by docker-compose.observability.dev.yml, composed last over the
# prod-true file. The api target is the published dev host port, which reaches
# both the dev api container and an api run from source on the host.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_native_histograms: true
  external_labels:
    cluster: customreport-local

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - host.name

rule_files:
  - /otel-lgtm/alert-rules.yml

scrape_configs:
  - job_name: customreport-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      # Dev scrapes the published host port (container or source-run api).
      - targets: ["host.docker.internal:3002"]
        labels:
          service: api

  - job_name: postgres
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

storage:
  tsdb:
    out_of_order_time_window: 10m
