title = "WeeklyReport secret scan"

[extend]
useDefault = true

# Reviewed 2026-10-15 (TASK-522 WR1). Every entry is a synthetic or non-secret
# value; a new finding anywhere else fails the blocking CI job. HEAD entries are
# path-scoped. History entries use exact fingerprints in .gitleaksignore
# or combine a path with the reviewed commit.

[[allowlists]]
description = "Synthetic SAML test key fixture (not a deployed credential)"
paths = ['''^apps/api/src/modules/auth/__fixtures__/saml/sp\-key\.pem$''']

[[allowlists]]
description = "Placeholder or synthetic test value (REPLACE-style or fixed test string)"
condition = "AND"
paths = ['''^apps/api/src/modules/auth/auth\.controller\.cookie\.test\.ts$''']
regexes = ['''^phase\-01\-secret\-padded\-to\-min\-32\-chars$''']

[[allowlists]]
description = "Synthetic SAML test key fixture (not a deployed credential)"
paths = ['''^apps/api/src/modules/auth/__fixtures__/saml/idp\-key\.pem$''']

[[allowlists]]
description = "Placeholder or synthetic test value (REPLACE-style or fixed test string)"
condition = "AND"
paths = ['''^apps/api/src/modules/search/application/clarification\-token\.test\.ts$''']
regexes = ['''^clarification\-test\-secret\-with\-at\-least\-32\-chars$''']

[[allowlists]]
description = "Placeholder or synthetic test value (REPLACE-style or fixed test string)"
condition = "AND"
paths = ['''^deploy/helm/weeklyreport/values\-local\-prod\.example\.yaml$''']
regexes = ['''^REPLACE_WITH_IDP_CERT_B64$''']

[[allowlists]]
description = "Placeholder or synthetic test value (REPLACE-style or fixed test string)"
condition = "AND"
paths = ['''^deploy/tester\-kit/values\-tester\.yaml$''']
regexes = ['''^REPLACE_WITH_IDP_CERT_B64$''']

[[allowlists]]
description = "Deleted planning/issue-export file: documented default dev credentials or issue keys, not secrets"
condition = "AND"
commits = ["31f82fd1615ee754c2ffa516d9685df9a36f73d4"]
paths = ['''^\.planning/plans/tingly\-wandering\-brooks\.md$''']

[[allowlists]]
description = "Deleted planning/issue-export file: documented default dev credentials or issue keys, not secrets"
condition = "AND"
commits = ["fe93b583ee5ad5508b8ba4db43b97ce6ccfd7411"]
paths = ['''^\.planning/phases/47\-developer\-experience/47\-03\-SUMMARY\.md$''']
