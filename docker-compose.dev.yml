services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: installer
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: installer
    # Run dev server directly (no --env-file; env comes from 'environment' below)
    command: >
      sh -c "cd apps/api &&
      pnpm exec prisma generate --schema ../../prisma/schema.prisma &&
      exec node
      --import @swc-node/register/esm-register
      --watch src/main.ts"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./prisma:/app/prisma
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - apilogs:/app/logs
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev
      DIRECT_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3002
      FRONTEND_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production-min-32-chars!!}
      PDF_BASE_URL: http://web:3000
      PDF_OUTPUT_DIR: /app/data/pdfs
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:-dev-only-replace-in-production-min-32-chars}
      SMTP_HOST: mailhog
      LOG_LEVEL: debug
      LOG_DIR: /app/logs
      # host.docker.internal resolves to the Docker host on Mac/Windows —
      # otel-lgtm and bugsink run in a separate compose project (customreport-obs)
      # so they are on a different Docker network and not reachable by service name.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: customreport-api
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      HEAP_HEALTH_THRESHOLD_BYTES: ${HEAP_HEALTH_THRESHOLD_BYTES:-1610612736}
      SENTRY_DSN: ${SENTRY_DSN_DOCKER:-}
      # Remaining optional coverage vars (all declared .optional() in envSchema,
      # each defaulting to its consumer behaviour when absent): TG_BOT_TOKEN,
      # CLIENT_LOG_FORWARDING, AUTH_DEV_MODE_ALLOW_TEST, CUSTOMREPORT_REPO_ROOT,
      # DLQ_ALERT_THRESHOLD, AUTH_JWT_COOKIE_NAME. Add a pass-through line here
      # only when a run needs to override the default. See .env.example.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    develop:
      watch:
        - action: restart
          path: ./apps/api/src
        - action: restart
          path: ./packages/shared/src
        - action: restart
          path: ./prisma/schema.prisma

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: installer
    command: ["pnpm", "--filter=@customreport/web", "dev"]
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    environment:
      NODE_ENV: development
      API_URL: http://api:3002
      NEXT_PUBLIC_API_URL: http://api:3002
      AUTH_DEV_MODE: "true"
      NEXT_PUBLIC_AUTH_STUB: "true"
      NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
      # Sentry/Bugsink error tracking — reads from host .env via ${} interpolation
      SENTRY_DSN: ${SENTRY_DSN_DOCKER:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN_DOCKER:-}
    depends_on:
      - api
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: restart
          path: ./apps/web/src
        - action: restart
          path: ./packages/shared/src

volumes:
  apilogs:
