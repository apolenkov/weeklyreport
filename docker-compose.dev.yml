services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: installer
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: installer
    # Run dev server directly (no --env-file; env comes from 'environment' below)
    command: >
      sh -c "cd apps/api &&
      pnpm exec prisma generate --schema ../../prisma/schema.prisma &&
      exec node
      --import @swc-node/register/esm-register
      --watch src/main.ts"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./prisma:/app/prisma
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev
      DIRECT_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3002
      FRONTEND_URL: http://localhost:3000
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production-min-32-chars!!}
      PDF_BASE_URL: http://web:3000
      PDF_OUTPUT_DIR: /app/data/pdfs
      SMTP_HOST: mailhog
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    develop:
      watch:
        - action: restart
          path: ./apps/api/src
        - action: restart
          path: ./packages/shared/src
        - action: restart
          path: ./prisma/schema.prisma

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: installer
    command: ["pnpm", "--filter=@customreport/web", "dev"]
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    environment:
      NODE_ENV: development
      API_URL: http://api:3002
      NEXT_PUBLIC_API_URL: http://api:3002
      AUTH_DEV_MODE: "true"
      NEXT_PUBLIC_AUTH_STUB: "true"
      NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
    depends_on:
      - api
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: restart
          path: ./apps/web/src
        - action: restart
          path: ./packages/shared/src
