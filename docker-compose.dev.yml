services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: installer
    environment:
      DATABASE_URL: postgresql://customreport:localdev@postgres:5432/customreport_e2e

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: installer
    # Run dev server directly (no --env-file; env comes from 'environment' below)
    command: >
      sh -c "cd apps/api &&
      pnpm exec prisma generate --schema ../../prisma/schema.prisma &&
      exec node
      --import tsx
      --watch src/main.ts"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/report-persistence/src:/app/packages/report-persistence/src
      - ./prisma:/app/prisma
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
      - apilogs:/app/logs
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://customreport:localdev@postgres:5432/customreport_e2e
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_MAXMEMORY_BYTES: 209715200
      AI_PROVIDER_CONFIG_ENCRYPTION_KEY: ${AI_PROVIDER_CONFIG_ENCRYPTION_KEY:?AI_PROVIDER_CONFIG_ENCRYPTION_KEY must be set}
      AI_PROVIDER_CONFIG_KEY_VERSION: ${AI_PROVIDER_CONFIG_KEY_VERSION:?AI_PROVIDER_CONFIG_KEY_VERSION must be set}
      AI_PROVIDER_ALLOWED_ORIGINS: ${AI_PROVIDER_ALLOWED_ORIGINS:?AI_PROVIDER_ALLOWED_ORIGINS must be set}
      # The source-watch lane must never send report-derived data to a remote
      # provider, even if a shell or .env file contains an approval value.
      REPORT_ASSISTANT_OUTBOUND_DATA_APPROVED: "false"
      REPORT_ASSISTANT_INPUT_VERSION: ${REPORT_ASSISTANT_INPUT_VERSION:?REPORT_ASSISTANT_INPUT_VERSION must be set}
      REPORT_ASSISTANT_SIMILARITY_THRESHOLD: ${REPORT_ASSISTANT_SIMILARITY_THRESHOLD:?REPORT_ASSISTANT_SIMILARITY_THRESHOLD must be set}
      REPORT_ASSISTANT_CANDIDATE_LIMIT: ${REPORT_ASSISTANT_CANDIDATE_LIMIT:?REPORT_ASSISTANT_CANDIDATE_LIMIT must be set}
      REPORT_ASSISTANT_READ_THROUGH_LIMIT: ${REPORT_ASSISTANT_READ_THROUGH_LIMIT:?REPORT_ASSISTANT_READ_THROUGH_LIMIT must be set}
      REPORT_ASSISTANT_EXHAUSTIVE_LIMIT: ${REPORT_ASSISTANT_EXHAUSTIVE_LIMIT:?REPORT_ASSISTANT_EXHAUSTIVE_LIMIT must be set}
      REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET: ${REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET:?REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET must be set}
      REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS: ${REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS:?REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS must be set}
      REPORT_ASSISTANT_PLANNER_MAX_TOKENS: ${REPORT_ASSISTANT_PLANNER_MAX_TOKENS:?REPORT_ASSISTANT_PLANNER_MAX_TOKENS must be set}
      REPORT_ASSISTANT_ANSWER_MAX_TOKENS: ${REPORT_ASSISTANT_ANSWER_MAX_TOKENS:?REPORT_ASSISTANT_ANSWER_MAX_TOKENS must be set}
      REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE: ${REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE:?REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE must be set}
      REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET: ${REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET:?REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET must be set}
      PORT: 3002
      API_HOST: 0.0.0.0
      FRONTEND_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-development-min-32-chars!!}
      PDF_BASE_URL: http://web:3000
      PDF_OUTPUT_DIR: /app/data/pdfs
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:-dev-only-replace-in-production-min-32-chars}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      LOG_LEVEL: debug
      LOG_DIR: /app/logs
      # The observability overlay joins this Compose project, so the collector
      # remains reachable by its stable service name without host routing.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: customreport-api
      # Required whenever the SDK starts (otel.bootstrap requireEnv) so a build
      # label is never inherited from a code default.
      OTEL_SERVICE_VERSION: dev
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      HEAP_HEALTH_THRESHOLD_BYTES: ${HEAP_HEALTH_THRESHOLD_BYTES:-1610612736}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Optional values are intentionally omitted here; local runs use the
      # consumer defaults unless a targeted command supplies an override.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:3002"
    develop:
      watch:
        - action: restart
          path: ./apps/api/src
        - action: restart
          path: ./packages/shared/src
        - action: restart
          path: ./packages/report-persistence/src
        - action: restart
          path: ./prisma/schema.prisma

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: installer
    command:
      [
        "pnpm",
        "--filter=@customreport/web",
        "exec",
        "next",
        "dev",
        "--webpack",
        "--hostname",
        "0.0.0.0",
      ]
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/ui/src:/app/packages/ui/src
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    environment:
      NODE_ENV: development
      API_URL: http://api:3002
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_STUB: "true"
      NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
      # Sentry/Bugsink error tracking — reads the canonical root environment.
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    develop:
      watch:
        - action: restart
          path: ./apps/web/src
        - action: restart
          path: ./packages/shared/src

volumes:
  apilogs:
