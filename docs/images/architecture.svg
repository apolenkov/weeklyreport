<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="605" viewBox="0 0 1200 605" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура WeeklyReport</title>
  <desc id="desc">Браузер, Next.js, сервер NestJS с tRPC, Prisma и PostgreSQL. API обращается к Redis, Gotenberg и SMTP. Внизу перечислены четыре пакета монорепозитория.</desc>
