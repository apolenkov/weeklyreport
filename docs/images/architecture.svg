    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5c7086"/>
    </marker>
  </defs>
  <rect width="1200" height="605" rx="24" fill="#f2f6fa"/>
  <rect x="24" y="24" width="1152" height="557" rx="20" fill="#fff" stroke="#c8d7e6"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#142a41">
