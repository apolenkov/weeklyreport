    <rect x="252" y="140" width="232" height="90" rx="12" fill="#e8f4fc" stroke="#70a9cb"/>
    <rect x="580" y="140" width="249" height="90" rx="12" fill="#ddf5f0" stroke="#6fb8aa"/>
    <rect x="957" y="140" width="195" height="90" rx="12" fill="#f2f6fa" stroke="#aabed2"/>
    <g font-size="21" font-weight="700">
      <text x="66" y="182">Браузер</text>
      <text x="272" y="176">apps/web</text>
      <text x="600" y="176">apps/api</text>
      <text x="975" y="182">PostgreSQL</text>
    </g>
