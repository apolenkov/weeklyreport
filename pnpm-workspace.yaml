# pnpm 11+ build script allowlist (native / postinstall tooling).
allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  "@sentry/cli": true
  # Declined deliberately: the postinstall only resolves a native binding that
  # the platform-specific optional dependency already provides (verified).
  "@swc/core": false
  # Agentation MCP-only delegates persistence to the product HTTP API, so its
  # optional local SQLite backend must not run a native install script here.
  better-sqlite3: false
  # Declined: the lefthook postinstall installs git hooks, which the root
  # `prepare` script already does.
  lefthook: false
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

# These plugins currently publish peer ranges through ESLint 9, while this
# repository deliberately runs the verified ESLint 10 toolchain. Keep the
# exception scoped to the two plugin-to-ESLint edges; all other peer contracts
# remain strict and visible to pnpm.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": ">=10 <11"
    "eslint-plugin-jsx-a11y>eslint": ">=10 <11"

overrides:
  # Upper bounds are load-bearing on EVERY entry here: an open-ended floor let
  # `pnpm update` carry vite across a major silently, which is a decision, not a
  # currency bump. Below 1.0 the minor is the breaking axis, hence `<0.9`:
  # node-saml 5.1.0, xml-crypto, and xml-encryption declare `^0.8.x` and break
  # on the 0.9 parser API (removed errorHandler object, required
  # parseFromString mimeType), so the global override must stay inside the 0.8
  # line. samlify 2.15.1 migrated to `^0.9.12`; that edge alone is scoped below
  # so the production node-saml parser keeps the compatible line (TASK-513 G3b).
  "@xmldom/xmldom": ">=0.8.15 <0.9"
  # samlify 2.15.1's own parser must be 0.9.12+; every other consumer of
  # @xmldom/xmldom stays on 0.8 via the global override above.
  "samlify>@xmldom/xmldom": ">=0.9.12 <0.10"
  protobufjs: ">=8.8.1 <9"
  # Keep the Vite peer resolution identical across workspace test consumers.
  vite: "8.3.5"
  # Keep both brace-expansion ranges: the graph contains incompatible 1.x and
  # 5.x consumers, so one cross-major override would be unsafe.
  "brace-expansion@<2": ">=1.1.21 <2"
  "brace-expansion@>=4 <6": ">=5.0.12 <6"
  # prisma@7.10.0 pins mysql2 exactly at 3.15.3, which carries open advisories
  # (GHSA-rgwj-5xj2-c3m3 and a second <3.22.0 finding); floor at the patched
  # line, cap below the next major. mysql2 is prisma's internal MySQL driver
  # and is never exercised by this PostgreSQL-only product.
  mysql2: ">=3.24.5 <4"
  fast-uri: ">=4.2.3 <5"
  # @nestjs/platform-express 12.2.0 (the current release) pins multer 2.4.0
  # exactly, which carries GHSA-q7qp-rjg7-q26m; the patched 2.5.0 belongs to the
  # same major. Temporarily, until the platform adapter ships a fixed pin, floor
  # at the patched release and cap below the next major.
  multer: ">=2.5.0 <3"
  # Dev-only transitives (jsdom, agentation-mcp) with open advisories; stay in the same major.
  # Floor at the latest patched undici (GHSA-xjj6-f33q-929c, >=8.12.2); jsdom declares ^8.11.2.
  # Keep the jsdom transport reproducible; the complete Web suite verifies this exact release.
  undici: "8.12.3"
  hono: ">=4.13.13 <5"
  # Keep transitive packages in verified major ranges.
  js-yaml: ">=5.4.3 <6"
  nanoid: ">=6.0.2 <7"
  # These are transitive through Prisma, Next.js, and the CSS toolchain.
  find-my-way: ">=9.10.0 <10"
  sharp: ">=0.35.5 <0.36"
  postcss: ">=8.5.31 <9"
  # Prisma pins valibot exactly, so the safe current range is enforced here.
  valibot: ">=1.5.0 <2"
  # Prisma 7.10 pins a recursion-vulnerable 7.x; require the cycle-safe major.
  deepmerge-ts: ">=8.0.2 <9"

