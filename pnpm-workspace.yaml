packages:
  - apps/*
  - packages/*

# pnpm 11+ build script allowlist (native / postinstall tooling).
allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  playwright: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - "@nestjs/core"
  - playwright
  - esbuild
  - msgpackr-extract
  - sharp
  - "@sentry/cli"
  - msw
  - unrs-resolver

# Track latest deliberately during MVP; re-enable (e.g. 1440) once prod is live.
minimumReleaseAge: 0

overrides:
  "@xmldom/xmldom": ">=0.8.13"
  protobufjs: ">=8.0.2"
  vite: ">=7.3.2"
  fast-uri: ">=3.1.2"

patchedDependencies:
  "samlify@2.13.1": patches/samlify@2.13.1.patch
