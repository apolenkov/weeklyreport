packages:
  - apps/*
  - packages/*

catalog:
  "luxon": "^3.7.2"
  "@types/luxon": "^3.7.2"
  "@types/node": "^26.1.1"
  "@types/react": "^19.2.17"
  "tsx": "^4.23.1"
  "@trpc/server": "^11.18.0"
  "react": "^19.2.8"
  "react-doctor": "^0.9.3"
  "superjson": "^2.2.6"
  "zod": "^4.4.3"
  "lucide-react": "^1.27.0"
  "react-dom": "^19.2.8"
  "recharts": "^3.10.1"
  "sonner": "^2.0.7"

# pnpm 11+ build script allowlist (native / postinstall tooling).
allowBuilds:
  "@nestjs/core": true
  "@prisma/engines": true
  "@sentry/cli": true
  # Declined deliberately: the postinstall only resolves a native binding that
  # the platform-specific optional dependency already provides — the api boots
  # under @swc-node/register with the script skipped (verified).
  "@swc/core": false
  esbuild: true
  msgpackr-extract: true
  msw: true
  playwright: true
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - "@nestjs/core"
  - playwright
  - esbuild
  - msgpackr-extract
  - sharp
  - "@sentry/cli"
  - msw
  - unrs-resolver

# Track latest deliberately during MVP; re-enable (e.g. 1440) once prod is live.
minimumReleaseAge: 0

# Upstream peer ranges lag majors we already run under (lint + typecov green).
# Drop these when eslint-plugin-react/jsx-a11y publish ESLint 10 peers and
# type-coverage publishes a TS 6 peer range.
packageExtensions:
  eslint-plugin-react:
    peerDependencies:
      eslint: ">=3 <11"
  eslint-plugin-jsx-a11y:
    peerDependencies:
      eslint: ">=3 <11"
  type-coverage-core:
    peerDependencies:
      typescript: "2 || 3 || 4 || 5 || 6"

peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"
    "eslint-plugin-jsx-a11y>eslint": "10"
    "type-coverage-core>typescript": "6"

overrides:
  # Upper bounds are load-bearing on EVERY entry here: an open-ended floor let
  # `pnpm update` carry vite across a major silently, which is a decision, not a
  # currency bump. Below 1.0 the minor is the breaking axis, hence `<0.10`.
  "@xmldom/xmldom": ">=0.8.13 <0.10"
  protobufjs: ">=8.0.2 <9"
  vite: ">=8.1.5 <9"
  fast-uri: ">=3.1.2 <4"
  # dependabot 2026-07-24: find-my-way via @prisma/dev, sharp via next,
  # postcss (2 alerts) via the css toolchain — all transitive, hence overrides.
  find-my-way: ">=9.7.0 <10"
  sharp: ">=0.35.0 <1"
  postcss: ">=8.5.23 <9"
  # dependabot 2026-07-27: GHSA-5qjj-4xww-7phc. @prisma/dev pins valibot to an
  # exact 1.2.0, so only an override reaches the fix; bounded below major 2
  # because compatibility was argued from semver, not tested across a major.
  valibot: ">=1.4.2 <2"

patchedDependencies:
  "@node-saml/node-saml@5.1.0": patches/@node-saml__node-saml@5.1.0.patch
  "samlify@2.13.1": patches/samlify@2.13.1.patch
  "xml-crypto@6.1.2": patches/xml-crypto@6.1.2.patch
