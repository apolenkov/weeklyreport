# Optional error-tracking sidecar (Sentry-compatible via Bugsink).
# Bring up through the root overlay command. It reuses the current local
# dependencies and owns only the observability sidecar below:
#   pnpm observability:up
#
# Bugsink UI: http://127.0.0.1:8000 (bound to loopback by default; no default
# credentials). BUGSINK_PORT changes the host port but remains loopback-only.
# After first start, create an admin user interactively:
#   docker exec <bugsink-container> bugsink-manage createsuperuser
# Then create a project and copy the DSN to SENTRY_DSN in .env

services:
  bugsink:
    image: bugsink/bugsink:2.6.1@sha256:c5e3657451f4ba1ddb145a5118a4347314206cc5ba98f40e5f268c6c0975963e
    ports:
      - "127.0.0.1:${BUGSINK_PORT:-8000}:8000"
    volumes:
      - bugsinkdata:/data
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:?BUGSINK_SECRET_KEY must be set}
      BASE_URL: http://localhost:${BUGSINK_PORT:-8000}
      SINGLE_USER: "true"
      # The pinned image supports CREATE_SUPERUSER=email:password, but Compose
      # deliberately does not persist bootstrap credentials. Use the command above.
    restart: unless-stopped

volumes:
  bugsinkdata:
