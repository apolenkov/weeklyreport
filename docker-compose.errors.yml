# Optional error-tracking sidecar (Sentry-compatible via Bugsink).
# Bring up alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.observability.yml -f docker-compose.errors.yml up -d
# Or via: pnpm observability:up (root package.json script)
#
# Bugsink UI: http://localhost:8000 (no default credentials).
# After first start, create an admin user interactively:
#   docker exec <bugsink-container> bugsink-manage createsuperuser
# Then create a project and copy the DSN to SENTRY_DSN in .env

services:
  bugsink:
    image: bugsink/bugsink:latest@sha256:bc3a491edb7d94d42ae49be14f586a4b7eefa929389272c37f9bec112f232e78
    ports:
      - "${BUGSINK_PORT:-8000}:8000"
    volumes:
      - bugsinkdata:/app/data
    environment:
      SECRET_KEY: ${BUGSINK_SECRET_KEY:-localdev-insecure-key-for-local-dev-only-change-in-prod-2025}
      BASE_URL: http://localhost:${BUGSINK_PORT:-8000}
      BUGSINK_SINGLE_USER_MODE: "true"
      # The pinned image supports CREATE_SUPERUSER=email:password, but Compose
      # deliberately does not persist bootstrap credentials. Use the command above.
    restart: unless-stopped

volumes:
  bugsinkdata:
