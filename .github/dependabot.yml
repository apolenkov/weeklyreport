version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # One grouped PR instead of a dozen pairwise-conflicting lockfile PRs;
    # majors stay separate so breaking bumps get their own review. The OTel
    # experimental packages are version-locked and must move together.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"

  # Without this the base images are bumped by nothing: Dockerfile.web sat on
  # Node 25 for eight weeks after its end of life. Grouped so both images move
  # together — check-runtime-node-sync fails a push that bumps only one.
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
