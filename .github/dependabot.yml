version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # One grouped PR instead of a dozen pairwise-conflicting lockfile PRs;
    # majors stay separate so breaking bumps get their own review. The OTel
    # experimental packages are version-locked and must move together.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
