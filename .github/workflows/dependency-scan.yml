name: Dependency Vulnerability Scan

# The schedule is the only automatic trigger: CI remains dispatch-only while
# its pull-request and push expansion is pending under
# openspec/specs/ci-merge-gate. This workflow runs independently of that gap
# and needs no runner-provisioning decision tied to the merge gate.
#
# The scan runs every Monday at 06:00 UTC. Manual dispatch exists only for
# verification without waiting for the weekly schedule. pnpm audit exits
# nonzero when it finds vulnerabilities, so job failure already makes findings
# visible in the Actions run summary and logs without a separate annotation.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod
