name: CI

# GitHub Enterprise has no runners assigned to this repository right now
# (actions/runners total=0 on 2026-05-15). Automatic PR/push triggers
# leave checks queued forever, so CI stays manual until a runner is
# provisioned. Local pre-push gates remain the active quality gate.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "25"
  PNPM_VERSION: "10.11.0"

jobs:
  # ------------------------------------------------------------------
  # Job 0: Markdown Lint
  # ------------------------------------------------------------------
  lint-md:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install

      - name: Lint Markdown
        run: pnpm lint:md

  # ------------------------------------------------------------------
  # Job 1: Lint + Typecheck + Unit Tests
  # ------------------------------------------------------------------
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm turbo lint

      - name: Prisma script typecheck
        run: pnpm lint:prisma:typecheck

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Unit Tests with coverage
        run: pnpm turbo test -- --coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/web/coverage/
            apps/api/coverage/
          retention-days: 14

      # 34-03: mutation-audit gate. Catches new tRPC mutations that ship
      # without a consumer query (the reopen-request black-hole pattern).
      # Allowlist at apps/web/uat-suite/mutation-audit.allowlist.json carves
      # out intentional cron-only handlers.
      - name: Mutation Consumer Audit
        run: pnpm uat:audit

      - name: Upload mutation audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-audit
          path: apps/web/uat-suite/mutation-audit.md
          retention-days: 14

  # ------------------------------------------------------------------
  # Job 2: E2E Tests with Playwright
  # ------------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ci-test-secret-at-least-32-characters-long!!
      FRONTEND_URL: http://localhost:3100
      PDF_BASE_URL: http://localhost:3100
      PORT: 3101
      NEXT_PUBLIC_API_URL: http://localhost:3101
      LOG_LEVEL: warn
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: pnpm exec tsx prisma/seed.ts

      - name: Integration Tests
        run: pnpm --filter=@customreport/api test:integration

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared packages
        run: pnpm turbo build --filter=@customreport/shared --filter=@customreport/ui

      - name: Run E2E tests
        run: pnpm exec playwright test --config=apps/web/playwright.config.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # 34-07: per-spec flaky-rate metric (passed-on-retry / total).
      # Doesn't fail the build — just surfaces the trend.
      - name: Compute flaky-rate metric
        if: ${{ !cancelled() }}
        run: node scripts/flaky-rate.mjs

      - name: Upload flaky-rate metric
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flaky-rate
          path: |
            apps/web/e2e/.results/flaky-rate.md
            apps/web/e2e/.results/flaky-rate.json
          retention-days: 30

  # ------------------------------------------------------------------
  # Job 2b: Prisma migrate-reset gate (34-04)
  # ------------------------------------------------------------------
  # Catches schema-vs-migration drift that `migrate deploy` doesn't see:
  # `migrate reset --force --skip-seed` rebuilds from scratch and fails
  # if any migration's SQL is invalid against the current schema.prisma.
  # Documented Prisma 7 quirk: prisma.config.ts does NOT auto-seed despite
  # docs implying it does — `--skip-seed` makes that explicit.
  migrate-reset:
    name: Prisma migrate-reset gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_reset_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_reset_check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install

      - name: prisma migrate reset (fresh DB, no seed)
        run: pnpm exec prisma migrate reset --force --skip-seed

      - name: prisma generate (post-reset)
        run: pnpm exec prisma generate

  # ------------------------------------------------------------------
  # Job 2c: Visual regression baselines (Phase 39-06)
  # ------------------------------------------------------------------
  # Runs Playwright's `--project=visual` against the same Postgres + Redis
  # services as the main e2e job, but seeds with `seed-simple` for byte-
  # stable fixtures and stubs Anthropic via AI_VISUAL_STUB=true. Compares
  # rendered pages against committed baselines under
  # apps/web/e2e/visual/*-snapshots/<name>-visual-linux.png.
  #
  # First run on a brand-new spec: PRs missing the linux baseline must
  # locally regenerate via `visual:update`, OR a maintainer triggers a
  # one-shot --update-snapshots commit. We don't auto-update in CI to keep
  # the diff visible in PR review.
  visual-baseline:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: e2e

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_visual
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_visual
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ci-test-secret-at-least-32-characters-long!!
      FRONTEND_URL: http://localhost:3100
      PDF_BASE_URL: http://localhost:3100
      PORT: 3101
      NEXT_PUBLIC_API_URL: http://localhost:3101
      LOG_LEVEL: warn
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database (deterministic fixture)
        run: pnpm db:seed:simple

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared packages
        run: pnpm turbo build --filter=@customreport/shared --filter=@customreport/ui

      - name: Run visual regression tests
        run: pnpm --filter @customreport/web exec playwright test --project=visual

      - name: Upload visual diff artefacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/web/e2e/.results/
          retention-days: 14

  # ------------------------------------------------------------------
  # Job 3: Docker Build Verification
  # ------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose builds
        run: docker compose -f docker-compose.yml build --no-cache
