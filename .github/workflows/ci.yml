name: CI

# GitHub-hosted CI runs on pull requests, pushes to main, and manual dispatch.
# Main remains unprotected during the authorized pre-production MVP phase;
# required checks and branch protection are first-production prerequisites.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    # The complete quality gate currently takes more than 15 minutes on a
    # cold hosted runner. Keep enough headroom for cleanup after the unit suite.
    timeout-minutes: 30

    env:
      # Prisma resolves the datasource before generate, so this parseable URL
      # is required even though the quality job opens no database connection.
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      # Type-aware monorepo ESLint can exceed Node's default heap cap on hosted
      # runners; this stays within the runner's available memory.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Validate OpenSpec
        run: pnpm spec:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

  api-integration:
    name: API serial integration (disposable services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport -d customreport_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      mailpit:
        image: axllent/mailpit:latest@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -q --spider http://localhost:8025"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Keep the product URL distinct from the exact disposable E2E target;
      # the integration helper rejects accidental same-target configuration.
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      E2E_DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
      API_HOST: 127.0.0.1
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      REDIS_MAXMEMORY_BYTES: "209715200"
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
      REQUIRED_INTEGRATION_DEPS: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: integration@customreport.local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply migrations to exact disposable E2E database
        env:
          DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify Mailpit HTTP endpoint
        run: curl --fail --retry 30 --retry-delay 1 http://localhost:8025/api/v1/messages

      - name: API integration tests (serial files, required dependencies)
        run: pnpm --filter @customreport/api test:integration

  coverage:
    name: API & Web coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport -d customreport_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      mailpit:
        image: axllent/mailpit:latest@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -q --spider http://localhost:8025"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      E2E_DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
      API_HOST: 127.0.0.1
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      REDIS_MAXMEMORY_BYTES: "209715200"
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
      REQUIRED_INTEGRATION_DEPS: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: integration@customreport.local
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply migrations for serial API coverage
        env:
          DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify Mailpit HTTP endpoint
        run: curl --fail --retry 30 --retry-delay 1 http://localhost:8025/api/v1/messages

      - name: API and Web coverage thresholds
        run: pnpm test:coverage

  migrate-reset:
    name: Prisma migrate-reset gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: prisma migrate reset (exact disposable E2E DB)
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
        run: pnpm exec tsx prisma/operations/migrate-reset.ts

      - name: Seed canonical full profile after reset
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
        run: pnpm --dir apps/api exec tsx ../../prisma/seeds/profiles/seed-profile.ts full

      - name: prisma generate (post-reset)
        run: pnpm exec prisma generate

  # Production stages exercise standalone Next.js copies and the migrator
  # target that development images do not cover.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    env:
      # Compose requires all guarded values before it can render a build.
      DB_PASSWORD: ci-build-only
      POSTGRES_DB: customreport
      REDIS_DB: "0"
      FRONTEND_URL: http://localhost
      APP_BASE_URL: http://localhost
      NEXT_PUBLIC_API_URL: http://localhost
      API_URL: http://api:3001
      AUTH_JWT_SECRET: ci-build-only-secret-32-characters-min!!
      PDF_EXPORT_JWT_SECRET: ci-build-only-secret-32-characters-min!!
      PDF_BASE_URL: http://localhost
      HEAP_HEALTH_THRESHOLD_BYTES: "1610612736"
      SMTP_HOST: mail.invalid
      SMTP_PORT: "587"
      SMTP_FROM: ci@mail.invalid
      KEYCLOAK_SAML_CALLBACK_URL: http://localhost/auth/saml/callback
      KEYCLOAK_SAML_ENTRY_POINT: http://localhost/idp/saml
      KEYCLOAK_SAML_ISSUER: ci-build-only
      KEYCLOAK_SAML_CERT: ci-build-only
      CADDY_SITE_ADDRESS: http://localhost
      CADDY_ACME_EMAIL: ci-build-only@example.com
      CADDY_CSP_REPORT_URI: http://localhost/csp-report
      # Backup policy is required while rendering Compose.
      BACKUP_INTERVAL_SECONDS: "3600"
      BACKUP_RETENTION_DAYS: "14"
      # Operational policy has no silent defaults.
      PGBOUNCER_MAX_CLIENT_CONN: "100"
      PGBOUNCER_POOL_SIZE: "20"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      LOG_LEVEL: info
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_VERSION: ${{ github.sha }}
      OTEL_TRACES_SAMPLER_ARG: "0"
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      HTTPS_PORT_QUIC: "443"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production Docker Compose builds
        run: docker compose -f docker-compose.prod.yml build

      - name: Verify production image release identity
        run: |
          for service in backup migrate api web; do
            image_ref="customreport-${service}:${OTEL_SERVICE_VERSION}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
            test "$revision" = "$OTEL_SERVICE_VERSION"
          done
