name: CI

# GitHub-hosted CI runs on pull requests, pushes to main, and manual dispatch.
# Main changes are validated by the required repository checks and owner review.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    # Keep cleanup headroom around the complete lint, contract, type, and unit
    # gate on a cold hosted runner.
    timeout-minutes: 30

    env:
      # Prisma resolves the datasource before generate, so this parseable URL
      # is required even though the quality job opens no database connection.
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      # The web workspace validates its server-side API target while building;
      # no connection is required for the compile-time gate.
      API_URL: http://127.0.0.1:3002
      # Type-aware monorepo ESLint can exceed Node's default heap cap on hosted
      # runners; this stays within the runner's available memory.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Validate OpenSpec
        run: pnpm spec:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Publish unit test summary
        if: always()
        run: |
          {
            echo "## Unit tests"
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo ""
            echo "| Lane | Result |"
            echo "| --- | --- |"
            echo "| Quality unit, contract and repository gates | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  api-integration:
    name: API serial integration (disposable services)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport -d customreport_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
      mailpit:
        image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -q --spider http://localhost:8025"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Keep the product URL distinct from the exact disposable E2E target;
      # the integration helper rejects accidental same-target configuration.
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      E2E_DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
      API_HOST: 127.0.0.1
      NODE_ENV: test
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      REDIS_MAXMEMORY_BYTES: "209715200"
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
      REQUIRED_INTEGRATION_DEPS: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: integration@customreport.local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply migrations to exact disposable E2E database
        env:
          DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
        run: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify Mailpit HTTP endpoint
        run: curl --fail --retry 30 --retry-delay 1 http://localhost:8025/api/v1/messages

      - name: API unit, integration, and coverage (serial, required dependencies)
        env:
          VITEST_JSON_OUTPUT_FILE: ${{ runner.temp }}/api-verification-vitest.json
        run: pnpm --filter @customreport/api test:coverage

      - name: Publish API verification summary
        if: always()
        run: |
          json_file="$RUNNER_TEMP/api-verification-vitest.json"
          coverage_file="apps/api/coverage/coverage-summary.json"
          if [ ! -s "$json_file" ]; then
            echo "::error::API Vitest JSON artifact is missing or empty: $json_file"
            exit 1
          fi
          if ! jq -e '
            type == "object" and
            (.numTotalTests | type == "number" and floor == . and . >= 0) and
            (.numPassedTests | type == "number" and floor == . and . >= 0) and
            (.numFailedTests | type == "number" and floor == . and . >= 0)
          ' "$json_file" >/dev/null; then
            echo "::error::API Vitest JSON artifact is invalid or missing test counts: $json_file"
            exit 1
          fi
          if [ ! -s "$coverage_file" ]; then
            echo "::error::API coverage summary is missing or empty: $coverage_file"
            exit 1
          fi
          if ! jq -e '
            .total as $total |
            [
              $total.statements.pct,
              $total.branches.pct,
              $total.functions.pct,
              $total.lines.pct
            ] | all(type == "number")
          ' "$coverage_file" >/dev/null; then
            echo "::error::API coverage summary is invalid: $coverage_file"
            exit 1
          fi
          total="$(jq -er '.numTotalTests' "$json_file")"
          passed="$(jq -er '.numPassedTests' "$json_file")"
          failed="$(jq -er '.numFailedTests' "$json_file")"
          {
            echo "## API verification"
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo ""
            echo "| Lane | Tests | Passed | Failed | Statements | Branches | Functions | Lines | Result |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- |"
            jq -r \
              --arg total "$total" \
              --arg passed "$passed" \
              --arg failed "$failed" \
              --arg result "${{ job.status }}" \
              '"| API unit + serial integration coverage | \($total) | \($passed) | \($failed) | \(.total.statements.pct)% | \(.total.branches.pct)% | \(.total.functions.pct)% | \(.total.lines.pct)% | \($result) |"' \
              "$coverage_file"
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Web coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      API_URL: http://127.0.0.1:3002
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Web coverage thresholds
        env:
          VITEST_JSON_OUTPUT_FILE: ${{ runner.temp }}/web-coverage-vitest.json
        run: pnpm --filter @customreport/web test:coverage

      - name: Publish coverage summary
        if: always()
        run: |
          validate_coverage_artifacts() {
            summary="$1"
            results="$2"
            label="$3"
            if [ ! -s "$summary" ]; then
              echo "::error::$label coverage summary is missing or empty: $summary" >&2
              exit 1
            fi
            if ! jq -e '
              .total as $total |
              [
                $total.statements.pct,
                $total.branches.pct,
                $total.functions.pct,
                $total.lines.pct
              ] | all(type == "number")
            ' "$summary" >/dev/null; then
              echo "::error::$label coverage summary is invalid: $summary" >&2
              exit 1
            fi
            if [ ! -s "$results" ]; then
              echo "::error::$label Vitest JSON artifact is missing or empty: $results" >&2
              exit 1
            fi
            if ! jq -e '
              type == "object" and
              (.numTotalTests | type == "number" and floor == . and . >= 0) and
              (.numPassedTests | type == "number" and floor == . and . >= 0) and
              (.numFailedTests | type == "number" and floor == . and . >= 0)
            ' "$results" >/dev/null; then
              echo "::error::$label Vitest JSON artifact is invalid: $results" >&2
              exit 1
            fi
          }
          coverage_row() {
            summary="$1"
            results="$2"
            label="$3"
            total="$(jq -er '.numTotalTests' "$results")"
            passed="$(jq -er '.numPassedTests' "$results")"
            failed="$(jq -er '.numFailedTests' "$results")"
            jq -r \
              --arg label "$label" \
              --arg total "$total" \
              --arg passed "$passed" \
              --arg failed "$failed" \
              '"| \($label) | \($total) | \($passed) | \($failed) | \(.total.statements.pct)% | \(.total.branches.pct)% | \(.total.functions.pct)% | \(.total.lines.pct)% |"' \
              "$summary"
          }
          web_summary="apps/web/coverage/coverage-summary.json"
          web_results="$RUNNER_TEMP/web-coverage-vitest.json"
          validate_coverage_artifacts "$web_summary" "$web_results" "Web"
          {
            echo "## Web coverage"
            echo "**Commit:** \`$GITHUB_SHA\`"
            echo ""
            echo "| Suite | Tests | Passed | Failed | Statements | Branches | Functions | Lines |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            coverage_row "$web_summary" "$web_results" "Web unit coverage"
          } >> "$GITHUB_STEP_SUMMARY"

  migrate-reset:
    name: Prisma migrate-reset gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: prisma migrate reset (exact disposable E2E DB)
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
        run: pnpm exec tsx prisma/operations/migrate-reset.ts

      - name: Seed canonical full profile after reset
        env:
          PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
        run: pnpm --dir apps/api exec tsx ../../prisma/seeds/profiles/seed-profile.ts full

  # Production stages exercise standalone Next.js copies and the migrator
  # target that development images do not cover.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    env:
      # Compose requires all guarded values before it can render a build.
      DB_PASSWORD: ci-build-only
      POSTGRES_DB: customreport
      DB_POOL_MAX: "10"
      DB_POOL_IDLE_TIMEOUT_MS: "10000"
      DB_POOL_CONNECTION_TIMEOUT_MS: "0"
      REDIS_DB: "0"
      FRONTEND_URL: http://localhost
      APP_BASE_URL: http://localhost
      API_URL: http://api:3001
      NEXT_PUBLIC_CLIENT_LOG_FORWARDING: "false"
      NEXT_PUBLIC_WEB_VITALS: "false"
      CLIENT_LOG_FORWARDING: "false"
      AUTH_JWT_SECRET: ci-build-only-secret-32-characters-min!!
      PDF_EXPORT_JWT_SECRET: ci-build-only-secret-32-characters-min!!
      PDF_BASE_URL: http://localhost
      AI_PROVIDER_CONFIG_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_PROVIDER_CONFIG_KEY_VERSION: "1"
      AI_PROVIDER_ALLOWED_ORIGINS: https://api.example.com
      REPORT_ASSISTANT_OUTBOUND_DATA_APPROVED: "false"
      REPORT_ASSISTANT_INPUT_VERSION: "1"
      REPORT_ASSISTANT_SIMILARITY_THRESHOLD: "0.55"
      REPORT_ASSISTANT_CANDIDATE_LIMIT: "500"
      REPORT_ASSISTANT_READ_THROUGH_LIMIT: "16"
      REPORT_ASSISTANT_EXHAUSTIVE_LIMIT: "200"
      REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET: "8000"
      REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS: "30000"
      REPORT_ASSISTANT_PLANNER_MAX_TOKENS: "1500"
      REPORT_ASSISTANT_ANSWER_MAX_TOKENS: "2000"
      REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE: "32"
      REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET: "8000"
      HEAP_HEALTH_THRESHOLD_BYTES: "1610612736"
      SMTP_HOST: mail.invalid
      SMTP_PORT: "587"
      SMTP_FROM: ci@mail.invalid
      KEYCLOAK_SAML_CALLBACK_URL: http://localhost/auth/saml/callback
      KEYCLOAK_SAML_ENTRY_POINT: http://localhost/idp/saml
      KEYCLOAK_SAML_ISSUER: ci-build-only
      KEYCLOAK_SAML_CERT: ci-build-only
      CADDY_SITE_ADDRESS: http://localhost
      CADDY_ACME_EMAIL: ci-build-only@example.com
      CADDY_CSP_REPORT_URI: http://localhost/csp-report
      # Backup policy is required while rendering Compose.
      BACKUP_INTERVAL_SECONDS: "3600"
      BACKUP_RETENTION_DAYS: "14"
      # Operational policy has no silent defaults.
      PGBOUNCER_MAX_CLIENT_CONN: "100"
      PGBOUNCER_POOL_SIZE: "20"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      LOG_LEVEL: info
      OTEL_SDK_DISABLED: "true"
      OTEL_SERVICE_VERSION: ${{ github.sha }}
      OTEL_TRACES_SAMPLER_ARG: "0"
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      HTTPS_PORT_QUIC: "443"
      GRAFANA_ADMIN_PASSWORD: runtime-smoke-password
      BUGSINK_SECRET_KEY: runtime-smoke-secret-with-sufficient-ci-entropy-only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production Docker Compose builds
        run: docker compose -f docker-compose.prod.yml build

      - name: Verify production image release identity
        run: |
          for service in backup migrate api web; do
            image_ref="customreport-${service}:${OTEL_SERVICE_VERSION}"
            revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image_ref")"
            test "$revision" = "$OTEL_SERVICE_VERSION"
          done

      # The optional observability image is deliberately large. Keep this
      # exact-image compatibility proof on explicit release verification
      # instead of charging every push.
      - name: Verify PostgreSQL, pgvector, PgBouncer, Redis, and Caddy
        if: github.event_name == 'workflow_dispatch'
        env:
          POSTGRES_DB: customreport_e2e
        run: |
          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            up --detach --wait postgres pgbouncer redis

          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            exec -T postgres \
            psql -U customreport -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'
          vector_version="$(
            docker compose --project-name runtime-production \
              -f docker-compose.prod.yml \
              exec -T postgres \
              psql -U customreport -d "$POSTGRES_DB" -tAc \
              "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
          )"
          test "$vector_version" = "0.8.6"

          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            exec -T pgbouncer sh -ec \
            'PGPASSWORD="$DB_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$DB_USER" -d "$DB_NAME" -w -tAc "SELECT 1"' \
            | grep -qx '1'

          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            exec -T redis redis-cli --raw CONFIG GET appendonly \
            | tail -n 1 | grep -qx 'yes'
          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            exec -T redis redis-cli --raw CONFIG GET maxmemory-policy \
            | tail -n 1 | grep -qx 'noeviction'

          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            run --rm --no-deps caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Clean production runtime smoke
        if: github.event_name == 'workflow_dispatch' && always()
        env:
          POSTGRES_DB: customreport_e2e
        run: |
          docker compose --project-name runtime-production \
            -f docker-compose.prod.yml \
            down --remove-orphans

      - name: Verify mail, telemetry, metrics, and error overlays
        if: github.event_name == 'workflow_dispatch'
        env:
          # The local base stack deliberately owns these fixed disposable
          # credentials; keep exporter interpolation aligned with that stack.
          DB_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        run: |
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            up --detach --wait postgres redis mailpit
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            up --detach otel-lgtm bugsink

          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8025/api/v1/messages >/dev/null
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:3003/api/health >/dev/null
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:9090/-/ready >/dev/null
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:3100/ready >/dev/null
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            --header 'Content-Type: application/json' \
            --data '{"resourceSpans":[]}' \
            http://127.0.0.1:4318/v1/traces >/dev/null
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/ >/dev/null

          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            exec -T otel-lgtm \
            curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3200/ready >/dev/null
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            exec -T otel-lgtm \
            curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:13133/ready >/dev/null
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            exec -T otel-lgtm \
            curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://postgres-exporter:9187/metrics >/dev/null
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            exec -T otel-lgtm \
            curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://redis-exporter:9121/metrics >/dev/null

          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            exec -T bugsink sh -ec \
            'test -s /data/db.sqlite3 && printf runtime-smoke > /data/runtime-smoke-sentinel'
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            stop bugsink
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            rm --force bugsink
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            up --detach bugsink
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/ >/dev/null
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            exec -T bugsink sh -ec \
            'test -s /data/db.sqlite3 && test "$(cat /data/runtime-smoke-sentinel)" = runtime-smoke'

      - name: Clean observability runtime smoke
        if: github.event_name == 'workflow_dispatch' && always()
        env:
          DB_PASSWORD: localdev
          POSTGRES_DB: customreport_e2e
        run: |
          docker compose --project-name runtime-observability \
            -f docker-compose.yml \
            -f docker-compose.observability.yml \
            -f docker-compose.errors.yml \
            down --remove-orphans
