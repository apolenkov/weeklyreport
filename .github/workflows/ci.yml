name: CI

# GitHub-hosted CI runs on pull requests, pushes to main, and manual dispatch.
# Main remains unprotected during the authorized pre-production MVP phase;
# required checks and branch protection are first-production prerequisites.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    # The complete quality gate currently takes more than 15 minutes on a
    # cold hosted runner. Keep enough headroom for cleanup after the unit suite.
    timeout-minutes: 30

    env:
      # Prisma resolves the datasource before generate, so this parseable URL
      # is required even though the quality job opens no database connection.
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_generate_only
      # Type-aware monorepo ESLint can exceed Node's default heap cap on hosted
      # runners; this stays within the runner's available memory.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The exemplary-floor ratchet compares against the first parent.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # The lint gate reports every static failure in one run.
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm turbo typecheck

      # This matches pre-push and includes the root Prisma-script suite that a
      # bare `turbo test` omits.
      - name: Unit Tests
        run: pnpm test

      # Rejects tRPC mutations without a consumer query, except the reviewed
      # cron-only allowlist.
      - name: Mutation Consumer Audit
        run: pnpm uat:audit

      # Rejects missing or stale App Router scenarios in the role catalogs.
      - name: Catalog Drift Gate
        run: pnpm catalog:check

      - name: Upload mutation audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-audit
          path: apps/web/uat-suite/mutation-audit.md
          retention-days: 14

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    # Playwright owns all Web/API URLs. Job-level URL values would leak into
    # login fixtures and bypass its isolated port contract.
    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_MAXMEMORY_BYTES: 209715200
      NODE_ENV: test
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ci-test-secret-at-least-32-characters-long!!
      LOG_LEVEL: warn
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed database
        run: pnpm exec tsx prisma/seed.ts

      - name: Integration Tests
        run: pnpm --filter=@customreport/api test:integration

      # Playwright belongs to apps/web under pnpm's isolated node linker.
      - name: Install Playwright browsers
        run: pnpm --filter @customreport/web exec playwright install --with-deps chromium

      - name: Build shared packages
        run: pnpm turbo build --filter=@customreport/shared --filter=@customreport/ui

      # Global setup destructively resets only its dedicated E2E database.
      - name: Create E2E database
        run: PGPASSWORD=localdev psql -h localhost -U customreport -d postgres -c "CREATE DATABASE customreport_e2e"

      - name: Run E2E tests
        env:
          E2E_DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_e2e
        run: pnpm test:e2e:integration

      # The GitHub reporter writes traces, screenshots, and videos here.
      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: e2e/integration/.results/
          retention-days: 14

  # A clean rebuild catches schema/migration drift that deploy cannot detect.
  # Prisma 7 reset does not seed and no longer accepts `--skip-seed`.
  migrate-reset:
    name: Prisma migrate-reset gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: customreport
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: customreport_reset_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U customreport"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://customreport:localdev@localhost:5432/customreport_reset_check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: prisma migrate reset (fresh DB, no seed)
        run: pnpm exec prisma migrate reset --force

      - name: prisma generate (post-reset)
        run: pnpm exec prisma generate

  # Production stages exercise standalone Next.js copies and the migrator
  # target that development images do not cover.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    env:
      # Compose requires all guarded values before it can render a build.
      DB_PASSWORD: ci-build-only
      FRONTEND_URL: http://localhost
      APP_BASE_URL: http://localhost
      NEXT_PUBLIC_API_URL: http://localhost
      API_URL: http://api:3001
      AUTH_JWT_SECRET: ci-build-only-secret-32-characters-min!!
      PDF_EXPORT_JWT_SECRET: ci-build-only-secret-32-characters-min!!
      PDF_BASE_URL: http://localhost
      HEAP_HEALTH_THRESHOLD_BYTES: "1610612736"
      SMTP_HOST: mail.invalid
      SMTP_PORT: "587"
      SMTP_FROM: ci@mail.invalid
      KEYCLOAK_SAML_CALLBACK_URL: http://localhost/auth/saml/callback
      KEYCLOAK_SAML_ENTRY_POINT: http://localhost/idp/saml
      KEYCLOAK_SAML_ISSUER: ci-build-only
      KEYCLOAK_SAML_CERT: ci-build-only
      CADDY_SITE_ADDRESS: http://localhost
      CADDY_CSP_REPORT_URI: http://localhost/csp-report
      # Backup policy is required while rendering Compose.
      BACKUP_INTERVAL_SECONDS: "3600"
      BACKUP_RETENTION_DAYS: "14"
      # Operational policy has no silent defaults.
      PGBOUNCER_MAX_CLIENT_CONN: "100"
      PGBOUNCER_POOL_SIZE: "20"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      LOG_LEVEL: info
      OTEL_SDK_DISABLED: "true"
      OTEL_TRACES_SAMPLER_ARG: "0"
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      HTTPS_PORT_QUIC: "443"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production Docker Compose builds
        run: docker compose -f docker-compose.prod.yml build
