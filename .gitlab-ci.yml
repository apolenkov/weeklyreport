workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

# Owner decision 2026-09-28: GitLab CI carries only lint/test lanes — no
# Docker-in-Docker, no image builds, no operational smoke. Production builds,
# PDF, and browser acceptance stay outside CI as separate required evidence.
# The disposable-database guard accepts only exact loopback targets, while
# GitLab services are reachable through DNS aliases, never through the job's
# loopback. PostgreSQL therefore runs inside each database job container on
# 127.0.0.1 — a real in-job process, not a masked service. Redis and Mailpit
# have no loopback requirement and run as ordinary service aliases.
stages:
  - toolchain
  - quality
  - dependency-scan
  - coverage
  - api-integration
  - migrate-reset

variables:
  GIT_DEPTH: "2"
  # The pinned pgvector job image has no Node and no curl/wget, so the Node
  # toolchain enters database jobs as a checksum-verified artifact instead of
  # a network fetch. The composite artifact also carries libatomic.so.1 from
  # the same bookworm image — the slim database image lacks it and Node 26
  # links it.
  NODE_TOOLCHAIN_TARBALL: node-v26.8.1-linux-x64.tar.gz
  NODE_TOOLCHAIN_SHA256: b2b76660fa4ded4e0b2a41ee3c0c651cd52ea8170ead91ebac1e147ac3d55643
  NODE_TOOLCHAIN_ARTIFACT: node-toolchain-linux-x64.tar.gz

.node-image:
  image: node:26.8.1-bookworm@sha256:9f94d34c787165dca03b74e5bf9c3bf90e8de79b19aa3d87fe1fa1694bf75c89
  # Without this, jobs fetch artifacts from every earlier stage — the
  # node-toolchain tarball would land in the workspace as untracked residue
  # and trip the cleanliness gate. Database jobs use explicit `needs`.
  dependencies: []
  timeout: 30m
  resource_group: weeklyreport-ci-heavy
  allow_failure: false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-reports/
  after_script:
    - |
      mkdir -p ci-reports
      printf '# CI job summary\n\nJob: %s\nCommit: %s\nResult: %s\n' \
        "$CI_JOB_NAME" "$CI_COMMIT_SHA" "$CI_JOB_STATUS" \
        > "ci-reports/$CI_JOB_ID-summary.md"

.workspace-node:
  extends: .node-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  before_script:
    # Node 26 no longer bundles Corepack; install only the pinned pnpm CLI here.
    - npm install --global pnpm@11.24.0
    - test "$(pnpm --version)" = "11.24.0"
    - pnpm install --frozen-lockfile
    - pnpm exec prisma generate

# Database jobs run on a pinned PostgreSQL+pgvector image. PostgreSQL starts inside the job container bound to 127.0.0.1,
# so the exact-loopback destructive guard sees a truthful target. The Node
# toolchain arrives as the verified node-toolchain artifact.
.postgres-job:
  image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
  timeout: 30m
  resource_group: weeklyreport-ci-heavy
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-reports/
  before_script:
    - tar -xzf "$NODE_TOOLCHAIN_ARTIFACT" -C /
    - ldconfig
    - test "$(node --version)" = "v26.8.1"
    - npm install --global pnpm@11.24.0
    - test "$(pnpm --version)" = "11.24.0"
    - pnpm install --frozen-lockfile
    - pnpm exec prisma generate
    # The postgres daemon must run as the postgres user; initdb refuses root.
    # The data directory lives in /tmp so the read-only image data volume is
    # irrelevant, and trust auth matches the throwaway per-job cluster.
    - install -d -o postgres -g postgres /tmp/pgdata
    - su postgres -s /bin/sh -c '/usr/lib/postgresql/15/bin/initdb -D /tmp/pgdata -A trust -E UTF8'
    - su postgres -s /bin/sh -c '/usr/lib/postgresql/15/bin/pg_ctl -D /tmp/pgdata -l /tmp/postgres.log -o "-h 127.0.0.1" -w -t 60 start'
    # prisma migrate reset drops and recreates the database, which needs a
    # superuser role.
    - createuser -h 127.0.0.1 -U postgres -s customreport
    - createdb -h 127.0.0.1 -U postgres -O customreport customreport_e2e
  after_script:
    - |
      mkdir -p ci-reports
      printf '# CI job summary\n\nJob: %s\nCommit: %s\nResult: %s\n' \
        "$CI_JOB_NAME" "$CI_COMMIT_SHA" "$CI_JOB_STATUS" \
        > "ci-reports/$CI_JOB_ID-summary.md"

# The pgvector job image ships no curl/wget, so the toolchain is assembled in
# the bookworm job image once — official Node tarball verified against the
# pinned SHA-256, plus the libatomic.so.1 the slim image lacks — and handed to
# database jobs as one composite artifact under /usr/local.
node-toolchain:
  extends: .node-image
  stage: toolchain
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - node-toolchain-linux-x64.tar.gz
  script:
    - curl -fsSLO "https://nodejs.org/dist/v26.8.1/$NODE_TOOLCHAIN_TARBALL"
    - echo "$NODE_TOOLCHAIN_SHA256  $NODE_TOOLCHAIN_TARBALL" | sha256sum -c -
    - mkdir -p toolchain-root/usr/local/lib
    - tar -xzf "$NODE_TOOLCHAIN_TARBALL" -C toolchain-root/usr/local --strip-components=1
    - cp /usr/lib/x86_64-linux-gnu/libatomic.so.1 toolchain-root/usr/local/lib/
    - tar -czf "$NODE_TOOLCHAIN_ARTIFACT" -C toolchain-root usr

quality:
  extends: .workspace-node
  stage: quality
  variables:
    DATABASE_URL: postgresql://customreport:localdev@127.0.0.1:5432/customreport_generate_only
    API_URL: http://127.0.0.1:3002
    NODE_OPTIONS: --max-old-space-size=8192
    DOCKER_COMPOSE_VERSION: "5.5.1"
    DOCKER_COMPOSE_SHA256: db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
  before_script:
    - !reference [.workspace-node, before_script]
    # The root test suite's production Compose contract gate requires a
    # resolvable compose binary (config rendering only — no daemon needed).
    # The node image has none, so install the pinned standalone CLI.
    - curl -fsSL "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" -o /usr/local/bin/docker-compose
    - echo "$DOCKER_COMPOSE_SHA256  /usr/local/bin/docker-compose" | sha256sum -c -
    - chmod +x /usr/local/bin/docker-compose
    - docker-compose version
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm spec:check
    - pnpm typecheck
    - pnpm test

dependency-scan:
  extends: .node-image
  stage: dependency-scan
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - pnpm-lock.yaml
        - package.json
        - "**/package.json"
        - pnpm-workspace.yaml
    - when: never
  before_script:
    - npm install --global pnpm@11.24.0
    - test "$(pnpm --version)" = "11.24.0"
    - pnpm install --frozen-lockfile
  script:
    - pnpm audit --prod
    # Dev tooling runs on developer machines and CI but ships nowhere, so its
    # findings are reported without failing the lane.
    - pnpm audit --dev --audit-level high || echo "WARNING - devDependencies have high or critical advisories (non-blocking)"

coverage:
  extends: .workspace-node
  stage: coverage
  needs:
    - job: quality
      artifacts: false
  variables:
    DATABASE_URL: postgresql://customreport:localdev@127.0.0.1:5432/customreport_generate_only
    API_URL: http://127.0.0.1:3002
    NODE_OPTIONS: --max-old-space-size=8192
  script:
    - mkdir -p ci-reports
    - VITEST_JSON_OUTPUT_FILE="$CI_PROJECT_DIR/ci-reports/web-coverage-vitest.json" pnpm --filter @customreport/web test:coverage
    - |
      node --input-type=module <<'NODE'
      import { readFileSync, writeFileSync } from "node:fs";

      const results = JSON.parse(
        readFileSync("ci-reports/web-coverage-vitest.json", "utf8"),
      );
      const summary = JSON.parse(
        readFileSync("apps/web/coverage/coverage-summary.json", "utf8"),
      );
      const counts = [
        results.numTotalTests,
        results.numPassedTests,
        results.numFailedTests,
      ];
      const percentages = [
        summary.total?.statements?.pct,
        summary.total?.branches?.pct,
        summary.total?.functions?.pct,
        summary.total?.lines?.pct,
      ];
      if (
        !counts.every(
          (value) => Number.isInteger(value) && value >= 0,
        ) ||
        !percentages.every((value) => typeof value === "number")
      ) {
        throw new Error("Web coverage evidence is invalid or incomplete.");
      }

      const row =
        "| Web unit coverage | " +
        counts.join(" | ") +
        " | " +
        percentages.map((value) => value + "%").join(" | ") +
        " |";
      const report = [
        "# Web coverage",
        "",
        "Commit: " + process.env.CI_COMMIT_SHA,
        "",
        "| Suite | Tests | Passed | Failed | Statements | Branches | Functions | Lines |",
        "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
        row,
        "",
      ].join("\n");
      writeFileSync("ci-reports/web-coverage-summary.md", report);
      process.stdout.write(report);
      NODE

api-integration:
  extends: .postgres-job
  stage: api-integration
  # The serial API coverage contour is the heaviest lane; 30m killed it at
  # SIGTERM on the first real run.
  timeout: 90m
  needs:
    - job: quality
      artifacts: false
    - job: node-toolchain
      artifacts: true
  # Redis and Mailpit are ordinary service aliases — the guard constrains only
  # the PostgreSQL target. The test suite reads their real hostnames from env.
  services:
    - name: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
      alias: redis
    - name: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
      alias: mailpit
  variables:
    # MVP single-database policy: one disposable loopback target per job, and
    # both URLs must resolve to the same target before cleanup runs.
    DATABASE_URL: postgresql://customreport:localdev@127.0.0.1:5432/customreport_e2e
    E2E_DATABASE_URL: postgresql://customreport:localdev@127.0.0.1:5432/customreport_e2e
    API_HOST: 127.0.0.1
    NODE_ENV: test
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "15"
    REDIS_MAXMEMORY_BYTES: "209715200"
    PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
    REQUIRED_INTEGRATION_DEPS: "true"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_FROM: integration@customreport.local
    MAILPIT_API_URL: http://mailpit:8025
  script:
    # Fail fast on unreachable service aliases instead of hanging a test.
    - |
      node --input-type=module <<'NODE'
      import { connect } from "node:net";

      const probe = (host, port, label) =>
        new Promise((resolve, reject) => {
          const socket = connect({ host, port, timeout: 5000 });
          socket.once("connect", () => {
            socket.destroy();
            console.log(label + " reachable at " + host + ":" + port);
            resolve();
          });
          socket.once("timeout", () => {
            socket.destroy();
            reject(new Error(label + " connect timeout at " + host + ":" + port));
          });
          socket.once("error", reject);
        });

      await probe("redis", 6379, "redis");
      await probe("mailpit", 1025, "mailpit-smtp");
      await probe("mailpit", 8025, "mailpit-api");
      NODE
    - pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
    # Verbose reporter keeps per-test lines in the trace so a serial-suite
    # stall names its test; the JSON reporter still feeds the summary gate.
    - pnpm --filter @customreport/api test:coverage --reporter=verbose --reporter=json "--outputFile.json=$CI_PROJECT_DIR/ci-reports/api-verification-vitest.json"
    - |
      node --input-type=module <<'NODE'
      import { readFileSync, writeFileSync } from "node:fs";

      const results = JSON.parse(
        readFileSync("ci-reports/api-verification-vitest.json", "utf8"),
      );
      const summary = JSON.parse(
        readFileSync("apps/api/coverage/coverage-summary.json", "utf8"),
      );
      const counts = [
        results.numTotalTests,
        results.numPassedTests,
        results.numFailedTests,
      ];
      const percentages = [
        summary.total?.statements?.pct,
        summary.total?.branches?.pct,
        summary.total?.functions?.pct,
        summary.total?.lines?.pct,
      ];
      if (
        !counts.every(
          (value) => Number.isInteger(value) && value >= 0,
        ) ||
        !percentages.every((value) => typeof value === "number")
      ) {
        throw new Error("API coverage evidence is invalid or incomplete.");
      }

      const row =
        "| API unit + serial integration coverage | " +
        counts.join(" | ") +
        " | " +
        percentages.map((value) => value + "%").join(" | ") +
        " | " +
        "passed" +
        " |";
      const report = [
        "# API verification",
        "",
        "Commit: " + process.env.CI_COMMIT_SHA,
        "",
        "| Lane | Tests | Passed | Failed | Statements | Branches | Functions | Lines | Result |",
        "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- |",
        row,
        "",
      ].join("\n");
      writeFileSync("ci-reports/api-verification-summary.md", report);
      process.stdout.write(report);
      NODE
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-reports/
      - apps/api/coverage/coverage-summary.json

migrate-reset:
  extends: .postgres-job
  stage: migrate-reset
  needs:
    - job: api-integration
      artifacts: false
    - job: node-toolchain
      artifacts: true
  variables:
    DATABASE_URL: postgresql://customreport:localdev@127.0.0.1:5432/customreport_e2e
    NODE_ENV: test
  script:
    - PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION="давай" pnpm exec tsx prisma/operations/migrate-reset.ts
    - PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION="давай" pnpm --dir apps/api exec tsx ../../prisma/seeds/profiles/seed-profile.ts full
