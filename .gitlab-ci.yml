# Owner decision 2026-10-20: checks run locally; CI builds and deploys.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - image
  - deploy

default:
  tags:
    - img-build
  interruptible: true

# buildah, daemonless: no Docker-in-Docker and no Docker socket. The job pulls
# every external base image through the internal Docker Hub mirror, builds the
# four images from the repository Dockerfiles and pushes commit-SHA tags.
# The registry defaults to the project registry; IMAGE_REGISTRY* override it.
# Always manual: an operator starts it on the default branch, a tag or a merge
# request, and it never turns the pipeline red (owner decision 2026-10-27,
# TASK-727: keep CI minimal while the runners are unstable).
build-images:
  stage: image
  image:
    # buildah 1.43.5 is the version the new runner was probed with; pin it by
    # digest and keep the versioned mirror tag readable in the reference.
    # TODO(TASK-709): confirm this digest is the build the probe pulled; the
    # probe artifacts only record :latest@sha256:7ec323…, not this index.
    name: mirror.example.org/all-pub-docker/buildah/stable:v1.43.5@sha256:87f219f5a7bf5d7bee870253c14a57751e85833cb2cc645216a20bbb66c68724
    entrypoint: [""]
  timeout: 45m
  interruptible: false
  resource_group: weeklyreport-ci-heavy-$CI_PIPELINE_IID
  variables:
    # Buildah runs unprivileged: the job container's user namespace does not map
    # the /etc/subuid range, so a nested user namespace is unavailable; the vfs
    # image store and chroot isolation build without privileged mounts.
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    # Internal mirror of Docker Hub for every external base image. Dockerfiles
    # keep upstream references; the job rewrites their FROM lines at build time
    # (see mirror_dockerfile) instead of forking the Dockerfiles.
    BASE_REGISTRY: mirror.example.org/all-pub-docker
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: "$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
      allow_failure: true
    - when: never
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - image-digests.txt
  script:
    - |
      set -eu
      REGISTRY="${IMAGE_REGISTRY:-${CI_REGISTRY_IMAGE:-}}"
      REGISTRY_USER="${IMAGE_REGISTRY_USER:-${CI_REGISTRY_USER:-}}"
      REGISTRY_PASSWORD="${IMAGE_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-}}"
      : "${REGISTRY:?no image registry: set IMAGE_REGISTRY or enable the project container registry}"
      : "${REGISTRY_USER:?no registry user: set IMAGE_REGISTRY_USER}"
      : "${REGISTRY_PASSWORD:?no registry password: set IMAGE_REGISTRY_PASSWORD}"
      : "${WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING:?WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING is not set}"
      : "${WR_NEXT_PUBLIC_WEB_VITALS:?WR_NEXT_PUBLIC_WEB_VITALS is not set}"
      : "${WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED:?WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED is not set}"
      : "${WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES:?WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES is not set}"

      WORK_DIR="$(mktemp -d)"
      trap 'rm -rf "$WORK_DIR"' EXIT

      # mirror_dockerfile SOURCE TARGET
      # Point each Docker Hub FROM at the internal mirror, keeping the pinned
      # tag@sha256 reference: an official image gains its `library/` namespace
      # and a namespaced image keeps its namespace. A stage reference (`FROM
      # base`) has no tag and is left alone. An image from another registry is
      # deliberately not remapped into the Docker Hub mirror; the check below
      # fails the job instead.
      mirror_dockerfile() {
        source_file="$1"
        target_file="$2"
        sed -E \
          -e "s|^FROM ([a-z0-9][a-z0-9._-]*):|FROM $BASE_REGISTRY/library/\1:|" \
          -e "s|^FROM ([a-z0-9][a-z0-9._-]*/[^[:space:]:/]+:[^[:space:]]+)|FROM $BASE_REGISTRY/\1|" \
          "$source_file" > "$target_file"
        external="$(sed -nE 's|^FROM[[:space:]]+([^[:space:]]*:[^[:space:]]*).*|\1|p' "$target_file" | grep -Ev "^$BASE_REGISTRY/" || true)"
        if [ -n "$external" ]; then
          echo "base image is not mirrored: $external" >&2
          exit 1
        fi
      }

      mirror_dockerfile Dockerfile.api "$WORK_DIR/Dockerfile.api"
      mirror_dockerfile Dockerfile.web "$WORK_DIR/Dockerfile.web"
      mirror_dockerfile deploy/postgres/Dockerfile.backup "$WORK_DIR/Dockerfile.backup"

      # Credentials live only in a job-local auth file and are never echoed.
      # The file stays outside $CI_PROJECT_DIR: the build context is the project
      # directory, so the pruner stage's `COPY . .` would otherwise ship it.
      REGISTRY_HOST="${REGISTRY%%/*}"
      export REGISTRY_AUTH_FILE="$WORK_DIR/auth.json"
      printf '%s\n' "$REGISTRY_PASSWORD" | buildah login \
        --authfile "$REGISTRY_AUTH_FILE" --username "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"

      # The digest log is a job output, not a build input: creating it inside
      # the build context would make the pruner stage's `COPY . .` miss its
      # layer cache on every run. Keep it beside the credentials and publish it
      # after the last build.
      : > "$WORK_DIR/image-digests.txt"

      # build_push NAME CONTEXT DOCKERFILE [buildah bud options...]
      build_push() {
        name="$1"
        context="$2"
        dockerfile="$3"
        shift 3
        image="$REGISTRY/$name:$CI_COMMIT_SHA"
        # --format docker keeps the Docker v2 manifest: the OCI format drops
        # HEALTHCHECK. --layers caches the shared stages between the four builds.
        buildah bud --layers --format docker -f "$dockerfile" -t "$image" "$@" "$context"
        digest_file="$WORK_DIR/$name.digest"
        buildah push --digestfile "$digest_file" "$image" "docker://$image"
        digest="$(cat "$digest_file")"
        : "${digest:?no digest recorded for $name}"
        printf '%s=%s/%s@%s\n' "$name" "$REGISTRY" "$name" "$digest" >> "$WORK_DIR/image-digests.txt"
        # The vfs store copies whole layers; drop the published image and keep
        # the build cache the next target reuses.
        buildah rmi "$image"
      }

      build_push api . "$WORK_DIR/Dockerfile.api" --build-arg "BUILD_VERSION=$CI_COMMIT_SHA"
      build_push migrate . "$WORK_DIR/Dockerfile.api" --target migrator --build-arg "BUILD_VERSION=$CI_COMMIT_SHA"
      build_push web . "$WORK_DIR/Dockerfile.web" \
        --build-arg API_URL=http://api:3001 \
        --build-arg NEXT_PUBLIC_AUTH_STUB=false \
        --build-arg NEXT_PUBLIC_DEV_ROLE_SWITCHER=false \
        --build-arg "NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}" \
        --build-arg "NEXT_PUBLIC_APP_VERSION=$CI_COMMIT_SHA" \
        --build-arg "NEXT_PUBLIC_CLIENT_LOG_FORWARDING=$WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING" \
        --build-arg "NEXT_PUBLIC_WEB_VITALS=$WR_NEXT_PUBLIC_WEB_VITALS" \
        --build-arg "NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED=$WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED" \
        --build-arg "NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES=$WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES"
      build_push backup deploy/postgres "$WORK_DIR/Dockerfile.backup" --build-arg "BUILD_VERSION=$CI_COMMIT_SHA"
      cp "$WORK_DIR/image-digests.txt" image-digests.txt
      cat image-digests.txt

# Defined only when DevOps supplies a file-type KUBECONFIG variable. The values
# file (HELM_VALUES_FILE, file-type), HELM_NAMESPACE and HELM_KUBE_CONTEXT come
# from CI variables; no cluster credential lives in the repository. A missing
# release is installed (only when Helm itself reports release-not-found) and an
# existing deployed one is upgraded; a history error, a history with no
# readable revision and any other state stop the job before a mutation. Neither
# command rolls back: install rollback is an uninstall that would take the
# pdfdata/pgbackups claims with it, and CI cannot prove an upgrade is
# schema-compatible, so a failed release stays for diagnosis or a forward fix.
deploy-production:
  stage: deploy
  # Deployable only after this pipeline's image build.
  needs:
    - job: build-images
  image:
    name: alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
    entrypoint: [""]
  environment:
    name: production
  resource_group: weeklyreport-production-deploy
  interruptible: false
  rules:
    - if: '$KUBECONFIG && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
    - when: never
  script:
    - ': "${HELM_VALUES_FILE:?HELM_VALUES_FILE (file variable) is not set}"'
    - ': "${HELM_NAMESPACE:?HELM_NAMESPACE is not set}"'
    - ': "${HELM_KUBE_CONTEXT:?HELM_KUBE_CONTEXT is not set}"'
    - |
      set -eu
      set -- --kube-context "$HELM_KUBE_CONTEXT" --namespace "$HELM_NAMESPACE"
      stderr_file="$(mktemp)"
      trap 'rm -f "$stderr_file"' EXIT
      # Absence is confirmed only by Helm's own release-not-found error, which
      # the storage driver returns when no release record exists at all.
      # `list` omits records in an unknown state and skips ones it cannot
      # decode, so an empty list alone never authorizes an install.
      status=0
      history="$(helm history weeklyreport "$@" -o json 2>"$stderr_file")" || status=$?
      case "$status:$history" in
        0:*'"revision"'*) state=existing ;;
        *)
          if [ "$status" -ne 0 ] && [ "$(cat "$stderr_file")" = "Error: release: not found" ]; then
            state=absent
          else
            state=unknown
          fi
          ;;
      esac
      known="$(helm list "$@" --filter '^weeklyreport$' -q)"
      deployed="$(helm list "$@" --filter '^weeklyreport$' --deployed -q)"
      if [ "$state" = absent ] && [ -z "$known" ] && [ -z "$deployed" ]; then
        helm install weeklyreport deploy/helm/weeklyreport "$@" -f "$HELM_VALUES_FILE" --set "images.tag=$CI_COMMIT_SHA" --wait=watcher --timeout 10m
      elif [ "$state" = existing ] && [ "$known" = weeklyreport ] && [ "$deployed" = weeklyreport ]; then
        helm upgrade weeklyreport deploy/helm/weeklyreport "$@" -f "$HELM_VALUES_FILE" --set "images.tag=$CI_COMMIT_SHA" --wait=watcher --timeout 10m
      else
        echo "release weeklyreport is not confirmed as absent or deployed (history=$state known='$known' deployed='$deployed'); refusing to mutate" >&2
        cat "$stderr_file" >&2
        exit 1
      fi
