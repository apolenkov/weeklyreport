workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

# Owner decisions 2026-09-28 and 2026-10-01: GitLab CI carries lint/test lanes,
# one rootless-BuildKit image build, and an optional manual deploy — no
# Docker-in-Docker and no operational smoke. Production builds, PDF, and
# browser acceptance stay outside CI as separate required evidence.
# The disposable-database guard accepts only exact loopback targets, while
# GitLab services are reachable through DNS aliases, never through the job's
# loopback. PostgreSQL therefore runs inside each database job container on
# 127.0.0.1 — a real in-job process, not a masked service. Redis and Mailpit
# have no loopback requirement and run as ordinary service aliases.
stages:
  - toolchain
  - quality
  - dependency-scan
  - coverage
  - api-integration
  - migrate-reset
  - image
  - deploy

variables:
  GIT_DEPTH: "2"
  # The pinned pgvector job image has no Node and no curl/wget, so the Node
  # toolchain enters database jobs as a checksum-verified artifact instead of
  # a network fetch. The composite artifact also carries libatomic.so.1 from
  # the same trixie image — the slim database image lacks it and Node 26
  # links it.
  NODE_TOOLCHAIN_TARBALL: node-v26.11.1-linux-x64.tar.gz
  NODE_TOOLCHAIN_SHA256: 15fc043a51a5783f2f4b634561091658f5a7f0e3db03f997dca3a8033a33e45b
  NODE_TOOLCHAIN_ARTIFACT: node-toolchain-linux-x64.tar.gz

.node-image:
  image: node:26.11.1-trixie@sha256:32fa97f3363975684b08bf4e8a68a47c7905175cc20275b50b974bbd02aba731
  # Without this, jobs fetch artifacts from every earlier stage — the
  # node-toolchain tarball would land in the workspace as untracked residue
  # and trip the cleanliness gate. Database jobs use explicit `needs`.
  dependencies: []
  timeout: 30m
  # Serial inside one pipeline; separate pipelines may run on different runners.
  resource_group: weeklyreport-ci-heavy-$CI_PIPELINE_IID
  allow_failure: false
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-reports/
  after_script:
    - |
      mkdir -p ci-reports
      printf '# CI job summary\n\nJob: %s\nCommit: %s\nResult: %s\n' \
        "$CI_JOB_NAME" "$CI_COMMIT_SHA" "$CI_JOB_STATUS" \
        > "ci-reports/$CI_JOB_ID-summary.md"

.workspace-node:
  extends: .node-image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  before_script:
    # Node 26 no longer bundles Corepack; install only the pinned pnpm CLI here.
    - npm install --global pnpm@12.11.2
    - test "$(pnpm --version)" = "12.11.2"
    - pnpm install --frozen-lockfile
    - pnpm exec prisma generate

# Database jobs run on a pinned PostgreSQL+pgvector image. PostgreSQL starts inside the job container bound to 127.0.0.1,
# so the exact-loopback destructive guard sees a truthful target. The Node
# toolchain arrives as the verified node-toolchain artifact.
.postgres-job:
  image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
  timeout: 30m
  resource_group: weeklyreport-ci-heavy-$CI_PIPELINE_IID
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-reports/
  before_script:
    - tar -xzf "$NODE_TOOLCHAIN_ARTIFACT" -C /
    - ldconfig
    - test "$(node --version)" = "v26.11.1"
    - npm install --global pnpm@12.11.2
    - test "$(pnpm --version)" = "12.11.2"
    - pnpm install --frozen-lockfile
    - pnpm exec prisma generate
    # The postgres daemon must run as the postgres user; initdb refuses root.
    # The data directory lives in /tmp so the read-only image data volume is
    # irrelevant, and trust auth matches the throwaway per-job cluster.
    - install -d -o postgres -g postgres /tmp/pgdata
    - su postgres -s /bin/sh -c '/usr/lib/postgresql/18/bin/initdb -D /tmp/pgdata -A trust -E UTF8'
    - su postgres -s /bin/sh -c '/usr/lib/postgresql/18/bin/pg_ctl -D /tmp/pgdata -l /tmp/postgres.log -o "-h 127.0.0.1" -w -t 60 start'
    # prisma migrate reset drops and recreates the database, which needs a
    # superuser role.
    - createuser -h 127.0.0.1 -U postgres -s weeklyreport
    - createdb -h 127.0.0.1 -U postgres -O weeklyreport weeklyreport_e2e
  after_script:
    - |
      mkdir -p ci-reports
      printf '# CI job summary\n\nJob: %s\nCommit: %s\nResult: %s\n' \
        "$CI_JOB_NAME" "$CI_COMMIT_SHA" "$CI_JOB_STATUS" \
        > "ci-reports/$CI_JOB_ID-summary.md"

# The pgvector job image ships no curl/wget, so the toolchain is assembled in
# the trixie job image once — official Node tarball verified against the
# pinned SHA-256, plus the libatomic.so.1 the slim image lacks — and handed to
# database jobs as one composite artifact under /usr/local. The artifact also
# carries the CA bundle: the pgvector image has none, and pnpm 12 (rustls)
# reads the system store, so `pnpm install` fails there with UnknownIssuer.
node-toolchain:
  extends: .node-image
  stage: toolchain
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success
  artifacts:
    when: on_success
    expire_in: 1 day
    paths:
      - node-toolchain-linux-x64.tar.gz
  script:
    - curl -fsSLO "https://nodejs.org/dist/v26.11.1/$NODE_TOOLCHAIN_TARBALL"
    - echo "$NODE_TOOLCHAIN_SHA256  $NODE_TOOLCHAIN_TARBALL" | sha256sum -c -
    - mkdir -p toolchain-root/usr/local/lib
    - tar -xzf "$NODE_TOOLCHAIN_TARBALL" -C toolchain-root/usr/local --strip-components=1
    - cp /usr/lib/x86_64-linux-gnu/libatomic.so.1 toolchain-root/usr/local/lib/
    - mkdir -p toolchain-root/etc/ssl/certs
    - cp /etc/ssl/certs/ca-certificates.crt toolchain-root/etc/ssl/certs/
    - tar -czf "$NODE_TOOLCHAIN_ARTIFACT" -C toolchain-root usr etc

quality:
  extends: .workspace-node
  stage: quality
  variables:
    DATABASE_URL: postgresql://weeklyreport:localdev@127.0.0.1:5432/weeklyreport_generate_only
    API_URL: http://127.0.0.1:3002
    NODE_OPTIONS: --max-old-space-size=8192
    HELM_VERSION: "4.3.0"
    HELM_SHA256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb
  before_script:
    - !reference [.workspace-node, before_script]
    # The chart gate renders the Helm chart (no cluster needed): pinned CLI.
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
    - echo "$HELM_SHA256  /tmp/helm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
    - helm version --short
  script:
    # MR commit messages follow Conventional Commits (commitlint.config.ts).
    # GIT_DEPTH 2 hides the MR range, so deepen the clone first.
    - |
      if [ "$CI_PIPELINE_SOURCE" = merge_request_event ]; then
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --quiet; fi
        pnpm exec commitlint --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to "$CI_COMMIT_SHA"
      fi
    - pnpm lint
    - pnpm format:check
    - pnpm spec:check
    - pnpm typecheck
    - pnpm test

dependency-scan:
  extends: .node-image
  stage: dependency-scan
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - pnpm-lock.yaml
        - package.json
        - "**/package.json"
        - pnpm-workspace.yaml
    - when: never
  before_script:
    - npm install --global pnpm@12.11.2
    - test "$(pnpm --version)" = "12.11.2"
    - pnpm install --frozen-lockfile
  script:
    - pnpm audit --prod

# Dev tooling ships nowhere, so its advisories warn (pipeline status "passed
# with warnings") instead of failing the lane; rules are inherited.
dependency-scan-dev:
  extends: dependency-scan
  allow_failure: true
  script:
    - pnpm audit --dev --audit-level high

# Weekly dependency MRs. The token is a masked CI/CD variable, never in Git;
# without it the job is not created. The image runs without Docker-in-Docker.
renovate:
  stage: dependency-scan
  image:
    name: renovate/renovate:44.148.4@sha256:2c7b118cb2d1b7137e63322efc0e1d3d96d5f6937ec1c35c3cd9b7de73a8ed29
    entrypoint: [""]
  timeout: 30m
  needs: []
  rules:
    - if: '$RENOVATE_TOKEN && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")'
    - when: never
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_ONBOARDING: "false"
    LOG_LEVEL: info
  script:
    - renovate "$CI_PROJECT_PATH"

coverage:
  extends: .workspace-node
  stage: coverage
  needs:
    - job: quality
      artifacts: false
  variables:
    DATABASE_URL: postgresql://weeklyreport:localdev@127.0.0.1:5432/weeklyreport_generate_only
    API_URL: http://127.0.0.1:3002
    NODE_OPTIONS: --max-old-space-size=8192
  script:
    - mkdir -p ci-reports
    - VITEST_JSON_OUTPUT_FILE="$CI_PROJECT_DIR/ci-reports/web-coverage-vitest.json" pnpm --filter @weeklyreport/web test:coverage
    - |
      node --input-type=module <<'NODE'
      import { readFileSync, writeFileSync } from "node:fs";

      const results = JSON.parse(
        readFileSync("ci-reports/web-coverage-vitest.json", "utf8"),
      );
      const summary = JSON.parse(
        readFileSync("apps/web/coverage/coverage-summary.json", "utf8"),
      );
      const counts = [
        results.numTotalTests,
        results.numPassedTests,
        results.numFailedTests,
      ];
      const percentages = [
        summary.total?.statements?.pct,
        summary.total?.branches?.pct,
        summary.total?.functions?.pct,
        summary.total?.lines?.pct,
      ];
      if (
        !counts.every(
          (value) => Number.isInteger(value) && value >= 0,
        ) ||
        !percentages.every((value) => typeof value === "number")
      ) {
        throw new Error("Web coverage evidence is invalid or incomplete.");
      }

      const row =
        "| Web unit coverage | " +
        counts.join(" | ") +
        " | " +
        percentages.map((value) => value + "%").join(" | ") +
        " |";
      const report = [
        "# Web coverage",
        "",
        "Commit: " + process.env.CI_COMMIT_SHA,
        "",
        "| Suite | Tests | Passed | Failed | Statements | Branches | Functions | Lines |",
        "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
        row,
        "",
      ].join("\n");
      writeFileSync("ci-reports/web-coverage-summary.md", report);
      process.stdout.write(report);
      NODE

api-integration:
  extends: .postgres-job
  stage: api-integration
  # The serial API coverage contour is the heaviest lane; 30m killed it at
  # SIGTERM on the first real run.
  timeout: 90m
  needs:
    - job: quality
      artifacts: false
    - job: node-toolchain
      artifacts: true
  # Redis and Mailpit are ordinary service aliases — the guard constrains only
  # the PostgreSQL target. The test suite reads their real hostnames from env.
  services:
    - name: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
      alias: redis
    - name: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
      alias: mailpit
  variables:
    # MVP single-database policy: one disposable loopback target per job, and
    # both URLs must resolve to the same target before cleanup runs.
    DATABASE_URL: postgresql://weeklyreport:localdev@127.0.0.1:5432/weeklyreport_e2e
    E2E_DATABASE_URL: postgresql://weeklyreport:localdev@127.0.0.1:5432/weeklyreport_e2e
    API_HOST: 127.0.0.1
    NODE_ENV: test
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_DB: "15"
    REDIS_MAXMEMORY_BYTES: "209715200"
    PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION: "давай"
    REQUIRED_INTEGRATION_DEPS: "true"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_FROM: integration@weeklyreport.local
    MAILPIT_API_URL: http://mailpit:8025
  script:
    # Fail fast on unreachable service aliases instead of hanging a test.
    - |
      node --input-type=module <<'NODE'
      import { connect } from "node:net";

      const probe = (host, port, label) =>
        new Promise((resolve, reject) => {
          const socket = connect({ host, port, timeout: 5000 });
          socket.once("connect", () => {
            socket.destroy();
            console.log(label + " reachable at " + host + ":" + port);
            resolve();
          });
          socket.once("timeout", () => {
            socket.destroy();
            reject(new Error(label + " connect timeout at " + host + ":" + port));
          });
          socket.once("error", reject);
        });

      await probe("redis", 6379, "redis");
      await probe("mailpit", 1025, "mailpit-smtp");
      await probe("mailpit", 8025, "mailpit-api");
      NODE
    - pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
    # Verbose reporter keeps per-test lines in the trace so a serial-suite
    # stall names its test; the JSON reporter still feeds the summary gate.
    - pnpm --filter @weeklyreport/api test:coverage --reporter=verbose --reporter=json "--outputFile.json=$CI_PROJECT_DIR/ci-reports/api-verification-vitest.json"
    - |
      node --input-type=module <<'NODE'
      import { readFileSync, writeFileSync } from "node:fs";

      const results = JSON.parse(
        readFileSync("ci-reports/api-verification-vitest.json", "utf8"),
      );
      const summary = JSON.parse(
        readFileSync("apps/api/coverage/coverage-summary.json", "utf8"),
      );
      const counts = [
        results.numTotalTests,
        results.numPassedTests,
        results.numFailedTests,
      ];
      const percentages = [
        summary.total?.statements?.pct,
        summary.total?.branches?.pct,
        summary.total?.functions?.pct,
        summary.total?.lines?.pct,
      ];
      if (
        !counts.every(
          (value) => Number.isInteger(value) && value >= 0,
        ) ||
        !percentages.every((value) => typeof value === "number")
      ) {
        throw new Error("API coverage evidence is invalid or incomplete.");
      }

      const row =
        "| API unit + serial integration coverage | " +
        counts.join(" | ") +
        " | " +
        percentages.map((value) => value + "%").join(" | ") +
        " | " +
        "passed" +
        " |";
      const report = [
        "# API verification",
        "",
        "Commit: " + process.env.CI_COMMIT_SHA,
        "",
        "| Lane | Tests | Passed | Failed | Statements | Branches | Functions | Lines | Result |",
        "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- |",
        row,
        "",
      ].join("\n");
      writeFileSync("ci-reports/api-verification-summary.md", report);
      process.stdout.write(report);
      NODE
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-reports/
      - apps/api/coverage/coverage-summary.json

migrate-reset:
  extends: .postgres-job
  stage: migrate-reset
  needs:
    - job: api-integration
      artifacts: false
    - job: node-toolchain
      artifacts: true
  variables:
    DATABASE_URL: postgresql://weeklyreport:localdev@127.0.0.1:5432/weeklyreport_e2e
    NODE_ENV: test
  script:
    - PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION="давай" pnpm exec tsx prisma/operations/migrate-reset.ts
    - PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION="давай" pnpm --dir apps/api exec tsx ../../prisma/seeds/profiles/seed-profile.ts full

# Rootless BuildKit, daemonless: no Docker-in-Docker and no Docker socket.
# The registry defaults to the project registry; IMAGE_REGISTRY* override it.
# Runs by itself on the default branch and on tags once the web build
# variables exist; until then (and on merge requests) it is manual and never
# turns the pipeline red.
build-images:
  stage: image
  image:
    name: moby/buildkit:v0.34.0-rootless@sha256:65eca3c01cd1180c8f64565c4e3c5983af5145818b0e6fa863385d099eb73855
    entrypoint: [""]
  timeout: 45m
  resource_group: weeklyreport-ci-heavy-$CI_PIPELINE_IID
  variables:
    # Job-side mitigation for a runner whose default seccomp/AppArmor profile
    # denies rootless buildkitd its worker sandbox (mount proc: operation not
    # permitted); the alternative is an unconfined runner profile.
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: "($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH) && $WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING"
      when: on_success
    - if: "$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
      allow_failure: true
    - when: never
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - image-digests.txt
  script:
    - |
      set -eu
      REGISTRY="${IMAGE_REGISTRY:-${CI_REGISTRY_IMAGE:-}}"
      REGISTRY_USER="${IMAGE_REGISTRY_USER:-${CI_REGISTRY_USER:-}}"
      REGISTRY_PASSWORD="${IMAGE_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-}}"
      : "${REGISTRY:?no image registry: set IMAGE_REGISTRY or enable the project container registry}"
      : "${REGISTRY_USER:?no registry user: set IMAGE_REGISTRY_USER}"
      : "${REGISTRY_PASSWORD:?no registry password: set IMAGE_REGISTRY_PASSWORD}"
      : "${WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING:?WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING is not set}"
      : "${WR_NEXT_PUBLIC_WEB_VITALS:?WR_NEXT_PUBLIC_WEB_VITALS is not set}"
      : "${WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED:?WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED is not set}"
      : "${WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES:?WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES is not set}"

      # Credentials live only in a job-local config.json and are never echoed.
      # The config must stay outside $CI_PROJECT_DIR: every `--local context=.`
      # build would otherwise ship it into the pruner stage's `COPY . .`.
      export DOCKER_CONFIG="$(mktemp -d)"
      auth="$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY%%/*}" "$auth" > "$DOCKER_CONFIG/config.json"

      : > image-digests.txt
      # build_push NAME CONTEXT DOCKERFILE [buildctl options...]
      build_push() {
        name="$1"; context="$2"; dockerfile="$3"; shift 3
        buildctl-daemonless.sh build \
          --frontend dockerfile.v0 \
          --local "context=$context" --local "dockerfile=$context" \
          --opt "filename=$dockerfile" "$@" \
          --output "type=image,name=$REGISTRY/$name:$CI_COMMIT_SHA,push=true" \
          --metadata-file "$name.meta.json"
        digest="$(sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' "$name.meta.json")"
        : "${digest:?no digest recorded for $name}"
        printf '%s=%s/%s@%s\n' "$name" "$REGISTRY" "$name" "$digest" >> image-digests.txt
      }

      build_push api . Dockerfile.api --opt "build-arg:BUILD_VERSION=$CI_COMMIT_SHA"
      build_push migrate . Dockerfile.api --opt target=migrator --opt "build-arg:BUILD_VERSION=$CI_COMMIT_SHA"
      build_push web . Dockerfile.web \
        --opt build-arg:API_URL=http://api:3001 \
        --opt build-arg:NEXT_PUBLIC_AUTH_STUB=false \
        --opt build-arg:NEXT_PUBLIC_DEV_ROLE_SWITCHER=false \
        --opt "build-arg:NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}" \
        --opt "build-arg:NEXT_PUBLIC_APP_VERSION=$CI_COMMIT_SHA" \
        --opt "build-arg:NEXT_PUBLIC_CLIENT_LOG_FORWARDING=$WR_NEXT_PUBLIC_CLIENT_LOG_FORWARDING" \
        --opt "build-arg:NEXT_PUBLIC_WEB_VITALS=$WR_NEXT_PUBLIC_WEB_VITALS" \
        --opt "build-arg:NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED=$WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED" \
        --opt "build-arg:NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES=$WR_NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES"
      build_push backup deploy/postgres Dockerfile.backup --opt "build-arg:BUILD_VERSION=$CI_COMMIT_SHA"
      cat image-digests.txt

# Defined only when DevOps supplies a file-type KUBECONFIG variable. The values
# file (HELM_VALUES_FILE, file-type) and HELM_NAMESPACE come from CI variables;
# no cluster credential lives in the repository. --atomic waits for readiness
# and rolls the release back on failure; it cannot undo a database migration.
deploy-production:
  stage: deploy
  # Deployable only after this pipeline's image build.
  needs:
    - job: build-images
  image:
    name: alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
    entrypoint: [""]
  environment:
    name: production
  resource_group: weeklyreport-production-deploy
  rules:
    - if: '$KUBECONFIG && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
    - when: never
  script:
    - ': "${HELM_VALUES_FILE:?HELM_VALUES_FILE (file variable) is not set}"'
    - ': "${HELM_NAMESPACE:?HELM_NAMESPACE is not set}"'
    - helm upgrade --install weeklyreport deploy/helm/weeklyreport --namespace "$HELM_NAMESPACE" -f "$HELM_VALUES_FILE" --set "images.tag=$CI_COMMIT_SHA" --atomic --timeout 10m
