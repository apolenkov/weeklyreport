services:
  postgres:
    image: postgres:15-alpine
    # 39-03: load pg_stat_statements so we can mine real slow-query stats
    # from the running dev DB. The extension itself is created via the
    # init script below on first boot. log_min_duration_statement=200 logs
    # any SQL > 200ms to docker stderr — visible via `docker logs postgres`.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "log_min_duration_statement=200"
    environment:
      POSTGRES_USER: customreport
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
      POSTGRES_DB: customreport_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-pg-stat-statements.sql:/docker-entrypoint-initdb.d/01-pg-stat-statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customreport"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Phase 33-04: migrated mailhog (amd64-only via Rosetta) → mailpit. Mailpit
  # is a multi-arch fork by axllent — same SMTP :1025 + Web UI :8025 contract,
  # native arm64 image, actively maintained, modern UI. Keep service name
  # `mailhog` so existing SMTP_HOST=mailhog env wiring still works without
  # touching every consumer.
  mailhog:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrator
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://customreport:${DB_PASSWORD:-localdev}@postgres:5432/customreport_dev
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 36-03: this is the DEV compose (mailhog catch-all, exposed ports,
      # dev secrets, AUTH_DEV_MODE on). Production uses docker-compose.prod.yml.
      # The boot fence in env.schema.ts now refuses to start when both
      # NODE_ENV=production AND AUTH_DEV_MODE=true; keeping NODE_ENV=development
      # here matches the actual purpose of this compose.
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-development-min-32-chars!!}
      PDF_BASE_URL: http://web:3000
      PDF_OUTPUT_DIR: /app/data/pdfs
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3002/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "3002:3002"
    volumes:
      - pdfdata:/app/data/pdfs

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: installer
      args:
        API_URL: http://api:3002
        NEXT_PUBLIC_API_URL: http://localhost:3002
        NEXT_PUBLIC_AUTH_STUB: "true"
        NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
    command: pnpm --filter @customreport/web exec next dev --webpack -H 0.0.0.0 -p 3000
    environment:
      NODE_ENV: development
      API_URL: http://api:3002
      NEXT_PUBLIC_API_URL: http://localhost:3002
      NEXT_PUBLIC_AUTH_STUB: "true"
      NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
      NEXT_DIST_DIR: .next-docker-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  pdfdata:
