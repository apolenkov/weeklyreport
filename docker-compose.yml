services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg15-bookworm@sha256:a947c45cdc5906a1bc951f20a8709e321256343ee0f251e4ae00b5e7def4e6da
    # Load pg_stat_statements so we can mine real slow-query stats
    # from the running dev DB. The extension itself is created via the
    # init script below on first boot. log_min_duration_statement=200 logs
    # any SQL > 200ms to docker stderr — visible via `docker logs postgres`.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "log_min_duration_statement=200"
    environment:
      POSTGRES_USER: customreport
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: customreport_e2e
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-pg-stat-statements.sql:/docker-entrypoint-initdb.d/01-pg-stat-statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customreport -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  # Mailpit is a multi-arch image by axllent — SMTP :1025 + Web UI :8025.
  mailpit:
    image: axllent/mailpit:v1.31.0@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--maxmemory",
        "200mb",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrator
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://customreport:localdev@postgres:5432/customreport_e2e
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://customreport:localdev@postgres:5432/customreport_e2e
      PORT: 3002
      API_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_MAXMEMORY_BYTES: 209715200
      DB_POOL_MAX: 10
      DB_POOL_IDLE_TIMEOUT_MS: 10000
      DB_POOL_CONNECTION_TIMEOUT_MS: 0
      # Compose is a self-contained local lane. These values match
      # .env.example, keep required AI configuration explicit, and retain the
      # non-secret development key solely for local boot. This lane never
      # approves report-derived data for outbound provider requests.
      AI_PROVIDER_CONFIG_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AI_PROVIDER_CONFIG_KEY_VERSION: 1
      AI_PROVIDER_ALLOWED_ORIGINS: https://api.mistral.ai,https://openrouter.ai,https://api.groq.com,https://api.jina.ai,https://api.openai.com
      REPORT_ASSISTANT_OUTBOUND_DATA_APPROVED: "false"
      REPORT_ASSISTANT_INPUT_VERSION: 1
      REPORT_ASSISTANT_SIMILARITY_THRESHOLD: 0.55
      REPORT_ASSISTANT_CANDIDATE_LIMIT: 500
      REPORT_ASSISTANT_READ_THROUGH_LIMIT: 16
      REPORT_ASSISTANT_EXHAUSTIVE_LIMIT: 200
      REPORT_ASSISTANT_CONTEXT_TOKEN_BUDGET: 8000
      REPORT_ASSISTANT_PROVIDER_TIMEOUT_MS: 30000
      REPORT_ASSISTANT_PLANNER_MAX_TOKENS: 1500
      REPORT_ASSISTANT_ANSWER_MAX_TOKENS: 2000
      REPORT_ASSISTANT_EMBEDDING_BATCH_SIZE: 32
      REPORT_ASSISTANT_EMBEDDING_TOKEN_BUDGET: 8000
      # This is the DEV compose (Mailpit catch-all, exposed ports,
      # dev secrets, AUTH_DEV_MODE on). Production uses docker-compose.prod.yml.
      # The boot fence in env.schema.ts refuses to start when both
      # NODE_ENV=production AND AUTH_DEV_MODE=true; keeping NODE_ENV=development
      # here matches the actual purpose of this compose.
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AUTH_DEV_MODE: "true"
      PRODUCT_FEEDBACK_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-development-min-32-chars!!}
      PDF_BASE_URL: http://web:3000
      PDF_OUTPUT_DIR: /app/data/pdfs
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:-dev-only-replace-in-production-min-32-chars}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      # Inert while the SDK stays disabled above.
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      HEAP_HEALTH_THRESHOLD_BYTES: ${HEAP_HEALTH_THRESHOLD_BYTES:-1610612736}
      SMTP_HOST: mailpit
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      # Optional coverage vars (all .optional() in envSchema, each defaulting to
      # its consumer behaviour when absent): SENTRY_DSN,
      # CLIENT_LOG_FORWARDING, AUTH_DEV_MODE_ALLOW_TEST, CUSTOMREPORT_REPO_ROOT,
      # DLQ_ALERT_THRESHOLD. Add a pass-through line only to
      # override a default. See .env.example.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3002/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - pdfdata:/app/data/pdfs

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: installer
    command: pnpm --filter @customreport/web exec next dev --webpack -H 0.0.0.0 -p 3000
    environment:
      NODE_ENV: development
      API_URL: http://api:3002
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_AUTH_STUB: "true"
      NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
      NEXT_PUBLIC_PRODUCT_FEEDBACK_ENABLED: "true"
      NEXT_PUBLIC_PRODUCT_FEEDBACK_INBOX_ROLES: "admin"
      NEXT_DIST_DIR: .next-docker-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  pdfdata:
