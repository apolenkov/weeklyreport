services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    # Load pg_stat_statements so we can mine real slow-query stats
    # from the running dev DB. The extension itself is created via the
    # init script below on first boot. log_min_duration_statement=200 logs
    # any SQL > 200ms to docker stderr — visible via `docker logs postgres`.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "log_min_duration_statement=200"
    environment:
      POSTGRES_USER: customreport
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: customreport_e2e
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-pg-stat-statements.sql:/docker-entrypoint-initdb.d/01-pg-stat-statements.sql:ro
    healthcheck:
      # `postgres` exists on both legacy and fresh named volumes. The one-shot
      # initializer below owns creation of the exact application database.
      test: ["CMD-SHELL", "pg_isready -U customreport -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  local-database-init:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    command:
      - "psql"
      - "--host=postgres"
      - "--username=customreport"
      - "--dbname=postgres"
      - "--set=ON_ERROR_STOP=1"
      - "--file=/opt/customreport/ensure-local-database.sql"
    environment:
      PGPASSWORD: localdev
    volumes:
      - ./deploy/postgres/ensure-local-database.sql:/opt/customreport/ensure-local-database.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Mailpit is a multi-arch image by axllent — SMTP :1025 + Web UI :8025.
  mailpit:
    image: axllent/mailpit:latest@sha256:5a49a77c5bdbe7c5474450b4f46348d09949df3695257729c93a30369382d4f6
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--maxmemory",
        "200mb",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrator
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://customreport:localdev@postgres:5432/customreport_e2e
    depends_on:
      local-database-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://customreport:localdev@postgres:5432/customreport_e2e
      PORT: 3002
      API_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_MAXMEMORY_BYTES: 209715200
      # This is the DEV compose (Mailpit catch-all, exposed ports,
      # dev secrets, AUTH_DEV_MODE on). Production uses docker-compose.prod.yml.
      # The boot fence in env.schema.ts now refuses to start when both
      # NODE_ENV=production AND AUTH_DEV_MODE=true; keeping NODE_ENV=development
      # here matches the actual purpose of this compose.
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      AUTH_DEV_MODE: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-development-min-32-chars!!}
      PDF_BASE_URL: http://web:3000
      PDF_OUTPUT_DIR: /app/data/pdfs
      PDF_EXPORT_JWT_SECRET: ${PDF_EXPORT_JWT_SECRET:-dev-only-replace-in-production-min-32-chars}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      # Inert while the SDK stays disabled above.
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      HEAP_HEALTH_THRESHOLD_BYTES: ${HEAP_HEALTH_THRESHOLD_BYTES:-1610612736}
      SMTP_HOST: mailpit
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      # Optional coverage vars (all .optional() in envSchema, each defaulting to
      # its consumer behaviour when absent): SENTRY_DSN,
      # CLIENT_LOG_FORWARDING, AUTH_DEV_MODE_ALLOW_TEST, CUSTOMREPORT_REPO_ROOT,
      # DLQ_ALERT_THRESHOLD, AUTH_JWT_COOKIE_NAME. Add a pass-through line only to
      # override a default. See .env.example.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:3002/health/live || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - pdfdata:/app/data/pdfs

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: installer
      args:
        API_URL: http://api:3002
        NEXT_PUBLIC_API_URL: http://localhost:3002
        NEXT_PUBLIC_AUTH_STUB: "true"
        NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
    command: pnpm --filter @customreport/web exec next dev --webpack -H 0.0.0.0 -p 3000
    environment:
      NODE_ENV: development
      API_URL: http://api:3002
      NEXT_PUBLIC_API_URL: http://localhost:3002
      NEXT_PUBLIC_AUTH_STUB: "true"
      NEXT_PUBLIC_DEV_ROLE_SWITCHER: "true"
      NEXT_DIST_DIR: .next-docker-dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  pdfdata:
